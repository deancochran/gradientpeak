name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

jobs:
  ci:
    name: Basic checks
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable pnpm from packageManager
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format, lint, and architecture baseline
        run: pnpm check:ci

      - name: Type check
        run: pnpm check-types

      - name: Start local database
        run: pnpm --filter @repo/db self-host:up

      - name: Verify database migrations
        run: pnpm --filter @repo/db db:verify

      - name: Run live database tests
        run: pnpm --filter @repo/api test:live-db

      - name: Stop local database
        if: always()
        run: pnpm --filter @repo/db self-host:down

      - name: Tests
        run: pnpm test

      - name: Production build
        run: pnpm build
