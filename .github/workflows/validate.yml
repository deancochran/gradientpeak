name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BETTER_AUTH_SECRET: ci-build-secret-gradientpeak-2026-validate-32chars
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  NEXT_PRIVATE_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PRIVATE_SUPABASE_SECRET_KEY: ci-build-service-role-key
  SUPABASE_SERVICE_ROLE_KEY: ci-build-service-role-key

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.filter.outputs.docs == 'true' && steps.filter.outputs.non_docs != 'true' }}
      api_live_db_related: ${{ steps.filter.outputs.api_live_db_related }}
      db_schema_related: ${{ steps.filter.outputs.db_schema_related }}
      mobile_runtime_related: ${{ steps.filter.outputs.mobile_runtime_related }}
      web_related: ${{ steps.filter.outputs.web_related }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect docs-only changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - '**/*.md'
              - '**/*.mdx'
              - 'docs/**'
            non_docs:
              - '**'
              - '!**/*.md'
              - '!**/*.mdx'
              - '!docs/**'
            mobile_runtime_related:
              - 'apps/mobile/**'
              - '!apps/mobile/.maestro/**'
              - 'packages/api/**'
              - 'packages/auth/**'
              - 'packages/core/**'
              - 'packages/db/**'
              - 'packages/tailwindcss/**'
              - 'packages/ui/**'
              - 'tooling/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            db_schema_related:
              - 'packages/db/**'
            api_live_db_related:
              - 'packages/api/**'
              - 'packages/auth/**'
              - 'packages/core/**'
              - 'packages/db/**'
              - 'apps/web/**'
              - '.github/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            web_related:
              - 'apps/web/**'
              - 'packages/api/**'
              - 'packages/auth/**'
              - 'packages/core/**'
              - 'packages/db/**'
              - 'packages/tailwindcss/**'
              - 'packages/ui/**'
              - 'tooling/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'

  docs-only:
    name: Docs Only
    runs-on: ubuntu-latest
    needs:
      - changes
    if: needs.changes.outputs.docs_only == 'true'

    steps:
      - name: Skip full validation for docs-only changes
        run: |
          printf 'Docs-only change detected; skipping full validation suite.\n'

  quality-and-build:
    name: Quality And Build
    runs-on: ubuntu-latest
    needs:
      - changes
    if: needs.changes.outputs.docs_only != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome CI
        run: pnpm check:ci

      - name: Test validation gate contract
        run: node --test .github/scripts/validation-gate.test.mjs

      - name: Run type checks
        run: pnpm check-types

      - name: Run builds
        run: pnpm build

      - name: Run unit and integration tests
        run: pnpm test

      - name: Check unused code
        run: pnpm knip

      - name: Verify browser acceptance isolation
        run: pnpm --filter web exec vitest run --config e2e/acceptance/vitest.config.ts

      - name: Run static DB verification
        if: needs.changes.outputs.db_schema_related == 'true'
        run: pnpm --filter @repo/db db:verify:static

  api-live-db:
    name: Database And Browser Acceptance
    runs-on: ubuntu-latest
    needs:
      - changes
    if: needs.changes.outputs.docs_only != 'true'

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: acceptance-only
          POSTGRES_DB: gradientpeak_fresh_0123456789abcdef
        options: >-
          --publish 127.0.0.1:54329:5432
          --label com.gradientpeak.disposable=true
          --label com.gradientpeak.target-id=0123456789abcdef
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 1s --health-timeout 5s --health-retries 60
    env:
      DB_DISPOSABLE_TARGET: "1"
      DB_DISPOSABLE_TARGET_ID: "0123456789abcdef"
      DB_DISPOSABLE_DATABASE: gradientpeak_fresh_0123456789abcdef
      DATABASE_URL: postgresql://postgres:acceptance-only@127.0.0.1:54329/gradientpeak_fresh_0123456789abcdef
      POSTGRES_URL: postgresql://postgres:acceptance-only@127.0.0.1:54329/gradientpeak_fresh_0123456789abcdef
      SUPABASE_DB_URL: postgresql://postgres:acceptance-only@127.0.0.1:54329/gradientpeak_fresh_0123456789abcdef

    steps:
      - name: Checkout
        if: needs.changes.outputs.api_live_db_related == 'true'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: needs.changes.outputs.api_live_db_related == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        if: needs.changes.outputs.api_live_db_related == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: needs.changes.outputs.api_live_db_related == 'true'
        run: pnpm install --frozen-lockfile

      - name: Prepare verified fresh database
        if: needs.changes.outputs.api_live_db_related == 'true'
        env:
          DB_ACCEPTANCE_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: pnpm --filter @repo/db db:acceptance:prepare

      - name: Run API live DB smoke tests
        if: needs.changes.outputs.api_live_db_related == 'true'
        run: pnpm --filter @repo/api test:live-db

      - name: Install Chromium
        if: needs.changes.outputs.api_live_db_related == 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run authenticated browser acceptance
        if: needs.changes.outputs.api_live_db_related == 'true'
        env:
          DB_ACCEPTANCE_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: pnpm --filter web exec playwright test --config playwright.acceptance.config.ts

      - name: Skip live DB smoke when API and DB are unchanged
        if: needs.changes.outputs.api_live_db_related != 'true'
        run: |
          printf 'No API or DB changes detected; skipping API live DB smoke tests.\n'

  mobile-component-and-jest:
    name: Mobile Component And Jest
    runs-on: ubuntu-latest
    needs:
      - changes
    if: needs.changes.outputs.docs_only != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run mobile Jest tests
        run: pnpm --filter mobile test:jest

      - name: Bundle iOS with Metro
        env:
          CI: "1"
          EXPO_NO_DOTENV: "1"
          EXPO_PUBLIC_API_URL: http://127.0.0.1:3100
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
        run: pnpm --filter mobile exec expo export --platform ios --output-dir ../../.tmp/ci-ios-export

  full-validation-suite:
    name: Basic checks
    runs-on: ubuntu-latest
    needs:
      - changes
      - docs-only
      - quality-and-build
      - api-live-db
      - mobile-component-and-jest
    if: always()

    steps:
      - name: Checkout gate implementation
        uses: actions/checkout@v4

      - name: Require successful validation jobs
        env:
          VALIDATION_NEEDS: ${{ toJSON(needs) }}
        run: node .github/scripts/validation-gate.mjs
