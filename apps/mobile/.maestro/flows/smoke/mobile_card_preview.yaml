appId: ${MAESTRO_APP_ID}
properties:
  lifecyclePolicy: system-ui
tags: [smoke, smoke-expected-pass, system-ui]
---
- runFlow:
    file: ../reusable/clean_app_launch_signed_out.yaml
- openLink: "${MAESTRO_APP_SCHEME}://storybook?surface=mobile-cards"
- assertVisible: "E2E_RUNTIME_ERRORS=0"
- assertVisible:
    id: "mobile-card-matrix"
- assertVisible:
    id: "mobile-card-activity"
- scrollUntilVisible:
    element:
      id: "mobile-card-activity-plan"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "mobile-card-training-plan"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "mobile-card-route"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "mobile-card-group"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "mobile-card-group-event"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "mobile-card-profile"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "mobile-card-calendar"
    direction: DOWN
- assertVisible: "E2E_RUNTIME_ERRORS=0"
