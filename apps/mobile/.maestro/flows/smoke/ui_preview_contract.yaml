appId: ${MAESTRO_APP_ID}
properties:
  lifecyclePolicy: system-ui
tags: [smoke, smoke-expected-pass, system-ui]
---
- runFlow:
    file: ../reusable/clean_app_launch_signed_out.yaml
- openLink: "${MAESTRO_APP_SCHEME}://storybook"
- assertVisible: "E2E_RUNTIME_ERRORS=0"
- assertVisible:
    id: "ui-preview-surface"
- assertVisible:
    id: "ui-preview-scenario-account-controls"
- assertVisible:
    id: "profile-card"
- assertVisible:
    id: "auth-email"
- assertVisible:
    id: "settings-save"
- scrollUntilVisible:
    element:
      id: "ui-preview-scenario-plan-tabs"
    direction: DOWN
- assertVisible:
    id: "settings-tabs"
- assertVisible:
    id: "settings-tabs-trigger-overview"
- scrollUntilVisible:
    element:
      id: "settings-tabs-content-overview"
    direction: DOWN
- tapOn:
    id: "settings-tabs-trigger-sessions"
- assertVisible:
    id: "settings-tabs-content-sessions"
- scrollUntilVisible:
    element:
      id: "ui-preview-scenario-feedback-states"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "ui-preview-scenario-selection-controls"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "session-focus-select"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "preferred-activity-category-radio-group"
    direction: DOWN
- tapOn:
    id: "accept-terms-checkbox"
- tapOn:
    id: "email-notifications-switch"
- scrollUntilVisible:
    element:
      id: "ui-preview-scenario-form-fields"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "ui-preview-form-bio"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "ui-preview-form-activity-category"
    direction: DOWN
- tapOn:
    id: "ui-preview-form-username"
- eraseText
- hideKeyboard
- tapOn:
    id: "ui-preview-form-is-public"
- tapOn:
    id: "ui-preview-form-submit"
- assertVisible: "Username is required."
- assertVisible: "E2E_RUNTIME_ERRORS=0"
