appId: ${MAESTRO_APP_ID}
# @purpose Open one accessible group event by canonical app link.
# @arg GROUP_EVENT_ID uuid required
# @ready group-event-detail-screen
---
- openLink: "${MAESTRO_APP_SCHEME}://group-event-detail?groupEventId=${GROUP_EVENT_ID}"
- assertVisible: { id: "group-event-detail-screen" }
