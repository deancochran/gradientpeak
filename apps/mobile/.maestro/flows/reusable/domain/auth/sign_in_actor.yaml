appId: ${MAESTRO_APP_ID}
# @purpose Sign in one fixture actor from the signed-out screen.
# @arg ACTOR_EMAIL email required
# @arg ACTOR_PASSWORD secret required
# @ready tab-button-home
---
- runFlow: ../../require_signed_out.yaml
- tapOn: { id: "email-input" }
- waitForAnimationToEnd
- inputText: "x"
- eraseText: 1
- inputText: "${ACTOR_EMAIL}"
- tapOn: { id: "password-input" }
- waitForAnimationToEnd
- inputText: "x"
- eraseText: 1
- inputText: "${ACTOR_PASSWORD}"
- hideKeyboard
- tapOn: { id: "sign-in-button", retryTapIfNoChange: true }
- extendedWaitUntil: { visible: { id: "tab-button-home" }, timeout: 20000 }
- assertNotVisible: { id: "sign-in-screen" }
