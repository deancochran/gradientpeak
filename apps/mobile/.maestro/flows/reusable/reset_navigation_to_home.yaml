appId: ${MAESTRO_APP_ID}
---
# Navigation only: this does not clear app data, caches, auth, or backend state.
- runFlow:
    when:
      visible:
        id: "discover-screen"
    commands:
      - hideKeyboard
      - back
- tapOn:
    id: "tab-button-home"
- runFlow: ./require_authenticated_home.yaml
