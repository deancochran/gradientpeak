# @arg STANDARD_USER_EMAIL email required
# @arg STANDARD_USER_PASS secret required
# @arg TARGET_USERNAME text required
# @arg TARGET_USER_ID identifier required
appId: ${MAESTRO_APP_ID}
---
- runFlow:
    file: ./authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- runFlow:
    file: ./open_discover_tab.yaml
- tapOn:
    id: "discover-scope-users"
- tapOn:
    id: "discover-search-input"
- inputText: "${TARGET_USERNAME}"
- extendedWaitUntil:
    visible:
      id: "discover-user-${TARGET_USER_ID}"
    timeout: 10000
- tapOn:
    id: "discover-user-${TARGET_USER_ID}"
- extendedWaitUntil:
    visible:
      id: "user-detail-screen"
    timeout: 10000
