# @arg email email required
# @arg password secret required
appId: ${MAESTRO_APP_ID}
---
- runFlow: ./require_signed_out.yaml
- tapOn:
    id: "email-input"
- waitForAnimationToEnd
- inputText: "x"
- eraseText: 1
- inputText: "${email}"
- tapOn:
    id: "password-input"
- waitForAnimationToEnd
- inputText: "x"
- eraseText: 1
- inputText: "${password}"
- hideKeyboard
- tapOn:
    id: "sign-in-button"
- extendedWaitUntil:
    visible:
      id: "tab-button-home"
    timeout: 20000
- assertNotVisible:
    id: "sign-in-screen"
