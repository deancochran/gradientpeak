# @arg STANDARD_USER_EMAIL email required
# @arg STANDARD_USER_PASS secret required
appId: ${MAESTRO_APP_ID}
---
- runFlow: ./clean_app_launch_signed_out.yaml
- runFlow:
    file: ./domain/auth/sign_in_actor.yaml
    env:
      ACTOR_EMAIL: "${STANDARD_USER_EMAIL}"
      ACTOR_PASSWORD: "${STANDARD_USER_PASS}"
- runFlow:
    file: ./reset_navigation_to_home.yaml
- runFlow: ./require_authenticated_home.yaml
