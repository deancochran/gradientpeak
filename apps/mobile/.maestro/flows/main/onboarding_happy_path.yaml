appId: com.deancochran.gradientpeak.dev
---
- runFlow:
    file: ../reusable/bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: "onboarding-screen"
    timeout: 15000
- assertVisible:
    id: "onboarding-provider-selection"
- tapOn:
    id: "onboarding-continue-provider-button"
- extendedWaitUntil:
    visible:
      id: "onboarding-review"
    timeout: 15000
- assertVisible: "Initial goal (required)"
- assertVisible:
    id: "onboarding-finish-button"
