appId: com.deancochran.gradientpeak.dev
name: Open the visible scheduled session from Calendar and report partial completion without invented metrics
---
# This follows the same visible Calendar-to-session path as full completion,
# but the terminal action is intentionally the explicit partial outcome.
- tapOn:
    id: tab-button-plan
- tapOn:
    id: plan-view-calendar
- extendedWaitUntil:
    visible:
      id: calendar-screen-ready
    timeout: 30000
- tapOn:
    id: calendar-date-jump-entry
- tapOn: ${MAESTRO_ACCEPTANCE_SESSION_DAY}
- tapOn: "OK"
- extendedWaitUntil:
    notVisible:
      id: calendar-date-jump-loading
    timeout: 30000
- tapOn:
    id: calendar-day-select-${MAESTRO_ACCEPTANCE_SESSION_DATE}
- extendedWaitUntil:
    visible:
      id: planning-ledger-screen
    timeout: 30000
- scrollUntilVisible:
    element:
      id: planning-ledger-entry-planned-${MAESTRO_ACCEPTANCE_SESSION_ID}
    direction: DOWN
- tapOn:
    id: planning-ledger-entry-planned-${MAESTRO_ACCEPTANCE_SESSION_ID}
- extendedWaitUntil:
    visible:
      id: planned-session-detail-screen
    timeout: 30000
- takeScreenshot: planned-session-detail-before-completion
- scrollUntilVisible:
    element:
      id: planned-session-complete-partial
    direction: DOWN
- tapOn:
    id: planned-session-complete-partial
- extendedWaitUntil:
    visible:
      id: planned-session-linked-activity
    timeout: 30000
- assertVisible: "completed"
- assertVisible: "View completed activity"
- takeScreenshot: planned-session-partial-completion
