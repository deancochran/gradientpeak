appId: com.deancochran.gradientpeak.dev
name: Completed athlete signs in to an evidence-free threshold goal
---
- openLink: "gradientpeak-dev://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8083"
- extendedWaitUntil:
    visible:
      id: sign-in-screen
    timeout: 90000
- assertVisible: ${MAESTRO_ACCEPTANCE_RUNTIME_SENTINEL}
- tapOn:
    id: email-input
- eraseText: 200
- inputText: ${MAESTRO_ACCEPTANCE_EMAIL}
- tapOn:
    id: password-input
- eraseText: 200
- inputText: ${MAESTRO_ACCEPTANCE_PASSWORD}
- hideKeyboard
- tapOn:
    id: sign-in-button
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 30000
- scrollUntilVisible:
    element:
      text: ${MAESTRO_ACCEPTANCE_GOAL_TITLE}
    direction: DOWN
- assertVisible: "Target date: ${MAESTRO_ACCEPTANCE_TARGET_DATE}"
- assertVisible: "Current: Unavailable"
- assertVisible: "Target: 300 W"
- assertVisible: "Remaining gap: Unavailable"
- takeScreenshot: goal-progress-unavailable-home
