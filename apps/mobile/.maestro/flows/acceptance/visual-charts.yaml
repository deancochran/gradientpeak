appId: com.deancochran.gradientpeak.dev
name: Render shared scenario and threshold charts on the current Android candidate
---
# This fixture-only developer surface is enabled exclusively by
# EXPO_PUBLIC_MAESTRO_E2E=1. It does not authenticate or write athlete data.
- openLink: "gradientpeak-dev://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8083"
- extendedWaitUntil:
    visible:
      id: sign-in-screen
    timeout: 90000
- openLink: "gradientpeak-dev://storybook"
- extendedWaitUntil:
    visible:
      id: ui-preview-surface
    timeout: 90000
- scrollUntilVisible:
    element:
      id: ui-preview-scenario-session-scenario-comparison
    direction: DOWN
- assertVisible:
    text: "Session scenario comparison"
- assertVisible:
    text: "● Baseline · solid"
- assertVisible:
    text: "□ Alternative · dashed"
- takeScreenshot: visual-charts-scenario-comparison
- scrollUntilVisible:
    element:
      id: ui-preview-threshold-bike-power
    direction: DOWN
- assertVisible:
    text: "Threshold history"
- assertVisible:
    text: "Mar 10, 2026"
- assertVisible:
    text: "May 10, 2026"
- assertVisible:
    text: "bike power · watts"
- assertVisible:
    text: "bike power history with 3 chronological records. Latest 260 W on May 10, 2026."
- takeScreenshot: visual-charts-threshold-history
- scrollUntilVisible:
    element:
      id: ui-preview-threshold-run-pace
    direction: DOWN
- assertVisible:
    text: "run pace · pace (/km)"
- assertVisible:
    text: "Mar 12, 2026"
- assertVisible:
    text: "Apr 12, 2026"
- assertVisible:
    text: "run pace history with 2 chronological records. Latest 4:10 /km on Apr 12, 2026."
- takeScreenshot: visual-charts-threshold-run-pace
