appId: com.deancochran.gradientpeak.dev
name: Sign in the runner-provisioned scenario athlete without onboarding
---
- openLink: "gradientpeak-dev://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8083"
- extendedWaitUntil:
    visible:
      id: sign-in-screen
    timeout: 90000
- assertVisible: ${MAESTRO_ACCEPTANCE_RUNTIME_SENTINEL}
- tapOn:
    id: email-input
- eraseText: 200
- inputText: ${MAESTRO_ACCEPTANCE_EMAIL}
- tapOn:
    id: password-input
- eraseText: 200
- inputText: ${MAESTRO_ACCEPTANCE_PASSWORD}
- hideKeyboard
- tapOn:
    id: sign-in-button
- extendedWaitUntil:
    visible:
      id: tab-button-home
    timeout: 30000
