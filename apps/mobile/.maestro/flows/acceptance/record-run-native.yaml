appId: com.deancochran.gradientpeak.dev
name: Enter recording from the visible Record tab and record a real timer-backed run
---
# The shared manual-completion helper leaves this journey on an activity detail,
# which is a standard-stack screen without tabs. When the flow is run directly,
# it may already start on the tab navigator.
- runFlow:
    when:
      visible:
        id: activity-detail-screen
    commands:
      - pressKey: back
      - extendedWaitUntil:
          visible:
            id: planning-ledger-screen
          timeout: 30000
      - pressKey: back
      - extendedWaitUntil:
          visible:
            id: calendar-screen-ready
          timeout: 30000
# Navigation boundary: the visible Record tab is the user entry point.
- assertVisible:
    id: tab-button-record
- tapOn:
    id: tab-button-record
- extendedWaitUntil:
    visible:
      id: record-screen-ready
    timeout: 30000
- tapOn:
    id: recording-activity-control-button
- extendedWaitUntil:
    visible: "Select Activity"
    timeout: 15000
- tapOn:
    id: record-activity-option-run
- tapOn:
    id: record-activity-save-button
- extendedWaitUntil:
    visible:
      id: record-screen-ready
    timeout: 15000
- tapOn:
    id: recording-start-button
# Observe a live elapsed value before finalization; do not fabricate a FIT.
- extendedWaitUntil:
    visible: "0:01"
    timeout: 30000
- tapOn:
    id: recording-pause-button
- extendedWaitUntil:
    visible:
      id: recording-resume-button
    timeout: 15000
- tapOn:
    id: recording-resume-button
- extendedWaitUntil:
    visible:
      id: recording-pause-button
    timeout: 15000
- tapOn:
    id: recording-pause-button
- tapOn:
    id: recording-finish-button
- extendedWaitUntil:
    visible:
      id: activity-submit-save-button
    timeout: 60000
- assertVisible:
    id: recording-review-summary
