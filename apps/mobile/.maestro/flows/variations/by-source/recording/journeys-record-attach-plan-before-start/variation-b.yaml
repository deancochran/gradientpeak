appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/record/attach_plan_before_start.yaml — record selected plan to review"
properties:
  junitId: variation.mobile.journeys_record_attach_plan_before_start.b
  junitClassname: variation.mobile.recording
  sourceIdentity: journeys/record/attach_plan_before_start.yaml
tags: [variation, recording, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: ../../../../reusable/open_record_tab.yaml
- runFlow: { file: ../../../../reusable/domain/recording/select_plan.yaml, env: { PLAN_NAME: "${PLAN_ACTIVITY_PLAN_NAME}" } }
- tapOn: { id: "recording-start-button" }
- assertVisible: { id: "activity-interval-insight-card" }
- tapOn: { id: "recording-finish-button" }
- assertVisible: { id: "recording-review-summary" }
- assertVisible: "${PLAN_ACTIVITY_PLAN_NAME}"
