appId: ${MAESTRO_APP_ID}
name: "Variation B — contracts/p0/record_discard_finalized.yaml — confirm discard and return to clean setup"
properties:
  junitId: variation.mobile.contracts_p0_record_discard_finalized.b
  junitClassname: variation.mobile.recording
  sourceIdentity: contracts/p0/record_discard_finalized.yaml
tags: [variation, recording, by-source]
---
- runFlow: ../../../../reusable/authenticated_home.yaml
- runFlow: ../../../../reusable/open_record_tab.yaml
- tapOn: { id: "recording-start-button" }
- tapOn: { id: "recording-finish-button" }
- tapOn: "Delete Activity"
- tapOn: "Delete"
- extendedWaitUntil: { visible: { id: "home-screen" }, timeout: 15000 }
- tapOn: { id: "tab-button-record" }
- assertVisible: { id: "record-screen-ready" }
- assertVisible: { id: "recording-start-button" }
- assertNotVisible: { id: "recording-review-summary" }
