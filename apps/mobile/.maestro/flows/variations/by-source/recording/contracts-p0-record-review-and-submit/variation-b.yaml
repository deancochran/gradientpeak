appId: ${MAESTRO_APP_ID}
name: "Variation B — contracts/p0/record_review_and_submit.yaml — pause, resume, review, and cancel deletion"
properties:
  junitId: variation.mobile.contracts_p0_record_review_and_submit.b
  junitClassname: variation.mobile.recording
  sourceIdentity: contracts/p0/record_review_and_submit.yaml
tags: [variation, recording, by-source]
---
- runFlow: ../../../../reusable/authenticated_home.yaml
- runFlow: ../../../../reusable/open_record_tab.yaml
- tapOn: { id: "recording-start-button" }
- tapOn: { id: "recording-pause-button" }
- assertVisible: { id: "recording-resume-button" }
- tapOn: { id: "recording-resume-button" }
- tapOn: { id: "recording-finish-button" }
- assertVisible: { id: "recording-review-summary" }
- tapOn: "Delete Activity"
- back
- assertVisible: { id: "recording-review-summary" }
- assertVisible: "Save Activity"
