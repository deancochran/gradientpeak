appId: ${MAESTRO_APP_ID}
name: "Variation B — contracts/p0/record_route_retained_on_activity.yaml — submit routed recording and traverse relation"
properties:
  junitId: variation.mobile.contracts_p0_record_route_retained_on_activity.b
  junitClassname: variation.mobile.recording
  sourceIdentity: contracts/p0/record_route_retained_on_activity.yaml
tags: [variation, recording, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: ../../../../reusable/open_record_tab.yaml
- runFlow: { file: ../../../../reusable/domain/recording/attach_route.yaml, env: { ROUTE_NAME: "${RECORDING_ROUTE_NAME}" } }
- tapOn: { id: "recording-start-button" }
- tapOn: { id: "recording-finish-button" }
- tapOn: "Save Activity"
- extendedWaitUntil: { visible: { id: "home-screen" }, timeout: 30000 }
- runFlow: { file: ../../../../reusable/domain/details/open_activity.yaml, env: { ACTIVITY_ID: "${ROUTE_ACTIVITY_ID}" } }
- tapOn: { id: "activity-detail-linked-route-${RECORDING_ROUTE_ID}" }
- assertVisible: { id: "route-card-map-preview-${RECORDING_ROUTE_ID}" }
