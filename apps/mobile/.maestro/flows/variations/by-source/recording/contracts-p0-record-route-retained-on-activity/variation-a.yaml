appId: ${MAESTRO_APP_ID}
name: "Variation A — contracts/p0/record_route_retained_on_activity.yaml — carry route into recording review"
properties:
  junitId: variation.mobile.contracts_p0_record_route_retained_on_activity.a
  junitClassname: variation.mobile.recording
  sourceIdentity: contracts/p0/record_route_retained_on_activity.yaml
tags: [variation, recording, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: ../../../../reusable/open_record_tab.yaml
- runFlow: { file: ../../../../reusable/domain/recording/attach_route.yaml, env: { ROUTE_NAME: "${RECORDING_ROUTE_NAME}" } }
- tapOn: { id: "recording-start-button" }
- assertVisible: { id: "route-progress-insight-card" }
- tapOn: { id: "recording-finish-button" }
- assertVisible: { id: "recording-review-route-${RECORDING_ROUTE_ID}" }
