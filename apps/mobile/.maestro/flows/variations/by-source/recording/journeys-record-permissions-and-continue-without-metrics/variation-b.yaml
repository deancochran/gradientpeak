appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/record/permissions_and_continue_without_metrics.yaml — continue and complete lifecycle"
properties:
  junitId: variation.mobile.journeys_record_permissions_and_continue_without_metrics.b
  junitClassname: variation.mobile.recording
  sourceIdentity: journeys/record/permissions_and_continue_without_metrics.yaml
tags: [variation, recording, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: ../../../../reusable/open_record_tab.yaml
- runFlow: { file: ../../../../reusable/domain/recording/select_plan.yaml, env: { PLAN_NAME: "${REQUIRED_METRICS_PLAN_NAME}" } }
- tapOn: { id: "recording-start-button" }
- tapOn: "Continue Anyway"
- assertVisible: { id: "recording-pause-button" }
- tapOn: { id: "recording-pause-button" }
- assertVisible: { id: "recording-resume-button" }
- tapOn: { id: "recording-resume-button" }
- tapOn: { id: "recording-finish-button" }
- assertVisible: { id: "recording-review-summary" }
