appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/profile/profile_to_activities_routes.yaml — routes library opens canonical route and returns"
properties: { junitId: variation.mobile.journeys_profile_profile_to_activities_routes.b, junitClassname: variation.mobile.profile, sourceIdentity: journeys/profile/profile_to_activities_routes.yaml }
tags: [variation, profile, libraries, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- tapOn: { id: "tab-button-profile" }
- scrollUntilVisible: { element: { id: "profile-tab-routes" }, direction: DOWN }
- tapOn: { id: "profile-tab-routes" }
- assertVisible: { id: "routes-list-screen" }
- tapOn: { id: "routes-list-item-${STANDARD_ROUTE_ID}" }
- assertVisible: { id: "route-detail-screen" }
- assertVisible: "${STANDARD_ROUTE_NAME}"
- back
- back
- assertVisible: { id: "profile-tab-library" }
