appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/profile/profile_to_activities_routes.yaml — activities library opens detail and returns"
properties: { junitId: variation.mobile.journeys_profile_profile_to_activities_routes.a, junitClassname: variation.mobile.profile, sourceIdentity: journeys/profile/profile_to_activities_routes.yaml }
tags: [variation, profile, libraries, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- tapOn: { id: "tab-button-profile" }
- scrollUntilVisible: { element: { id: "profile-tab-activities" }, direction: DOWN }
- tapOn: { id: "profile-tab-activities" }
- assertVisible: { id: "activities-list-screen" }
- tapOn: { id: "activities-list-item-${FILTER_ACTIVITY_ID}" }
- assertVisible: { id: "activity-detail-summary" }
- back
- back
- assertVisible: { id: "profile-tab-library" }
