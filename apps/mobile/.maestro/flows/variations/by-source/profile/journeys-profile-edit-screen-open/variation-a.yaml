appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/profile/edit_screen_open.yaml — cancel full-name edit without changing profile"
properties: { junitId: variation.mobile.journeys_profile_edit_screen_open.a, junitClassname: variation.mobile.profile, sourceIdentity: journeys/profile/edit_screen_open.yaml }
tags: [variation, profile, edit, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${PROFILE_EDIT_USER_EMAIL_A}", STANDARD_USER_PASS: "${PROFILE_EDIT_USER_PASS_A}" } }
- runFlow: ../../../../reusable/domain/navigation/open_profile_tab.yaml
- tapOn: { id: "profile-tab-summary-edit" }
- assertVisible: { id: "profile-edit-screen" }
- assertVisible: { id: "profile-edit-avatar-button" }
- tapOn: { id: "profile-edit-full-name" }
- eraseText
- inputText: "Unsaved Maestro profile"
- hideKeyboard
- back
- assertVisible: { id: "profile-tab-screen" }
- assertNotVisible: "Unsaved Maestro profile"
