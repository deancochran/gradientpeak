appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/profile/edit_screen_open.yaml — save full name and reopen persisted display"
properties: { junitId: variation.mobile.journeys_profile_edit_screen_open.b, junitClassname: variation.mobile.profile, sourceIdentity: journeys/profile/edit_screen_open.yaml }
tags: [variation, profile, edit, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${PROFILE_EDIT_USER_EMAIL_B}", STANDARD_USER_PASS: "${PROFILE_EDIT_USER_PASS_B}" } }
- runFlow: ../../../../reusable/domain/navigation/open_profile_tab.yaml
- tapOn: { id: "profile-tab-summary-edit" }
- tapOn: { id: "profile-edit-full-name" }
- eraseText
- inputText: "${PROFILE_VARIATION_NAME}"
- hideKeyboard
- tapOn: { id: "profile-edit-save-button" }
- assertVisible: "${PROFILE_VARIATION_NAME}"
- tapOn: { id: "profile-tab-summary-edit" }
- assertVisible: "${PROFILE_VARIATION_NAME}"
