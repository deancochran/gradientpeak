appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/profile/sign_out.yaml — confirm sign-out and keep protected profile blocked"
properties: { junitId: variation.mobile.journeys_profile_sign_out.b, junitClassname: variation.mobile.profile, sourceIdentity: journeys/profile/sign_out.yaml }
tags: [variation, profile, auth, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- tapOn: { id: "tab-button-profile" }
- scrollUntilVisible: { element: { id: "profile-tab-sign-out" }, direction: DOWN }
- tapOn: { id: "profile-tab-sign-out" }
- tapOn: "Sign Out"
- extendedWaitUntil: { visible: { id: "sign-in-screen" }, timeout: 10000 }
- runFlow: { file: ../../../../reusable/preserve_state_relaunch.yaml, env: { EXPECTED_BOUNDARY_ID: "sign-in-screen" } }
- assertVisible: { id: "sign-in-screen" }
- assertNotVisible: { id: "profile-tab-screen" }
