appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/profile/sign_out.yaml — cancel sign-out and remain on profile"
properties: { junitId: variation.mobile.journeys_profile_sign_out.a, junitClassname: variation.mobile.profile, sourceIdentity: journeys/profile/sign_out.yaml }
tags: [variation, profile, auth, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- tapOn: { id: "tab-button-profile" }
- scrollUntilVisible: { element: { id: "profile-tab-sign-out" }, direction: DOWN }
- tapOn: { id: "profile-tab-sign-out" }
- assertVisible: "Are you sure you want to sign out?"
- back
- assertVisible: { id: "profile-tab-settings" }
- assertVisible: { id: "profile-tab-sign-out" }
