appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/profile/account_settings_update.yaml — invalid email remains editable and can be cancelled"
properties: { junitId: variation.mobile.journeys_profile_account_settings_update.a, junitClassname: variation.mobile.profile, sourceIdentity: journeys/profile/account_settings_update.yaml }
tags: [variation, profile, settings, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: ../../../../reusable/domain/navigation/open_profile_tab.yaml
- scrollUntilVisible: { element: { id: "profile-tab-update-email" }, direction: DOWN }
- tapOn: { id: "profile-tab-update-email" }
- tapOn: { id: "profile-tab-email-input" }
- inputText: "not-an-email"
- hideKeyboard
- tapOn: { id: "profile-tab-email-submit-button" }
- assertVisible: { id: "profile-tab-email-input" }
- tapOn: { id: "profile-tab-update-email" }
- assertNotVisible: { id: "profile-tab-email-input" }
