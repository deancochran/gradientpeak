appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/profile/account_settings_update.yaml — mismatched password is rejected then form closes"
properties: { junitId: variation.mobile.journeys_profile_account_settings_update.b, junitClassname: variation.mobile.profile, sourceIdentity: journeys/profile/account_settings_update.yaml }
tags: [variation, profile, settings, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: ../../../../reusable/domain/navigation/open_profile_tab.yaml
- scrollUntilVisible: { element: { id: "profile-tab-change-password" }, direction: DOWN }
- tapOn: { id: "profile-tab-change-password" }
- tapOn: { id: "profile-tab-current-password-input" }
- inputText: "${STANDARD_USER_PASS}"
- tapOn: { id: "profile-tab-new-password-input" }
- inputText: "${PROFILE_NEW_PASSWORD}"
- tapOn: { id: "profile-tab-confirm-password-input" }
- inputText: "different-password"
- hideKeyboard
- tapOn: { id: "profile-tab-password-submit-button" }
- assertVisible: { id: "profile-tab-confirm-password-input" }
- tapOn: { id: "profile-tab-change-password" }
- assertNotVisible: { id: "profile-tab-password-submit-button" }
