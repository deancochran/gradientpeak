appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/profile/direct_message_from_profile_v2.yaml — cancel draft then reopen profile thread and send"
properties: { junitId: variation.mobile.journeys_profile_direct_message_from_profile_v2.b, junitClassname: variation.mobile.profile, sourceIdentity: journeys/profile/direct_message_from_profile_v2.yaml }
tags: [variation, profile, messaging, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: { file: ../../../../reusable/domain/details/open_user.yaml, env: { USER_ID: "${MESSAGE_TARGET_USER_ID}" } }
- tapOn: { id: "user-detail-message-button" }
- tapOn: { id: "message-input" }
- inputText: "discarded-profile-draft"
- back
- runFlow: { file: ../../../../reusable/domain/details/open_user.yaml, env: { USER_ID: "${MESSAGE_TARGET_USER_ID}" } }
- tapOn: { id: "user-detail-message-button" }
- assertNotVisible: "discarded-profile-draft"
- tapOn: { id: "message-input" }
- inputText: "${PROFILE_MESSAGE_B}"
- tapOn: { id: "message-send-button" }
- assertVisible: "${PROFILE_MESSAGE_B}"
