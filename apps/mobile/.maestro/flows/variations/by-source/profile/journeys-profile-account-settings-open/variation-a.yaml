appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/profile/account_settings_open.yaml — open email and password account controls"
properties: { junitId: variation.mobile.journeys_profile_account_settings_open.a, junitClassname: variation.mobile.profile, sourceIdentity: journeys/profile/account_settings_open.yaml }
tags: [variation, profile, settings, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: ../../../../reusable/domain/navigation/open_profile_tab.yaml
- scrollUntilVisible: { element: { id: "profile-tab-settings" }, direction: DOWN }
- assertVisible: { id: "profile-tab-integrations" }
- tapOn: { id: "profile-tab-update-email" }
- assertVisible: { id: "profile-tab-email-input" }
- assertVisible: { id: "profile-tab-email-submit-button" }
- tapOn: { id: "profile-tab-change-password" }
- assertVisible: { id: "profile-tab-current-password-input" }
- assertVisible: { id: "profile-tab-new-password-input" }
- assertVisible: { id: "profile-tab-confirm-password-input" }
