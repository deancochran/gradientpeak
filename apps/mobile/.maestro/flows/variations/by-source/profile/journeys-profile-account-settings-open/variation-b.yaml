appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/profile/account_settings_open.yaml — toggle forms and dark-mode setting without saving"
properties: { junitId: variation.mobile.journeys_profile_account_settings_open.b, junitClassname: variation.mobile.profile, sourceIdentity: journeys/profile/account_settings_open.yaml }
tags: [variation, profile, settings, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: ../../../../reusable/domain/navigation/open_profile_tab.yaml
- scrollUntilVisible: { element: { id: "profile-tab-dark-mode" }, direction: DOWN }
- tapOn: { id: "profile-tab-dark-mode" }
- tapOn: { id: "profile-tab-update-email" }
- assertVisible: { id: "profile-tab-email-input" }
- tapOn: { id: "profile-tab-update-email" }
- assertNotVisible: { id: "profile-tab-email-input" }
- tapOn: { id: "profile-tab-change-password" }
- assertVisible: { id: "profile-tab-password-submit-button" }
- tapOn: { id: "profile-tab-change-password" }
- assertNotVisible: { id: "profile-tab-password-submit-button" }
