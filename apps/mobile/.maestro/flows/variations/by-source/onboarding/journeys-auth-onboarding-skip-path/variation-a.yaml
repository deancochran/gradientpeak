appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/auth/onboarding_skip_path.yaml — skip optional provider then search and clear people"
properties: { junitId: variation.mobile.journeys_auth_onboarding_skip_path.a, junitClassname: variation.mobile.onboarding, sourceIdentity: journeys/auth/onboarding_skip_path.yaml }
tags: [variation, onboarding, by-source, intentional-red]
---
- runFlow: ../../../../reusable/ensure_signed_out.yaml
- tapOn: { id: "email-input" }
- inputText: "${ONBOARDING_SKIP_USER_EMAIL_A}"
- tapOn: { id: "password-input" }
- inputText: "${ONBOARDING_SKIP_USER_PASS_A}"
- hideKeyboard
- tapOn: { id: "sign-in-button" }
- extendedWaitUntil: { visible: { id: "onboarding-provider-selection" }, timeout: 20000 }
- assertVisible: { id: "groups-people-step" }
- tapOn: { id: "onboarding-people-search" }
- inputText: "no-such-maestro-person"
- hideKeyboard
- assertVisible: "No people found"
- tapOn: { id: "onboarding-people-search-clear" }
- tapOn: { id: "onboarding-finish-button" }
- assertVisible: { id: "home-screen" }
