appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/auth/onboarding_skip_path.yaml — skip selections after group search and finish cleanly"
properties: { junitId: variation.mobile.journeys_auth_onboarding_skip_path.b, junitClassname: variation.mobile.onboarding, sourceIdentity: journeys/auth/onboarding_skip_path.yaml }
tags: [variation, onboarding, by-source, intentional-red]
---
- runFlow: ../../../../reusable/ensure_signed_out.yaml
- tapOn: { id: "email-input" }
- inputText: "${ONBOARDING_SKIP_USER_EMAIL_B}"
- tapOn: { id: "password-input" }
- inputText: "${ONBOARDING_SKIP_USER_PASS_B}"
- hideKeyboard
- tapOn: { id: "sign-in-button" }
- extendedWaitUntil: { visible: { id: "onboarding-provider-selection" }, timeout: 20000 }
- assertVisible: { id: "groups-people-step" }
- tapOn: { id: "onboarding-groups-search" }
- inputText: "no-such-maestro-group"
- hideKeyboard
- assertVisible: "No groups found"
- tapOn: { id: "onboarding-groups-search-clear" }
- tapOn: { id: "onboarding-finish-button" }
- assertVisible: { id: "home-screen" }
