appId: ${MAESTRO_APP_ID}
name: "Variation A — contracts/p0/onboarding_request_closed_group_persists.yaml — request closed group and reopen pending state"
properties: { junitId: variation.mobile.contracts_p0_onboarding_request_closed_group_persists.a, junitClassname: variation.mobile.onboarding, sourceIdentity: contracts/p0/onboarding_request_closed_group_persists.yaml }
tags: [variation, onboarding, contract, by-source, intentional-red]
---
- runFlow: ../../../../reusable/ensure_signed_out.yaml
- tapOn: { id: "email-input" }
- inputText: "${ONBOARDING_CLOSED_GROUP_USER_EMAIL_A}"
- tapOn: { id: "password-input" }
- inputText: "${ONBOARDING_CLOSED_GROUP_USER_PASS_A}"
- hideKeyboard
- tapOn: { id: "sign-in-button" }
- assertVisible: { id: "groups-people-step" }
- tapOn: { id: "onboarding-groups-search" }
- inputText: "${CLOSED_GROUP_NAME}"
- hideKeyboard
- tapOn: { id: "onboarding-group-${CLOSED_GROUP_ID}" }
- tapOn: { id: "onboarding-finish-button" }
- openLink: "${MAESTRO_APP_SCHEME}://group-detail?groupId=${CLOSED_GROUP_ID}"
- assertVisible: "Requested"
