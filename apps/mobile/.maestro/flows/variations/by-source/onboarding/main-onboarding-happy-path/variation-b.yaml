appId: ${MAESTRO_APP_ID}
name: "Variation B — main/onboarding_happy_path.yaml — inspect cards, request a closed group, and finish"
properties: { junitId: variation.mobile.main_onboarding_happy_path.b, junitClassname: variation.mobile.onboarding, sourceIdentity: main/onboarding_happy_path.yaml }
tags: [variation, onboarding, by-source, intentional-red]
---
- runFlow: ../../../../reusable/ensure_signed_out.yaml
- tapOn: { id: "email-input" }
- inputText: "${ONBOARDING_HAPPY_USER_EMAIL_B}"
- tapOn: { id: "password-input" }
- inputText: "${ONBOARDING_HAPPY_USER_PASS_B}"
- hideKeyboard
- tapOn: { id: "sign-in-button" }
- assertVisible: { id: "groups-people-step" }
- tapOn: { id: "onboarding-people-search" }
- inputText: "${PRIVATE_TARGET_USERNAME}"
- hideKeyboard
- assertVisible: { id: "onboarding-profile-${PRIVATE_TARGET_USER_ID}" }
- tapOn: { id: "onboarding-profile-open-${PRIVATE_TARGET_USER_ID}" }
- assertVisible: { id: "user-detail-summary" }
- back
- tapOn: { id: "onboarding-group-${CLOSED_GROUP_ID}" }
- tapOn: { id: "onboarding-finish-button" }
- openLink: "${MAESTRO_APP_SCHEME}://group-detail?groupId=${CLOSED_GROUP_ID}"
- assertVisible: "Requested"
