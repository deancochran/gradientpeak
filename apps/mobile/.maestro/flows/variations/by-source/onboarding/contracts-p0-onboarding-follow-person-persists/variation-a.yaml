appId: ${MAESTRO_APP_ID}
name: "Variation A — contracts/p0/onboarding_follow_person_persists.yaml — search, follow, finish, and reopen public profile"
properties: { junitId: variation.mobile.contracts_p0_onboarding_follow_person_persists.a, junitClassname: variation.mobile.onboarding, sourceIdentity: contracts/p0/onboarding_follow_person_persists.yaml }
tags: [variation, onboarding, contract, by-source, intentional-red]
---
- runFlow: ../../../../reusable/ensure_signed_out.yaml
- tapOn: { id: "email-input" }
- inputText: "${ONBOARDING_FOLLOW_USER_EMAIL_A}"
- tapOn: { id: "password-input" }
- inputText: "${ONBOARDING_FOLLOW_USER_PASS_A}"
- hideKeyboard
- tapOn: { id: "sign-in-button" }
- assertVisible: { id: "groups-people-step" }
- tapOn: { id: "onboarding-people-search" }
- inputText: "${PUBLIC_TARGET_USERNAME}"
- hideKeyboard
- tapOn: { id: "onboarding-profile-${PUBLIC_TARGET_USER_ID}" }
- tapOn: { id: "onboarding-finish-button" }
- extendedWaitUntil: { visible: { id: "home-screen" }, timeout: 30000 }
- openLink: "${MAESTRO_APP_SCHEME}://user/${PUBLIC_TARGET_USER_ID}"
- assertVisible: { id: "user-detail-unfollow-button" }
