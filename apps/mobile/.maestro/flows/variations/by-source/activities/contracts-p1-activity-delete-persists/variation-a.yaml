appId: ${MAESTRO_APP_ID}
name: "Variation A — contracts/p1/activity_delete_persists.yaml — cancel deletion and retain activity"
properties:
  junitId: variation.mobile.contracts_p1_activity_delete_persists.a
  junitClassname: variation.mobile.activities
  sourceIdentity: contracts/p1/activity_delete_persists.yaml
tags: [variation, activities, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: { file: ../../../../reusable/domain/details/open_activity.yaml, env: { ACTIVITY_ID: "${DELETE_ACTIVITY_ID_A}" } }
- runFlow: ../../../../reusable/domain/destructive/cancel_activity_delete.yaml
- assertVisible: { id: "activity-detail-summary" }
- assertVisible: { id: "activity-detail-options-trigger" }
