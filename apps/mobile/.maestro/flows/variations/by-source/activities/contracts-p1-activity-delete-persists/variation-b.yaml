appId: ${MAESTRO_APP_ID}
name: "Variation B — contracts/p1/activity_delete_persists.yaml — confirm deletion and reject exact detail"
properties:
  junitId: variation.mobile.contracts_p1_activity_delete_persists.b
  junitClassname: variation.mobile.activities
  sourceIdentity: contracts/p1/activity_delete_persists.yaml
tags: [variation, activities, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: { file: ../../../../reusable/domain/details/open_activity.yaml, env: { ACTIVITY_ID: "${DELETE_ACTIVITY_ID_B}" } }
- runFlow: ../../../../reusable/domain/destructive/confirm_activity_delete.yaml
- openLink: "${MAESTRO_APP_SCHEME}://activity-detail?id=${DELETE_ACTIVITY_ID_B}"
- assertVisible: "Activity not found"
