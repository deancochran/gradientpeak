appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/activities/list_screen_open.yaml — filter and open one exact activity"
properties:
  junitId: variation.mobile.journeys_activities_list_screen_open.a
  junitClassname: variation.mobile.activities
  sourceIdentity: journeys/activities/list_screen_open.yaml
tags: [variation, activities, by-source]
---
- runFlow:
    file: ../../../../reusable/open_own_profile.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- tapOn: { id: "my-activities" }
- assertVisible: { id: "activities-list-content" }
- tapOn: { id: "activities-list-filter-button" }
- tapOn: { id: "activities-list-filter-category-${FILTER_ACTIVITY_CATEGORY}" }
- tapOn: { id: "activities-list-filter-sort-${FILTER_ACTIVITY_SORT}" }
- tapOn: "Apply filters"
- assertVisible: { id: "activities-list-item-${FILTER_ACTIVITY_ID}" }
- tapOn: { id: "activities-list-item-${FILTER_ACTIVITY_ID}" }
- assertVisible: "${FILTER_ACTIVITY_TITLE}"
