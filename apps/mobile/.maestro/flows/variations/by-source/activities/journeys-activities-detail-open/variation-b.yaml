appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/activities/detail_open.yaml — open exact history item and reopen detail"
properties:
  junitId: variation.mobile.journeys_activities_detail_open.b
  junitClassname: variation.mobile.activities
  sourceIdentity: journeys/activities/detail_open.yaml
tags: [variation, activities, by-source]
---
- runFlow:
    file: ../../../../reusable/open_own_profile.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- tapOn: { id: "my-activities" }
- scrollUntilVisible: { element: { id: "activities-list-item-${FILTER_ACTIVITY_ID}" }, direction: DOWN }
- tapOn: { id: "activities-list-item-${FILTER_ACTIVITY_ID}" }
- assertVisible: { id: "activity-detail-summary" }
- back
- assertVisible: { id: "activities-list-item-${FILTER_ACTIVITY_ID}" }
- tapOn: { id: "activities-list-item-${FILTER_ACTIVITY_ID}" }
- assertVisible: { id: "activity-card-metrics" }
