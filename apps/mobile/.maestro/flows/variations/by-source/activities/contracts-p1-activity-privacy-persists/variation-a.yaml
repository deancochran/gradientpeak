appId: ${MAESTRO_APP_ID}
name: "Variation A — contracts/p1/activity_privacy_persists.yaml — set public and verify visibility control"
properties:
  junitId: variation.mobile.contracts_p1_activity_privacy_persists.a
  junitClassname: variation.mobile.activities
  sourceIdentity: contracts/p1/activity_privacy_persists.yaml
tags: [variation, activities, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: { file: ../../../../reusable/domain/details/open_activity.yaml, env: { ACTIVITY_ID: "${PRIVACY_ACTIVITY_ID_A}" } }
- tapOn: { id: "activity-detail-options-trigger" }
- tapOn: { id: "activity-detail-options-visibility" }
- assertVisible: "Change visibility"
- tapOn: "Public"
- runFlow: { file: ../../../../reusable/domain/details/open_activity.yaml, env: { ACTIVITY_ID: "${PRIVACY_ACTIVITY_ID_A}" } }
- tapOn: { id: "activity-detail-options-trigger" }
- tapOn: { id: "activity-detail-options-visibility" }
- assertVisible: "Public"
