appId: ${MAESTRO_APP_ID}
name: "Variation B — contracts/p1/activity_privacy_persists.yaml — public activity enables share handoff"
properties:
  junitId: variation.mobile.contracts_p1_activity_privacy_persists.b
  junitClassname: variation.mobile.activities
  sourceIdentity: contracts/p1/activity_privacy_persists.yaml
tags: [variation, activities, by-source, android-share]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: { file: ../../../../reusable/domain/details/open_activity.yaml, env: { ACTIVITY_ID: "${PRIVACY_ACTIVITY_ID_B}" } }
- tapOn: { id: "activity-detail-options-trigger" }
- tapOn: { id: "activity-detail-options-visibility" }
- tapOn: "Public"
- assertVisible: { id: "activity-detail-summary" }
- tapOn: { id: "activity-card-share-button-${PRIVACY_ACTIVITY_ID_B}" }
- extendedWaitUntil: { visible: "Share with", timeout: 10000 }
- assertNotVisible: "Not public"
