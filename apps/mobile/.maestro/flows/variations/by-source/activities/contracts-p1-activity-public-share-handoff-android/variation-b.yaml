appId: ${MAESTRO_APP_ID}
name: "Variation B — contracts/p1/activity_public_share_handoff_android.yaml — open public history card then hand off"
properties:
  junitId: variation.mobile.contracts_p1_activity_public_share_handoff_android.b
  junitClassname: variation.mobile.activities
  sourceIdentity: contracts/p1/activity_public_share_handoff_android.yaml
tags: [variation, activities, by-source, android-share]
---
- runFlow:
    file: ../../../../reusable/open_own_profile.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- tapOn: { id: "my-activities" }
- scrollUntilVisible: { element: { id: "activities-list-item-${PUBLIC_ACTIVITY_ID}" }, direction: DOWN }
- tapOn: { id: "activities-list-item-${PUBLIC_ACTIVITY_ID}" }
- assertVisible: { id: "activity-card-like-button-${PUBLIC_ACTIVITY_ID}" }
- tapOn: { id: "activity-card-share-button-${PUBLIC_ACTIVITY_ID}" }
- extendedWaitUntil: { visible: "Share with", timeout: 10000 }
- assertNotVisible: "Not public"
