appId: ${MAESTRO_APP_ID}
name: "Variation B — contracts/p0/completed_activity_route_persistence.yaml — find routed activity in history and reopen"
properties:
  junitId: variation.mobile.contracts_p0_completed_activity_route_persistence.b
  junitClassname: variation.mobile.activities
  sourceIdentity: contracts/p0/completed_activity_route_persistence.yaml
tags: [variation, activities, by-source]
---
- runFlow:
    file: ../../../../reusable/open_own_profile.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- tapOn: { id: "my-activities" }
- scrollUntilVisible: { element: { id: "activities-list-item-${ROUTE_ACTIVITY_ID}" }, direction: DOWN }
- tapOn: { id: "activities-list-item-${ROUTE_ACTIVITY_ID}" }
- assertVisible: { id: "activity-detail-tab-overview" }
- assertVisible: { id: "activity-detail-linked-route-${RECORDING_ROUTE_ID}" }
- back
- tapOn: { id: "activities-list-item-${ROUTE_ACTIVITY_ID}" }
- assertVisible: { id: "activity-detail-linked-route-${RECORDING_ROUTE_ID}" }
