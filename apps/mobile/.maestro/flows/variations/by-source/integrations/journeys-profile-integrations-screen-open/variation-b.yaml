appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/profile/integrations_screen_open.yaml — connect provider and inspect actions"
properties:
  junitId: variation.mobile.journeys_profile_integrations_screen_open.b
  junitClassname: variation.mobile.integrations
  sourceIdentity: journeys/profile/integrations_screen_open.yaml
tags: [variation, integrations, by-source]
---
- runFlow:
    file: ../../../../reusable/open_own_profile.yaml
    env: { STANDARD_USER_EMAIL: "${PROVIDER_SCREEN_USER_EMAIL_B}", STANDARD_USER_PASS: "${PROVIDER_SCREEN_USER_PASS_B}" }
- tapOn: { id: "manage-integrations-button" }
- tapOn: { id: "integration-connect-${PROVIDER_SCREEN_ID_B}" }
- extendedWaitUntil: { visible: { id: "integration-sync-now-${PROVIDER_SCREEN_ID_B}" }, timeout: 20000 }
- assertVisible: { id: "integration-disconnect-${PROVIDER_SCREEN_ID_B}" }
- tapOn: { id: "integration-disconnect-${PROVIDER_SCREEN_ID_B}" }
- assertVisible: { id: "integration-disconnect-modal" }
- back
- assertVisible: { id: "integration-sync-now-${PROVIDER_SCREEN_ID_B}" }
