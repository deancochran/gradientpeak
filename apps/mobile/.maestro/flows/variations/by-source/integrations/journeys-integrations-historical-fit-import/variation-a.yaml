appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/integrations/historical_fit_import.yaml — import deterministic FIT and inspect activity content"
properties:
  junitId: variation.mobile.journeys_integrations_historical_fit_import.a
  junitClassname: variation.mobile.integrations
  sourceIdentity: journeys/integrations/historical_fit_import.yaml
tags: [variation, integrations, by-source]
---
- runFlow:
    file: ../../../../reusable/open_own_profile.yaml
    env: { STANDARD_USER_EMAIL: "${FIT_IMPORT_USER_EMAIL_A}", STANDARD_USER_PASS: "${FIT_IMPORT_USER_PASS_A}" }
- tapOn: { id: "my-activities" }
- tapOn: { id: "activities-list-import-trigger" }
- assertVisible: { id: "activity-import-screen" }
- assertVisible: { id: "activity-import-file-input" }
- assertNotVisible: { id: "activity-import-name-input" }
- assertVisible: { id: "activity-import-notes-input" }
- assertVisible: { id: "activity-import-submit-button" }
- assertVisible: "Import one completed FIT, GPX, or TCX activity"
- runFlow: { file: ../../../../reusable/domain/uploads/select_activity_fixture.yaml, env: { ACTIVITY_FILE_DISPLAY_NAME: "${FIT_IMPORT_FILE_DISPLAY_NAME_A}" } }
- assertVisible: "${FIT_IMPORT_FILE_DISPLAY_NAME_A}"
- tapOn: { id: "activity-import-submit-button" }
- extendedWaitUntil: { visible: { id: "activity-import-summary" }, timeout: 60000 }
- assertVisible: "Historical activity imported"
- assertVisible: "${FIT_IMPORT_FILE_DISPLAY_NAME_A}"
- tapOn: { id: "activity-import-view-activity-button" }
- extendedWaitUntil: { visible: { id: "activity-detail-screen" }, timeout: 30000 }
- assertVisible: { id: "activity-detail-summary" }
- assertVisible: "${FIT_IMPORT_ACTIVITY_TITLE_A}"
- tapOn: { id: "activity-detail-tab-breakdown" }
- assertVisible: { id: "activity-derived-efforts" }
