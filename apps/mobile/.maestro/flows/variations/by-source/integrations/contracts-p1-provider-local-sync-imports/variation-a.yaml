appId: ${MAESTRO_APP_ID}
name: "Variation A — contracts/p1/provider_local_sync_imports.yaml — sync and open exact imported activity"
properties:
  junitId: variation.mobile.contracts_p1_provider_local_sync_imports.a
  junitClassname: variation.mobile.integrations
  sourceIdentity: contracts/p1/provider_local_sync_imports.yaml
tags: [variation, integrations, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${PROVIDER_SYNC_USER_EMAIL_A}", STANDARD_USER_PASS: "${PROVIDER_SYNC_USER_PASS_A}" } }
- runFlow: ../../../../reusable/domain/details/open_integrations.yaml
- runFlow: { file: ../../../../reusable/domain/providers/wait_for_import_ready.yaml, env: { PROVIDER_ID: "${PROVIDER_SYNC_ID_A}" } }
- tapOn: { id: "integration-view-import-${PROVIDER_SYNC_ID_A}" }
- assertVisible: { id: "activities-list-item-${PROVIDER_SYNC_IMPORTED_ACTIVITY_ID_A}" }
- tapOn: { id: "activities-list-item-${PROVIDER_SYNC_IMPORTED_ACTIVITY_ID_A}" }
- assertVisible: { id: "activity-detail-summary" }
- assertVisible: { id: "activity-card-metrics" }
