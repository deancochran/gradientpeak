appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/profile/integrations_import_entry_open.yaml — edit notes and enforce file requirement"
properties:
  junitId: variation.mobile.journeys_profile_integrations_import_entry_open.b
  junitClassname: variation.mobile.integrations
  sourceIdentity: journeys/profile/integrations_import_entry_open.yaml
tags: [variation, integrations, by-source]
---
- runFlow:
    file: ../../../../reusable/open_own_profile.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- tapOn: { id: "my-activities" }
- tapOn: { id: "activities-list-import-trigger" }
- tapOn: { id: "activity-import-notes-input" }
- inputText: "Profile import entry variation"
- hideKeyboard
- assertNotVisible: { id: "activity-import-name-input" }
- tapOn: { id: "activity-import-submit-button" }
- assertVisible: "Choose a FIT, GPX, or TCX file."
- assertVisible: { id: "activity-import-file-input" }
