appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/profile/integrations_import_entry_open.yaml — enter import from profile history"
properties:
  junitId: variation.mobile.journeys_profile_integrations_import_entry_open.a
  junitClassname: variation.mobile.integrations
  sourceIdentity: journeys/profile/integrations_import_entry_open.yaml
tags: [variation, integrations, by-source]
---
- runFlow:
    file: ../../../../reusable/open_own_profile.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- tapOn: { id: "my-activities" }
- assertVisible: { id: "activities-list-import-trigger" }
- tapOn: { id: "activities-list-import-trigger" }
- assertVisible: { id: "activity-import-file-input" }
- assertVisible: { id: "activity-import-notes-input" }
- assertVisible: { id: "activity-import-submit-button" }
- back
- assertVisible: { id: "activities-list-content" }
- assertVisible: { id: "activities-list-import-trigger" }
