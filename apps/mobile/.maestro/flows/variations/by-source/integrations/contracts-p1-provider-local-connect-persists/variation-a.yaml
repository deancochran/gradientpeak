appId: ${MAESTRO_APP_ID}
name: "Variation A — contracts/p1/provider_local_connect_persists.yaml — connect and preserve actions after navigation"
properties:
  junitId: variation.mobile.contracts_p1_provider_local_connect_persists.a
  junitClassname: variation.mobile.integrations
  sourceIdentity: contracts/p1/provider_local_connect_persists.yaml
tags: [variation, integrations, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${PROVIDER_CONNECT_USER_EMAIL_A}", STANDARD_USER_PASS: "${PROVIDER_CONNECT_USER_PASS_A}" } }
- runFlow: ../../../../reusable/domain/details/open_integrations.yaml
- tapOn: { id: "integration-connect-${PROVIDER_CONNECT_ID_A}" }
- extendedWaitUntil: { visible: { id: "integration-sync-now-${PROVIDER_CONNECT_ID_A}" }, timeout: 20000 }
- assertVisible: { id: "integration-disconnect-${PROVIDER_CONNECT_ID_A}" }
- back
- runFlow: ../../../../reusable/domain/details/open_integrations.yaml
- assertVisible: { id: "integration-sync-now-${PROVIDER_CONNECT_ID_A}" }
- assertVisible: { id: "integration-disconnect-${PROVIDER_CONNECT_ID_A}" }
