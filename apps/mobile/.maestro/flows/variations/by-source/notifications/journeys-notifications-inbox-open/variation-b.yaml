appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/notifications/inbox_open.yaml — all and unread filters retain destination navigation"
properties: { junitId: variation.mobile.journeys_notifications_inbox_open.b, junitClassname: variation.mobile.notifications, sourceIdentity: journeys/notifications/inbox_open.yaml }
tags: [variation, notifications, by-source, intentional-red]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${NOTIFICATION_INBOX_USER_EMAIL_B}", STANDARD_USER_PASS: "${NOTIFICATION_INBOX_USER_PASS_B}" } }
- runFlow: ../../../../reusable/open_notifications_inbox.yaml
- tapOn: { id: "notifications-unread-filter" }
- assertVisible: { id: "notification-item-${NOTIFICATION_INBOX_DESTINATION_ID_B}" }
- tapOn: { id: "notifications-all-filter" }
- assertVisible: { id: "notification-item-${NOTIFICATION_INBOX_FOLLOW_ID_B}" }
- tapOn: { id: "notification-item-${NOTIFICATION_INBOX_DESTINATION_ID_B}" }
- assertVisible: { id: "messages-screen" }
