appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/notifications/inbox_open.yaml — notification list exposes count and actionable follow request"
properties: { junitId: variation.mobile.journeys_notifications_inbox_open.a, junitClassname: variation.mobile.notifications, sourceIdentity: journeys/notifications/inbox_open.yaml }
tags: [variation, notifications, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${NOTIFICATION_INBOX_USER_EMAIL_A}", STANDARD_USER_PASS: "${NOTIFICATION_INBOX_USER_PASS_A}" } }
- runFlow: ../../../../reusable/open_notifications_inbox.yaml
- assertVisible: { id: "notifications-screen" }
- assertVisible: { id: "notifications-list" }
- assertVisible: "${NOTIFICATION_INBOX_UNREAD_SUMMARY_A}"
- assertVisible: { id: "notification-item-${NOTIFICATION_INBOX_FOLLOW_ID_A}" }
- assertVisible: { id: "notification-accept-${NOTIFICATION_INBOX_FOLLOW_ID_A}" }
- assertVisible: { id: "notification-reject-${NOTIFICATION_INBOX_FOLLOW_ID_A}" }
- tapOn: { id: "notification-item-${NOTIFICATION_INBOX_DESTINATION_ID_A}" }
- assertVisible: { id: "messages-screen" }
- back
- assertVisible: { id: "notifications-list" }
