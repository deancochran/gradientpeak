appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/notifications/inbox_expect_text.yaml — expected message notification opens inbox destination"
properties: { junitId: variation.mobile.journeys_notifications_inbox_expect_text.a, junitClassname: variation.mobile.notifications, sourceIdentity: journeys/notifications/inbox_expect_text.yaml }
tags: [variation, notifications, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${NOTIFICATION_EXPECT_USER_EMAIL_A}", STANDARD_USER_PASS: "${NOTIFICATION_EXPECT_USER_PASS_A}" } }
- runFlow: ../../../../reusable/open_notifications_inbox.yaml
- assertVisible: "${NOTIFICATION_EXPECT_TEXT_A}"
- tapOn: { id: "notification-item-${NOTIFICATION_EXPECT_DESTINATION_ID_A}" }
- assertVisible: { id: "messages-screen" }
- assertVisible: { id: "messages-conversation-list" }
- back
- assertVisible: { id: "notifications-screen" }
