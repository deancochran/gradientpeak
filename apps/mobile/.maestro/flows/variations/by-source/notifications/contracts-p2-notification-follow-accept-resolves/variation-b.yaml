appId: ${MAESTRO_APP_ID}
name: "Variation B — contracts/p2/notification_follow_accept_resolves.yaml — mark request read then accept and reload"
properties: { junitId: variation.mobile.contracts_p2_notification_follow_accept_resolves.b, junitClassname: variation.mobile.notifications, sourceIdentity: contracts/p2/notification_follow_accept_resolves.yaml }
tags: [variation, notifications, contract, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${NOTIFICATION_ACCEPT_USER_EMAIL_B}", STANDARD_USER_PASS: "${NOTIFICATION_ACCEPT_USER_PASS_B}" } }
- runFlow: ../../../../reusable/open_notifications_inbox.yaml
- tapOn: { id: "notification-item-${NOTIFICATION_ACCEPT_ID_B}" }
- assertVisible: { id: "notification-accept-${NOTIFICATION_ACCEPT_ID_B}" }
- tapOn: { id: "notification-accept-${NOTIFICATION_ACCEPT_ID_B}" }
- back
- runFlow: ../../../../reusable/open_notifications_inbox.yaml
- assertNotVisible: { id: "notification-item-${NOTIFICATION_ACCEPT_ID_B}" }
