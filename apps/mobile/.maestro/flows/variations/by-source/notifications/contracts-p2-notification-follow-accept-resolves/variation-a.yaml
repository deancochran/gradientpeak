appId: ${MAESTRO_APP_ID}
name: "Variation A — contracts/p2/notification_follow_accept_resolves.yaml — accept removes both actions after relaunch"
properties: { junitId: variation.mobile.contracts_p2_notification_follow_accept_resolves.a, junitClassname: variation.mobile.notifications, sourceIdentity: contracts/p2/notification_follow_accept_resolves.yaml }
tags: [variation, notifications, contract, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${NOTIFICATION_ACCEPT_USER_EMAIL_A}", STANDARD_USER_PASS: "${NOTIFICATION_ACCEPT_USER_PASS_A}" } }
- runFlow: ../../../../reusable/open_notifications_inbox.yaml
- tapOn: { id: "notification-accept-${NOTIFICATION_ACCEPT_ID_A}" }
- assertNotVisible: { id: "notification-reject-${NOTIFICATION_ACCEPT_ID_A}" }
- runFlow: { file: ../../../../reusable/preserve_state_relaunch.yaml, env: { EXPECTED_BOUNDARY_ID: "home-screen" } }
- runFlow: ../../../../reusable/open_notifications_inbox.yaml
- assertNotVisible: { id: "notification-accept-${NOTIFICATION_ACCEPT_ID_A}" }
- assertNotVisible: { id: "notification-reject-${NOTIFICATION_ACCEPT_ID_A}" }
