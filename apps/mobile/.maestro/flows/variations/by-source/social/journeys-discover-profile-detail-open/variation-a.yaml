appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/discover/profile_detail_open.yaml — search public profile and open its activity card"
properties: { junitId: variation.mobile.journeys_discover_profile_detail_open.a, junitClassname: variation.mobile.social, sourceIdentity: journeys/discover/profile_detail_open.yaml }
tags: [variation, social, discover, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: ../../../../reusable/open_discover_tab.yaml
- runFlow: { file: ../../../../reusable/domain/discover/choose_scope.yaml, env: { DISCOVER_SCOPE: users } }
- runFlow: { file: ../../../../reusable/domain/discover/search_result.yaml, env: { DISCOVER_QUERY: "${PUBLIC_TARGET_USERNAME}", DISCOVER_RESULT_ID: "discover-user-${PUBLIC_TARGET_USER_ID}" } }
- tapOn: { id: "discover-user-${PUBLIC_TARGET_USER_ID}" }
- assertVisible: { id: "user-detail-summary" }
- scrollUntilVisible: { element: { id: "user-detail-activity-${PUBLIC_TARGET_ACTIVITY_ID}" }, direction: DOWN }
- tapOn: { id: "user-detail-activity-${PUBLIC_TARGET_ACTIVITY_ID}" }
- assertVisible: { id: "activity-detail-summary" }
