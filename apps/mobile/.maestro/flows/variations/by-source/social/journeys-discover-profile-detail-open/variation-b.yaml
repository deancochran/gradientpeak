appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/discover/profile_detail_open.yaml — empty search clears into private profile detail"
properties: { junitId: variation.mobile.journeys_discover_profile_detail_open.b, junitClassname: variation.mobile.social, sourceIdentity: journeys/discover/profile_detail_open.yaml }
tags: [variation, social, discover, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: ../../../../reusable/open_discover_tab.yaml
- runFlow: { file: ../../../../reusable/domain/discover/choose_scope.yaml, env: { DISCOVER_SCOPE: users } }
- tapOn: { id: "discover-search-input" }
- inputText: "no-such-maestro-profile"
- hideKeyboard
- assertVisible: "No profiles"
- runFlow: ../../../../reusable/domain/discover/clear_search.yaml
- runFlow: { file: ../../../../reusable/domain/discover/search_result.yaml, env: { DISCOVER_QUERY: "${PRIVATE_TARGET_USERNAME}", DISCOVER_RESULT_ID: "discover-user-${PRIVATE_TARGET_USER_ID}" } }
- tapOn: { id: "discover-user-${PRIVATE_TARGET_USER_ID}" }
- assertVisible: { id: "user-detail-summary" }
- assertVisible: { id: "user-detail-follow-button" }
