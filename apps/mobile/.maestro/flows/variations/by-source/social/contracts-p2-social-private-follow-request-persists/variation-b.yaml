appId: ${MAESTRO_APP_ID}
name: "Variation B — contracts/p2/social_private_follow_request_persists.yaml — cancel then recreate private request across navigation"
properties: { junitId: variation.mobile.contracts_p2_social_private_follow_request_persists.b, junitClassname: variation.mobile.social, sourceIdentity: contracts/p2/social_private_follow_request_persists.yaml }
tags: [variation, social, contract, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${SOCIAL_PRIVATE_FOLLOW_USER_EMAIL_B}", STANDARD_USER_PASS: "${SOCIAL_PRIVATE_FOLLOW_USER_PASS_B}" } }
- runFlow: { file: ../../../../reusable/domain/details/open_user.yaml, env: { USER_ID: "${PRIVATE_TARGET_USER_ID}" } }
- tapOn: { id: "user-detail-follow-button" }
- tapOn: { id: "user-detail-requested-button" }
- assertVisible: { id: "user-detail-follow-button" }
- back
- runFlow: { file: ../../../../reusable/domain/details/open_user.yaml, env: { USER_ID: "${PRIVATE_TARGET_USER_ID}" } }
- tapOn: { id: "user-detail-follow-button" }
- assertVisible: { id: "user-detail-requested-button" }
