appId: ${MAESTRO_APP_ID}
name: "Variation B — contracts/p2/social_public_follow_persists.yaml — follow remains while activity detail opens and returns"
properties: { junitId: variation.mobile.contracts_p2_social_public_follow_persists.b, junitClassname: variation.mobile.social, sourceIdentity: contracts/p2/social_public_follow_persists.yaml }
tags: [variation, social, contract, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${SOCIAL_PUBLIC_FOLLOW_USER_EMAIL_B}", STANDARD_USER_PASS: "${SOCIAL_PUBLIC_FOLLOW_USER_PASS_B}" } }
- runFlow: { file: ../../../../reusable/domain/details/open_user.yaml, env: { USER_ID: "${PUBLIC_TARGET_USER_ID}" } }
- tapOn: { id: "user-detail-follow-button" }
- scrollUntilVisible: { element: { id: "user-detail-activity-${PUBLIC_TARGET_ACTIVITY_ID}" }, direction: DOWN }
- tapOn: { id: "user-detail-activity-${PUBLIC_TARGET_ACTIVITY_ID}" }
- assertVisible: { id: "activity-detail-summary" }
- back
- assertVisible: { id: "user-detail-unfollow-button" }
