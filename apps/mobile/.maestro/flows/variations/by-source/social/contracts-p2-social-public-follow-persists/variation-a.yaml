appId: ${MAESTRO_APP_ID}
name: "Variation A — contracts/p2/social_public_follow_persists.yaml — public follow survives relaunch"
properties: { junitId: variation.mobile.contracts_p2_social_public_follow_persists.a, junitClassname: variation.mobile.social, sourceIdentity: contracts/p2/social_public_follow_persists.yaml }
tags: [variation, social, contract, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${SOCIAL_PUBLIC_FOLLOW_USER_EMAIL_A}", STANDARD_USER_PASS: "${SOCIAL_PUBLIC_FOLLOW_USER_PASS_A}" } }
- runFlow: { file: ../../../../reusable/domain/details/open_user.yaml, env: { USER_ID: "${PUBLIC_TARGET_USER_ID}" } }
- tapOn: { id: "user-detail-follow-button" }
- assertVisible: { id: "user-detail-unfollow-button" }
- runFlow: { file: ../../../../reusable/preserve_state_relaunch.yaml, env: { EXPECTED_BOUNDARY_ID: "home-screen" } }
- runFlow: { file: ../../../../reusable/domain/details/open_user.yaml, env: { USER_ID: "${PUBLIC_TARGET_USER_ID}" } }
- assertVisible: { id: "user-detail-unfollow-button" }
