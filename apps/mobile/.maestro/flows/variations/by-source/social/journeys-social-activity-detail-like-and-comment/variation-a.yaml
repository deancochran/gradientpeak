appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/social/activity_detail_like_and_comment.yaml — like and add a comment from activity detail"
properties: { junitId: variation.mobile.journeys_social_activity_detail_like_and_comment.a, junitClassname: variation.mobile.social, sourceIdentity: journeys/social/activity_detail_like_and_comment.yaml }
tags: [variation, social, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${SOCIAL_ACTIVITY_USER_EMAIL_A}", STANDARD_USER_PASS: "${SOCIAL_ACTIVITY_USER_PASS_A}" } }
- runFlow: { file: ../../../../reusable/domain/details/open_activity.yaml, env: { ACTIVITY_ID: "${PUBLIC_TARGET_ACTIVITY_ID}" } }
- extendedWaitUntil: { visible: { id: "activity-detail-summary" }, timeout: 15000 }
- tapOn: { id: "activity-card-like-button-${PUBLIC_TARGET_ACTIVITY_ID}" }
- tapOn: { id: "activity-card-comment-button-${PUBLIC_TARGET_ACTIVITY_ID}" }
- assertVisible: { id: "activity-detail-comments-sheet" }
- tapOn: "Add a comment..."
- inputText: "${ACTIVITY_COMMENT_A}"
- hideKeyboard
- tapOn: { id: "activity-detail-add-comment-button" }
- assertVisible: "${ACTIVITY_COMMENT_A}"
