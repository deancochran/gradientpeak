appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/social/activity_detail_like_and_comment.yaml — unlike, reopen comments, and add a second outcome"
properties: { junitId: variation.mobile.journeys_social_activity_detail_like_and_comment.b, junitClassname: variation.mobile.social, sourceIdentity: journeys/social/activity_detail_like_and_comment.yaml }
tags: [variation, social, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${SOCIAL_ACTIVITY_USER_EMAIL_B}", STANDARD_USER_PASS: "${SOCIAL_ACTIVITY_USER_PASS_B}" } }
- runFlow: { file: ../../../../reusable/domain/details/open_activity.yaml, env: { ACTIVITY_ID: "${PUBLIC_TARGET_ACTIVITY_ID}" } }
- tapOn: { id: "activity-card-like-button-${PUBLIC_TARGET_ACTIVITY_ID}" }
- tapOn: { id: "activity-card-like-button-${PUBLIC_TARGET_ACTIVITY_ID}" }
- tapOn: { id: "activity-card-comment-button-${PUBLIC_TARGET_ACTIVITY_ID}" }
- tapOn: "Add a comment..."
- inputText: "${ACTIVITY_COMMENT_B}"
- hideKeyboard
- tapOn: { id: "activity-detail-add-comment-button" }
- assertVisible: "${ACTIVITY_COMMENT_B}"
- back
- assertVisible: { id: "activity-detail-summary" }
