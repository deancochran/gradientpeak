appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/social/follow_target_from_profile.yaml — private follow requests then cancels after reopen"
properties: { junitId: variation.mobile.journeys_social_follow_target_from_profile.b, junitClassname: variation.mobile.social, sourceIdentity: journeys/social/follow_target_from_profile.yaml }
tags: [variation, social, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: { file: ../../../../reusable/domain/details/open_user.yaml, env: { USER_ID: "${PRIVATE_TARGET_USER_ID}" } }
- tapOn: { id: "user-detail-follow-button" }
- assertVisible: { id: "user-detail-requested-button" }
- back
- runFlow: { file: ../../../../reusable/domain/details/open_user.yaml, env: { USER_ID: "${PRIVATE_TARGET_USER_ID}" } }
- assertVisible: { id: "user-detail-requested-button" }
- tapOn: { id: "user-detail-requested-button" }
- assertVisible: { id: "user-detail-follow-button" }
