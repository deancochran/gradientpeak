appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/social/follow_target_from_profile.yaml — public follow becomes unfollow and cancels"
properties: { junitId: variation.mobile.journeys_social_follow_target_from_profile.a, junitClassname: variation.mobile.social, sourceIdentity: journeys/social/follow_target_from_profile.yaml }
tags: [variation, social, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: { file: ../../../../reusable/domain/details/open_user.yaml, env: { USER_ID: "${PUBLIC_TARGET_USER_ID}" } }
- tapOn: { id: "user-detail-follow-button" }
- assertVisible: { id: "user-detail-unfollow-button" }
- tapOn: { id: "user-detail-unfollow-button" }
- assertVisible: { id: "user-detail-follow-button" }
