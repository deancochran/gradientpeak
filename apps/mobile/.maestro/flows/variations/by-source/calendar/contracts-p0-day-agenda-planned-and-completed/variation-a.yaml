appId: ${MAESTRO_APP_ID}
name: "Variation A — contracts/p0/day_agenda_planned_and_completed.yaml — inspect planned agenda resource"
properties:
  junitId: variation.mobile.contracts_p0_day_agenda_planned_and_completed.a
  junitClassname: variation.mobile.calendar
  sourceIdentity: contracts/p0/day_agenda_planned_and_completed.yaml
tags: [variation, calendar, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: { file: ../../../../reusable/domain/details/open_calendar_day.yaml, env: { CALENDAR_DATE: "${AGENDA_DATE}" } }
- assertVisible: { id: "calendar-day-planned-summary" }
- assertVisible: { id: "calendar-day-planned-activity-row-${AGENDA_PLANNED_EVENT_ID}" }
- tapOn: { id: "calendar-day-planned-activity-row-${AGENDA_PLANNED_EVENT_ID}" }
- assertVisible: { id: "activity-plan-content-preview" }
- back
- assertVisible: { id: "calendar-day-activity-row-${AGENDA_COMPLETED_ACTIVITY_ID}" }
