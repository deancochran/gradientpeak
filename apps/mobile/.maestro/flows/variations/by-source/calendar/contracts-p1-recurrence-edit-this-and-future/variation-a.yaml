appId: ${MAESTRO_APP_ID}
name: "Variation A — contracts/p1/recurrence_edit_this_and_future.yaml — inspect future scope controls"
properties:
  junitId: variation.mobile.contracts_p1_recurrence_edit_this_and_future.a
  junitClassname: variation.mobile.calendar
  sourceIdentity: contracts/p1/recurrence_edit_this_and_future.yaml
tags: [variation, calendar, by-source]
---
- runFlow: ../../../../reusable/authenticated_home.yaml
- runFlow: { file: ../../../../reusable/domain/details/open_event.yaml, env: { EVENT_ID: "${RECURRING_FUTURE_EVENT_ID_A}" } }
- tapOn: { id: "event-detail-options-trigger" }
- tapOn: { id: "event-detail-options-edit" }
- assertVisible: { id: "event-detail-update-repeat-row" }
- tapOn: { id: "event-detail-update-save-button" }
- assertVisible: "This event only"
- assertVisible: "This and future events"
- assertVisible: "Entire series"
- back
- assertVisible: { id: "event-detail-options-trigger" }
