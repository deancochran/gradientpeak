appId: ${MAESTRO_APP_ID}
name: "Variation B — contracts/p1/recurrence_edit_this_and_future.yaml — rename future series and reopen"
properties:
  junitId: variation.mobile.contracts_p1_recurrence_edit_this_and_future.b
  junitClassname: variation.mobile.calendar
  sourceIdentity: contracts/p1/recurrence_edit_this_and_future.yaml
tags: [variation, calendar, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: { file: ../../../../reusable/domain/details/open_event.yaml, env: { EVENT_ID: "${RECURRING_FUTURE_EVENT_ID_B}" } }
- runFlow: ../../../../reusable/domain/forms/open_event_title_editor.yaml
- inputText: "${RECURRING_FUTURE_TITLE_B}"
- hideKeyboard
- tapOn: { id: "event-detail-update-save-button" }
- tapOn: { id: "event-detail-update-scope-future" }
- runFlow: { file: ../../../../reusable/domain/details/open_event.yaml, env: { EVENT_ID: "${RECURRING_FUTURE_EVENT_ID_B}" } }
- assertVisible: "${RECURRING_FUTURE_TITLE_B}"
