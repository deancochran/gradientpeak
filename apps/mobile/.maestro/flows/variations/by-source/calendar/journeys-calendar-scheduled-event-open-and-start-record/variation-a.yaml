appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/calendar/scheduled_event_open_and_start_record.yaml — inspect scheduled plan then enter recorder"
properties:
  junitId: variation.mobile.journeys_calendar_scheduled_event_open_and_start_record.a
  junitClassname: variation.mobile.calendar
  sourceIdentity: journeys/calendar/scheduled_event_open_and_start_record.yaml
tags: [variation, calendar, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: { file: ../../../../reusable/domain/details/open_event.yaml, env: { EVENT_ID: "${PLANNED_EVENT_ID}" } }
- assertVisible: { id: "event-detail-activity-plan-card" }
- tapOn: { id: "event-detail-activity-plan-card" }
- assertVisible: { id: "activity-plan-content-preview" }
- assertVisible: { id: "activity-plan-estimates" }
- tapOn: { id: "activity-plan-options-trigger" }
- tapOn: { id: "activity-plan-options-start" }
- assertVisible: { id: "recording-setup-remove-plan" }
- assertVisible: { id: "recording-start-button" }
