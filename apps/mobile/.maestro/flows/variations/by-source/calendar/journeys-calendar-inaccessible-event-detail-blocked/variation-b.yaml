appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/calendar/inaccessible_event_detail_blocked.yaml — preserve usable calendar after blocked link"
properties:
  junitId: variation.mobile.journeys_calendar_inaccessible_event_detail_blocked.b
  junitClassname: variation.mobile.calendar
  sourceIdentity: journeys/calendar/inaccessible_event_detail_blocked.yaml
tags: [variation, calendar, by-source]
---
- runFlow: ../../../../reusable/authenticated_home.yaml
- runFlow: ../../../../reusable/open_calendar_tab.yaml
- assertVisible: { id: "create-event-entry" }
- openLink: "${MAESTRO_APP_SCHEME}://event-detail?id=${INACCESSIBLE_EVENT_ID}"
- assertNotVisible: { id: "event-detail-options-edit" }
- assertNotVisible: { id: "event-detail-activity-plan-card" }
- tapOn: { id: "create-event-entry" }
- assertVisible: { id: "create-type-custom" }
- back
- assertVisible: { id: "calendar-screen-ready" }
