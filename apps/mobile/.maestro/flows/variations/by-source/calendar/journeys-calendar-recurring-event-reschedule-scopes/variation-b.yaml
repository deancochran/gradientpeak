appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/calendar/recurring_event_reschedule_scopes.yaml — apply future scope and reopen"
properties:
  junitId: variation.mobile.journeys_calendar_recurring_event_reschedule_scopes.b
  junitClassname: variation.mobile.calendar
  sourceIdentity: journeys/calendar/recurring_event_reschedule_scopes.yaml
tags: [variation, calendar, by-source]
---
- runFlow: ../../../../reusable/authenticated_home.yaml
- runFlow: { file: ../../../../reusable/domain/details/open_event.yaml, env: { EVENT_ID: "${RESCHEDULE_FUTURE_EVENT_ID_B}" } }
- tapOn: { id: "event-detail-options-trigger" }
- tapOn: { id: "event-detail-options-edit" }
- tapOn: { id: "event-detail-update-title-input" }
- eraseText
- inputText: "${RESCHEDULE_FUTURE_TITLE_B}"
- hideKeyboard
- tapOn: { id: "event-detail-update-save-button" }
- tapOn: { id: "event-detail-update-scope-future" }
- assertVisible: "${RECURRING_FUTURE_TITLE}"
- runFlow: { file: ../../../../reusable/domain/details/open_event.yaml, env: { EVENT_ID: "${RESCHEDULE_FUTURE_EVENT_ID_B}" } }
- assertVisible: "${RESCHEDULE_FUTURE_TITLE_B}"
