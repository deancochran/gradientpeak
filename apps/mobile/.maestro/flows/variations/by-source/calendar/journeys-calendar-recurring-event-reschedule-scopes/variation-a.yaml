appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/calendar/recurring_event_reschedule_scopes.yaml — inspect all exact edit scopes"
properties:
  junitId: variation.mobile.journeys_calendar_recurring_event_reschedule_scopes.a
  junitClassname: variation.mobile.calendar
  sourceIdentity: journeys/calendar/recurring_event_reschedule_scopes.yaml
tags: [variation, calendar, by-source]
---
- runFlow: ../../../../reusable/authenticated_home.yaml
- runFlow: { file: ../../../../reusable/domain/details/open_event.yaml, env: { EVENT_ID: "${RESCHEDULE_SINGLE_EVENT_ID_A}" } }
- tapOn: { id: "event-detail-options-trigger" }
- tapOn: { id: "event-detail-options-edit" }
- assertVisible: { id: "event-detail-update-repeat-row" }
- tapOn: { id: "event-detail-update-save-button" }
- assertVisible: "This event only"
- assertVisible: "This and future events"
- assertVisible: "Entire series"
- back
- assertVisible: { id: "event-detail-screen" }
