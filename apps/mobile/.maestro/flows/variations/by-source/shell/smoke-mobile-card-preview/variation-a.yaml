appId: ${MAESTRO_APP_ID}
name: "Variation A — smoke/mobile_card_preview.yaml — inspect and press activity, plan, and route cards"
properties: { junitId: variation.mobile.smoke_mobile_card_preview.a, junitClassname: variation.mobile.shell, sourceIdentity: smoke/mobile_card_preview.yaml }
tags: [variation, shell, preview, by-source]
---
- runFlow: ../../../../reusable/clean_app_launch_signed_out.yaml
- openLink: "${MAESTRO_APP_SCHEME}://storybook?surface=mobile-cards"
- assertVisible: { id: "mobile-card-matrix" }
- assertVisible: "River tempo run"
- tapOn: "River tempo run"
- scrollUntilVisible: { element: { id: "mobile-card-activity-plan-compact" }, direction: DOWN }
- assertVisible: "Progressive tempo builder"
- tapOn: { id: "mobile-card-activity-plan-compact" }
- scrollUntilVisible: { element: "Ridgeline loop", direction: DOWN }
- tapOn: "Ridgeline loop"
- assertVisible: "Rolling approach followed by one sustained climb."
