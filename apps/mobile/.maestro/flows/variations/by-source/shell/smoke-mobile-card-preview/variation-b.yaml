appId: ${MAESTRO_APP_ID}
name: "Variation B — smoke/mobile_card_preview.yaml — inspect group, event, public and private profile card states"
properties: { junitId: variation.mobile.smoke_mobile_card_preview.b, junitClassname: variation.mobile.shell, sourceIdentity: smoke/mobile_card_preview.yaml }
tags: [variation, shell, preview, by-source]
---
- runFlow: ../../../../reusable/clean_app_launch_signed_out.yaml
- openLink: "${MAESTRO_APP_SCHEME}://storybook?surface=mobile-cards"
- scrollUntilVisible: { element: { id: "mobile-card-group-default" }, direction: DOWN }
- tapOn: { id: "mobile-card-group-default" }
- assertVisible: "Morning Climbers"
- assertVisible: { id: "mobile-card-group-compact" }
- scrollUntilVisible: { element: { id: "mobile-card-group-event" }, direction: DOWN }
- assertVisible: "Sunday progression run"
- tapOn: "Sunday progression run"
- scrollUntilVisible: { element: { id: "mobile-card-profile-private" }, direction: DOWN }
- assertVisible: "Avery Morgan"
- assertVisible: "Private athlete profile"
