appId: ${MAESTRO_APP_ID}
name: "Variation A — performance/tab_navigation_budgets.yaml — forward tab route budgets and content"
properties: { junitId: variation.mobile.performance_tab_navigation_budgets.a, junitClassname: variation.mobile.shell, sourceIdentity: performance/tab_navigation_budgets.yaml }
tags: [variation, shell, performance, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- tapOn: { id: "tab-button-plan" }
- assertVisible: { id: "plan-screen" }
- copyTextFrom: { id: "perf-metric-route-plan" }
- evalScript: ${output.performance = output.performance || {}, output.performance.planMs = Number(maestro.copiedText)}
- assertTrue: { condition: "${output.performance.planMs <= 300}", label: "Plan route <= 300ms" }
- tapOn: { id: "tab-button-calendar" }
- assertVisible: { id: "calendar-screen" }
- copyTextFrom: { id: "perf-metric-route-calendar" }
- evalScript: ${output.performance = output.performance || {}, output.performance.calendarMs = Number(maestro.copiedText)}
- assertTrue: { condition: "${output.performance.calendarMs <= 500}", label: "Calendar route <= 500ms" }
