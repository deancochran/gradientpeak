appId: ${MAESTRO_APP_ID}
name: "Variation B — performance/tab_navigation_budgets.yaml — reverse groups and home route budgets"
properties: { junitId: variation.mobile.performance_tab_navigation_budgets.b, junitClassname: variation.mobile.shell, sourceIdentity: performance/tab_navigation_budgets.yaml }
tags: [variation, shell, performance, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- tapOn: { id: "tab-button-groups" }
- assertVisible: { id: "groups-screen" }
- copyTextFrom: { id: "perf-metric-route-groups" }
- evalScript: ${output.performance = output.performance || {}, output.performance.groupsMs = Number(maestro.copiedText)}
- assertTrue: { condition: "${output.performance.groupsMs <= 300}", label: "Groups route <= 300ms" }
- tapOn: { id: "tab-button-home" }
- assertVisible: { id: "home-screen" }
- copyTextFrom: { id: "perf-metric-route-home" }
- evalScript: ${output.performance = output.performance || {}, output.performance.homeMs = Number(maestro.copiedText)}
- assertTrue: { condition: "${output.performance.homeMs <= 300}", label: "Home route <= 300ms" }
