appId: ${MAESTRO_APP_ID}
name: "Variation A — main/tabs_smoke.yaml — core tabs render their owned native screens"
properties: { junitId: variation.mobile.main_tabs_smoke.a, junitClassname: variation.mobile.shell, sourceIdentity: main/tabs_smoke.yaml }
tags: [variation, shell, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- tapOn: { id: "tab-button-plan" }
- assertVisible: { id: "plan-screen" }
- tapOn: { id: "tab-button-calendar" }
- assertVisible: { id: "calendar-screen" }
- tapOn: { id: "tab-button-record" }
- assertVisible: { id: "record-screen-ready" }
- tapOn: { id: "tab-button-profile" }
- assertVisible: { id: "profile-tab-screen" }
- runFlow: ../../../../reusable/assert_runtime_errors_clear.yaml
