appId: ${MAESTRO_APP_ID}
name: "Variation B — main/tabs_smoke.yaml — groups and discover controls return to home shell"
properties: { junitId: variation.mobile.main_tabs_smoke.b, junitClassname: variation.mobile.shell, sourceIdentity: main/tabs_smoke.yaml }
tags: [variation, shell, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- tapOn: { id: "tab-button-groups" }
- assertVisible: { id: "groups-screen" }
- tapOn: { id: "groups-tab-events" }
- assertVisible: { id: "group-event-list" }
- runFlow: ../../../../reusable/open_discover_tab.yaml
- tapOn: { id: "discover-scope-routes" }
- assertVisible: { id: "discover-screen" }
- back
- tapOn: { id: "tab-button-home" }
- assertVisible: { id: "home-screen" }
