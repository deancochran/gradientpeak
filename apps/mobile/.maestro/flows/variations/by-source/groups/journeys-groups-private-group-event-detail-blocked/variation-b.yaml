appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/groups/private_group_event_detail_blocked.yaml — closed-group request does not expose private event"
properties: { junitId: variation.mobile.journeys_groups_private_group_event_detail_blocked.b, junitClassname: variation.mobile.groups, sourceIdentity: journeys/groups/private_group_event_detail_blocked.yaml }
tags: [variation, groups, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- openLink: "${MAESTRO_APP_SCHEME}://group-detail?groupId=${CLOSED_GROUP_ID}"
- tapOn: "Request access"
- assertVisible: "Request pending"
- openLink: "${MAESTRO_APP_SCHEME}://group-event-detail?groupEventId=${PRIVATE_GROUP_EVENT_ID}"
- extendedWaitUntil: { visible: { id: "group-event-detail-unavailable" }, timeout: 15000 }
- assertNotVisible: { id: "group-event-detail-screen" }
- assertNotVisible: "RSVP"
