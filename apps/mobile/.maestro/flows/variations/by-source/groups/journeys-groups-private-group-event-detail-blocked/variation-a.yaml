appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/groups/private_group_event_detail_blocked.yaml — non-member cannot see RSVP or edit controls"
properties: { junitId: variation.mobile.journeys_groups_private_group_event_detail_blocked.a, junitClassname: variation.mobile.groups, sourceIdentity: journeys/groups/private_group_event_detail_blocked.yaml }
tags: [variation, groups, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- openLink: "${MAESTRO_APP_SCHEME}://group-event-detail?groupEventId=${PRIVATE_GROUP_EVENT_ID}"
- extendedWaitUntil: { visible: { id: "group-event-detail-unavailable" }, timeout: 15000 }
- assertVisible: "This group event may be unavailable."
- assertNotVisible: { id: "group-event-detail-overflow" }
- assertNotVisible: "RSVP"
