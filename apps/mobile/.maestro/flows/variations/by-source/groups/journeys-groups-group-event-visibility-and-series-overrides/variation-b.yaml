appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/groups/group_event_visibility_and_series_overrides.yaml — occurrence RSVP changes without losing series state"
properties: { junitId: variation.mobile.journeys_groups_group_event_visibility_and_series_overrides.b, junitClassname: variation.mobile.groups, sourceIdentity: journeys/groups/group_event_visibility_and_series_overrides.yaml }
tags: [variation, groups, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${GROUP_EVENT_USER_EMAIL_B}", STANDARD_USER_PASS: "${GROUP_EVENT_USER_PASS_B}" } }
- runFlow: ../../../../reusable/open_groups_tab.yaml
- scrollUntilVisible: { element: "${GROUP_EVENT_TITLE}", direction: DOWN }
- tapOn: "${GROUP_EVENT_TITLE}"
- tapOn: "Going"
- assertVisible: "Going"
- back
- tapOn: "${GROUP_EVENT_TITLE}"
- assertVisible: "Going"
- tapOn: "Not going"
- assertVisible: "Not going"
- assertVisible: "Future dates"
