appId: ${MAESTRO_APP_ID}
name: "Variation B — contracts/p3/message_new_conversation_from_inbox.yaml — remove selected recipient, reselect, and create"
properties: { junitId: variation.mobile.contracts_p3_message_new_conversation_from_inbox.b, junitClassname: variation.mobile.messaging, sourceIdentity: contracts/p3/message_new_conversation_from_inbox.yaml }
tags: [variation, messaging, contract, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: ../../../../reusable/open_messages_inbox.yaml
- tapOn: { id: "messages-new-trigger" }
- tapOn: { id: "messages-new-search-input" }
- inputText: "${MESSAGE_TARGET_USERNAME}"
- hideKeyboard
- tapOn: { id: "messages-new-user-${MESSAGE_TARGET_USER_ID}" }
- assertVisible: { id: "messages-new-selected-${MESSAGE_TARGET_USER_ID}" }
- tapOn: { id: "messages-new-selected-${MESSAGE_TARGET_USER_ID}" }
- tapOn: { id: "messages-new-user-${MESSAGE_TARGET_USER_ID}" }
- tapOn: { id: "messages-new-next-trigger" }
- tapOn: { id: "message-input" }
- inputText: "${NEW_CONVERSATION_MESSAGE_B}"
- tapOn: { id: "message-send-button" }
- assertVisible: "${NEW_CONVERSATION_MESSAGE_B}"
