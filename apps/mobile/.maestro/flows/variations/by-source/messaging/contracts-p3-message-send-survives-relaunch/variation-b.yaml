appId: ${MAESTRO_APP_ID}
name: "Variation B — contracts/p3/message_send_survives_relaunch.yaml — sent message survives inbox back, relaunch, and reopen"
properties: { junitId: variation.mobile.contracts_p3_message_send_survives_relaunch.b, junitClassname: variation.mobile.messaging, sourceIdentity: contracts/p3/message_send_survives_relaunch.yaml }
tags: [variation, messaging, contract, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: { file: ../../../../reusable/domain/details/open_message_thread.yaml, env: { CONVERSATION_ID: "${MESSAGE_CONVERSATION_ID}" } }
- tapOn: { id: "message-input" }
- inputText: "${RELAUNCH_MESSAGE_B}"
- tapOn: { id: "message-send-button" }
- assertVisible: "${RELAUNCH_MESSAGE_B}"
- back
- assertVisible: { id: "messages-conversation-${MESSAGE_CONVERSATION_ID}" }
- runFlow: { file: ../../../../reusable/preserve_state_relaunch.yaml, env: { EXPECTED_BOUNDARY_ID: "home-screen" } }
- runFlow: ../../../../reusable/open_messages_inbox.yaml
- tapOn: { id: "messages-conversation-${MESSAGE_CONVERSATION_ID}" }
- assertVisible: "${RELAUNCH_MESSAGE_B}"
