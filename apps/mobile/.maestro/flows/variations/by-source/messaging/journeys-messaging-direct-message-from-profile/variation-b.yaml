appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/messaging/direct_message_from_profile.yaml — cancel profile draft then reopen and send replacement"
properties: { junitId: variation.mobile.journeys_messaging_direct_message_from_profile.b, junitClassname: variation.mobile.messaging, sourceIdentity: journeys/messaging/direct_message_from_profile.yaml }
tags: [variation, messaging, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: { file: ../../../../reusable/domain/details/open_user.yaml, env: { USER_ID: "${MESSAGE_TARGET_USER_ID}" } }
- tapOn: { id: "user-detail-message-button" }
- tapOn: { id: "message-input" }
- inputText: "discarded-direct-message"
- back
- runFlow: { file: ../../../../reusable/domain/details/open_user.yaml, env: { USER_ID: "${MESSAGE_TARGET_USER_ID}" } }
- tapOn: { id: "user-detail-message-button" }
- assertNotVisible: "discarded-direct-message"
- tapOn: { id: "message-input" }
- inputText: "${DIRECT_MESSAGE_B}"
- tapOn: { id: "message-send-button" }
- assertVisible: "${DIRECT_MESSAGE_B}"
