appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/messaging/inbox_open.yaml — inbox list opens compose and cancels back"
properties: { junitId: variation.mobile.journeys_messaging_inbox_open.a, junitClassname: variation.mobile.messaging, sourceIdentity: journeys/messaging/inbox_open.yaml }
tags: [variation, messaging, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: ../../../../reusable/open_messages_inbox.yaml
- assertVisible: { id: "messages-screen" }
- assertVisible: { id: "messages-conversation-list" }
- tapOn: { id: "messages-new-trigger" }
- assertVisible: { id: "messages-new-screen" }
- tapOn: { id: "messages-new-search-input" }
- inputText: "${MESSAGE_TARGET_USERNAME}"
- hideKeyboard
- back
- assertVisible: { id: "messages-screen" }
