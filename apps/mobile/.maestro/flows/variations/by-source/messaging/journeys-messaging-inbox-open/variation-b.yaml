appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/messaging/inbox_open.yaml — inbox search exposes unread conversation list state"
properties: { junitId: variation.mobile.journeys_messaging_inbox_open.b, junitClassname: variation.mobile.messaging, sourceIdentity: journeys/messaging/inbox_open.yaml }
tags: [variation, messaging, by-source, intentional-red]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: ../../../../reusable/open_messages_inbox.yaml
- assertVisible: "${MESSAGE_UNREAD_SUMMARY}"
- tapOn: { id: "messages-inbox-search-input" }
- inputText: "${MESSAGE_TARGET_USERNAME}"
- hideKeyboard
- assertVisible: { id: "messages-conversation-${MESSAGE_CONVERSATION_ID}" }
- tapOn: { id: "messages-conversation-${MESSAGE_CONVERSATION_ID}" }
- assertVisible: "${MESSAGE_EXISTING_TEXT}"
