appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/messaging/inbox_expect_conversation.yaml — expected conversation opens existing thread content"
properties: { junitId: variation.mobile.journeys_messaging_inbox_expect_conversation.a, junitClassname: variation.mobile.messaging, sourceIdentity: journeys/messaging/inbox_expect_conversation.yaml }
tags: [variation, messaging, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: ../../../../reusable/open_messages_inbox.yaml
- assertVisible: { id: "messages-conversation-list" }
- assertVisible: { id: "messages-conversation-${MESSAGE_CONVERSATION_ID}" }
- assertVisible: "${MESSAGE_TARGET_USERNAME}"
- tapOn: { id: "messages-conversation-${MESSAGE_CONVERSATION_ID}" }
- assertVisible: { id: "message-thread-list" }
- assertVisible: "${MESSAGE_EXISTING_TEXT}"
