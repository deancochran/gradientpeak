appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/messaging/inbox_expect_conversation.yaml — inbox search narrows to expected conversation"
properties: { junitId: variation.mobile.journeys_messaging_inbox_expect_conversation.b, junitClassname: variation.mobile.messaging, sourceIdentity: journeys/messaging/inbox_expect_conversation.yaml }
tags: [variation, messaging, by-source, intentional-red]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: ../../../../reusable/open_messages_inbox.yaml
- assertVisible: { id: "messages-conversation-list" }
- tapOn: { id: "messages-inbox-search-input" }
- inputText: "${MESSAGE_TARGET_USERNAME}"
- hideKeyboard
- assertVisible: { id: "messages-conversation-${MESSAGE_CONVERSATION_ID}" }
- tapOn: { id: "messages-inbox-search-clear" }
- assertVisible: { id: "messages-conversation-list" }
