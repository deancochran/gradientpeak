appId: ${MAESTRO_APP_ID}
name: "Variation B — contracts/p3/message_inbox_thread_persists.yaml — thread read state survives back and reopen"
properties: { junitId: variation.mobile.contracts_p3_message_inbox_thread_persists.b, junitClassname: variation.mobile.messaging, sourceIdentity: contracts/p3/message_inbox_thread_persists.yaml }
tags: [variation, messaging, contract, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${MESSAGE_THREAD_USER_EMAIL_B}", STANDARD_USER_PASS: "${MESSAGE_THREAD_USER_PASS_B}" } }
- runFlow: ../../../../reusable/open_messages_inbox.yaml
- assertVisible: "${MESSAGE_THREAD_UNREAD_SUMMARY_B}"
- tapOn: { id: "messages-conversation-${MESSAGE_THREAD_CONVERSATION_ID_B}" }
- assertVisible: "${MESSAGE_THREAD_EXISTING_TEXT_B}"
- back
- tapOn: { id: "messages-conversation-${MESSAGE_THREAD_CONVERSATION_ID_B}" }
- assertVisible: { id: "message-thread-list" }
- assertVisible: "${MESSAGE_THREAD_EXISTING_TEXT_B}"
