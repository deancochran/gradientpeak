appId: ${MAESTRO_APP_ID}
name: "Variation A — contracts/p0/auth_protected_entry_sign_in.yaml — integrations deep link returns after sign-in"
properties: { junitId: variation.mobile.contracts_p0_auth_protected_entry_sign_in.a, junitClassname: variation.mobile.auth, sourceIdentity: contracts/p0/auth_protected_entry_sign_in.yaml }
tags: [variation, auth, contract, by-source]
---
- runFlow: ../../../../reusable/ensure_signed_out.yaml
- openLink: "${MAESTRO_APP_SCHEME}://integrations"
- assertVisible: { id: "sign-in-screen" }
- tapOn: { id: "email-input" }
- inputText: "${STANDARD_USER_EMAIL}"
- tapOn: { id: "password-input" }
- inputText: "${STANDARD_USER_PASS}"
- hideKeyboard
- tapOn: { id: "sign-in-button" }
- extendedWaitUntil: { visible: { id: "integrations-screen" }, timeout: 20000 }
