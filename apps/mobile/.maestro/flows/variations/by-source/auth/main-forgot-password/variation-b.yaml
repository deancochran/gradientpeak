appId: ${MAESTRO_APP_ID}
name: "Variation B — main/forgot_password.yaml — invalid reset email can be corrected"
properties: { junitId: variation.mobile.main_forgot_password.b, junitClassname: variation.mobile.auth, sourceIdentity: main/forgot_password.yaml }
tags: [variation, auth, recovery, by-source]
---
- runFlow: ../../../../reusable/ensure_signed_out.yaml
- tapOn: { id: "forgot-password-button" }
- tapOn: "Email address"
- inputText: "bad-address"
- hideKeyboard
- tapOn: { id: "send-reset-button" }
- assertVisible: { id: "forgot-password-screen" }
- tapOn: "Email address"
- eraseText
- inputText: "${RESET_EMAIL}"
- hideKeyboard
- tapOn: { id: "send-reset-button" }
- extendedWaitUntil: { visible: { id: "reset-email-sent-screen" }, timeout: 15000 }
