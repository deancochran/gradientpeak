appId: ${MAESTRO_APP_ID}
name: "Variation B — contracts/p0/auth_sign_out_blocks_relaunch.yaml — cancel preserves session before later sign-out"
properties: { junitId: variation.mobile.contracts_p0_auth_sign_out_blocks_relaunch.b, junitClassname: variation.mobile.auth, sourceIdentity: contracts/p0/auth_sign_out_blocks_relaunch.yaml }
tags: [variation, auth, contract, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- tapOn: { id: "tab-button-profile" }
- scrollUntilVisible: { element: { id: "profile-tab-sign-out" }, direction: DOWN }
- tapOn: { id: "profile-tab-sign-out" }
- back
- assertVisible: { id: "profile-tab-settings" }
- tapOn: { id: "profile-tab-sign-out" }
- tapOn: "Sign Out"
- openLink: "${MAESTRO_APP_SCHEME}://training-preferences"
- assertVisible: { id: "sign-in-screen" }
