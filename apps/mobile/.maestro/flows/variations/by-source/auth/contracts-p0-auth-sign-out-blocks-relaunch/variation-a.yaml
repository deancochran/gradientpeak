appId: ${MAESTRO_APP_ID}
name: "Variation A — contracts/p0/auth_sign_out_blocks_relaunch.yaml — confirmed profile-tab sign-out blocks relaunch"
properties: { junitId: variation.mobile.contracts_p0_auth_sign_out_blocks_relaunch.a, junitClassname: variation.mobile.auth, sourceIdentity: contracts/p0/auth_sign_out_blocks_relaunch.yaml }
tags: [variation, auth, contract, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- tapOn: { id: "tab-button-profile" }
- scrollUntilVisible: { element: { id: "profile-tab-sign-out" }, direction: DOWN }
- tapOn: { id: "profile-tab-sign-out" }
- assertVisible: "Are you sure you want to sign out?"
- tapOn: "Sign Out"
- assertVisible: { id: "sign-in-screen" }
- runFlow: { file: ../../../../reusable/preserve_state_relaunch.yaml, env: { EXPECTED_BOUNDARY_ID: "sign-in-screen" } }
- assertVisible: { id: "sign-in-screen" }
- assertNotVisible: { id: "tab-button-home" }
