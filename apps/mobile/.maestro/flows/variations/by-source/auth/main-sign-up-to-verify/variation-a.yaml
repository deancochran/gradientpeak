appId: ${MAESTRO_APP_ID}
name: "Variation A — main/sign_up_to_verify.yaml — valid sign-up reaches verification and resend"
properties: { junitId: variation.mobile.main_sign_up_to_verify.a, junitClassname: variation.mobile.auth, sourceIdentity: main/sign_up_to_verify.yaml }
tags: [variation, auth, signup, by-source]
---
- runFlow: ../../../../reusable/ensure_signed_out.yaml
- tapOn: { id: "sign-up-link-button" }
- tapOn: { id: "email-input" }
- inputText: "${SIGNUP_EMAIL_A}"
- tapOn: { id: "password-input" }
- inputText: "${SIGNUP_PASSWORD}"
- swipe: { direction: UP }
- tapOn: { id: "repeat-password-input" }
- inputText: "${SIGNUP_PASSWORD}"
- hideKeyboard
- tapOn: { id: "sign-up-button" }
- extendedWaitUntil: { visible: { id: "verify-screen" }, timeout: 15000 }
- tapOn: { id: "resend-code-button" }
- assertVisible: "Verification code sent"
