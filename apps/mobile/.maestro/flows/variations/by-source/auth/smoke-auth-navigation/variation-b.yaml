appId: ${MAESTRO_APP_ID}
name: "Variation B — smoke/auth_navigation.yaml — validation survives reverse auth-screen traversal"
properties: { junitId: variation.mobile.smoke_auth_navigation.b, junitClassname: variation.mobile.auth, sourceIdentity: smoke/auth_navigation.yaml }
tags: [variation, auth, smoke, by-source]
---
- runFlow: ../../../../reusable/ensure_signed_out.yaml
- tapOn: { id: "sign-up-link-button" }
- tapOn: { id: "email-input" }
- inputText: "not-an-email"
- swipe: { direction: UP }
- tapOn: { id: "sign-in-link-button" }
- tapOn: { id: "forgot-password-button" }
- tapOn: { id: "back-to-signin-link-button" }
- assertVisible: { id: "sign-in-screen" }
- runFlow: ../../../../reusable/assert_runtime_errors_clear.yaml
