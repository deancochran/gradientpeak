appId: ${MAESTRO_APP_ID}
name: "Variation A — smoke/auth_navigation.yaml — public auth screens remain reachable without runtime errors"
properties: { junitId: variation.mobile.smoke_auth_navigation.a, junitClassname: variation.mobile.auth, sourceIdentity: smoke/auth_navigation.yaml }
tags: [variation, auth, smoke, by-source]
---
- runFlow: ../../../../reusable/ensure_signed_out.yaml
- runFlow: ../../../../reusable/assert_runtime_errors_clear.yaml
- tapOn: { id: "forgot-password-button" }
- assertVisible: { id: "forgot-password-screen" }
- back
- tapOn: { id: "sign-up-link-button" }
- assertVisible: { id: "sign-up-screen" }
- back
- assertVisible: { id: "sign-in-screen" }
- runFlow: ../../../../reusable/assert_runtime_errors_clear.yaml
