appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/resilience/warm_relaunch_authenticated.yaml — message and notification controls survive warm relaunch"
properties: { junitId: variation.mobile.journeys_resilience_warm_relaunch_authenticated.b, junitClassname: variation.mobile.auth, sourceIdentity: journeys/resilience/warm_relaunch_authenticated.yaml }
tags: [variation, auth, resilience, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- tapOn: { id: "messages-header-button" }
- assertVisible: { id: "messages-screen" }
- back
- runFlow: { file: ../../../../reusable/preserve_state_relaunch.yaml, env: { EXPECTED_BOUNDARY_ID: "notifications-header-button" } }
- extendedWaitUntil: { visible: { id: "notifications-header-button" }, timeout: 15000 }
- tapOn: { id: "notifications-header-button" }
- assertVisible: { id: "notifications-screen" }
