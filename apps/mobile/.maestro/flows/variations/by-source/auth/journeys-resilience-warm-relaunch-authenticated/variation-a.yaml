appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/resilience/warm_relaunch_authenticated.yaml — plan tab remains available after warm relaunch"
properties: { junitId: variation.mobile.journeys_resilience_warm_relaunch_authenticated.a, junitClassname: variation.mobile.auth, sourceIdentity: journeys/resilience/warm_relaunch_authenticated.yaml }
tags: [variation, auth, resilience, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- tapOn: { id: "tab-button-plan" }
- assertVisible: { id: "plan-screen" }
- runFlow: { file: ../../../../reusable/preserve_state_relaunch.yaml, env: { EXPECTED_BOUNDARY_ID: "home-screen" } }
- extendedWaitUntil: { visible: { id: "home-screen" }, timeout: 15000 }
- tapOn: { id: "tab-button-plan" }
- assertVisible: { id: "plan-screen" }
