appId: ${MAESTRO_APP_ID}
name: "Variation A — contracts/p0/auth_session_relaunch.yaml — authenticated home session survives relaunch"
properties: { junitId: variation.mobile.contracts_p0_auth_session_relaunch.a, junitClassname: variation.mobile.auth, sourceIdentity: contracts/p0/auth_session_relaunch.yaml }
tags: [variation, auth, contract, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: ../../../../reusable/domain/navigation/open_profile_tab.yaml
- runFlow: { file: ../../../../reusable/preserve_state_relaunch.yaml, env: { EXPECTED_BOUNDARY_ID: "home-screen" } }
- extendedWaitUntil: { visible: { id: "home-screen" }, timeout: 15000 }
- assertNotVisible: { id: "sign-in-screen" }
