appId: ${MAESTRO_APP_ID}
name: "Variation B — contracts/p0/auth_session_relaunch.yaml — protected preferences remain accessible after relaunch"
properties: { junitId: variation.mobile.contracts_p0_auth_session_relaunch.b, junitClassname: variation.mobile.auth, sourceIdentity: contracts/p0/auth_session_relaunch.yaml }
tags: [variation, auth, contract, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: ../../../../reusable/domain/details/open_training_preferences.yaml
- assertVisible: { id: "training-preferences-screen" }
- runFlow: { file: ../../../../reusable/preserve_state_relaunch.yaml, env: { EXPECTED_BOUNDARY_ID: "home-screen" } }
- runFlow: ../../../../reusable/domain/details/open_training_preferences.yaml
- assertVisible: { id: "training-preferences-save-button" }
- assertNotVisible: { id: "sign-in-screen" }
