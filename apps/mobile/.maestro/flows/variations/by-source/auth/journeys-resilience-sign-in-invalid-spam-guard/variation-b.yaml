appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/resilience/sign_in_invalid_spam_guard.yaml — malformed input recovers into password reset"
properties: { junitId: variation.mobile.journeys_resilience_sign_in_invalid_spam_guard.b, junitClassname: variation.mobile.auth, sourceIdentity: journeys/resilience/sign_in_invalid_spam_guard.yaml }
tags: [variation, auth, by-source]
---
- runFlow: ../../../../reusable/ensure_signed_out.yaml
- tapOn: { id: "email-input" }
- inputText: "not-an-email"
- tapOn: { id: "password-input" }
- inputText: "short"
- hideKeyboard
- tapOn: { id: "sign-in-button" }
- assertVisible: { id: "sign-in-screen" }
- tapOn: { id: "forgot-password-button" }
- assertVisible: { id: "forgot-password-screen" }
- tapOn: { id: "back-to-signin-link-button" }
- assertVisible: { id: "sign-in-screen" }
