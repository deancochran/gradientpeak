appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/resilience/sign_in_invalid_spam_guard.yaml — repeated rejected credentials keep sign-in usable"
properties: { junitId: variation.mobile.journeys_resilience_sign_in_invalid_spam_guard.a, junitClassname: variation.mobile.auth, sourceIdentity: journeys/resilience/sign_in_invalid_spam_guard.yaml }
tags: [variation, auth, by-source]
---
- runFlow: ../../../../reusable/ensure_signed_out.yaml
- tapOn: { id: "email-input" }
- inputText: "gradientpeak.maestro.invalid@example.com"
- tapOn: { id: "password-input" }
- inputText: "wrong-password"
- hideKeyboard
- tapOn: { id: "sign-in-button" }
- extendedWaitUntil: { visible: { id: "root-error-container" }, timeout: 10000 }
- tapOn: { id: "sign-in-button" }
- extendedWaitUntil: { visible: { id: "root-error-container" }, timeout: 10000 }
- assertVisible: { id: "sign-in-screen" }
- assertVisible: { id: "forgot-password-button" }
