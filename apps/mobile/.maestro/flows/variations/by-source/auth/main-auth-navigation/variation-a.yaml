appId: ${MAESTRO_APP_ID}
name: "Variation A — main/auth_navigation.yaml — sign-up and recovery return to sign-in"
properties: { junitId: variation.mobile.main_auth_navigation.a, junitClassname: variation.mobile.auth, sourceIdentity: main/auth_navigation.yaml }
tags: [variation, auth, by-source]
---
- runFlow: ../../../../reusable/ensure_signed_out.yaml
- tapOn: { id: "sign-up-link-button" }
- assertVisible: { id: "sign-up-screen" }
- swipe: { direction: UP }
- tapOn: { id: "sign-in-link-button" }
- assertVisible: { id: "sign-in-screen" }
- tapOn: { id: "forgot-password-button" }
- assertVisible: { id: "forgot-password-screen" }
- tapOn: { id: "back-to-signin-link-button" }
- assertVisible: { id: "sign-in-screen" }
