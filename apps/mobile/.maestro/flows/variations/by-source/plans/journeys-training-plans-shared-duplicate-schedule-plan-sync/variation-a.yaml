appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/training-plans/shared_duplicate_schedule_plan_sync.yaml — duplicate shared plan and schedule"
properties:
  junitId: variation.mobile.journeys_training_plans_shared_duplicate_schedule_plan_sync.a
  junitClassname: variation.mobile.plans
  sourceIdentity: journeys/training-plans/shared_duplicate_schedule_plan_sync.yaml
tags: [variation, plans, by-source]
---
- runFlow: ../../../../reusable/authenticated_home.yaml
- runFlow: ../../../../reusable/open_discover_tab.yaml
- tapOn: { id: "discover-scope-trainingPlans" }
- tapOn: { id: "discover-search-input" }
- inputText: "${PLAN_TRAINING_PLAN_NAME}"
- hideKeyboard
- tapOn: "${PLAN_TRAINING_PLAN_NAME}"
- assertVisible: { id: "training-plan-schedule" }
- tapOn: { id: "training-plan-options-trigger" }
- tapOn: { id: "training-plan-options-duplicate" }
- tapOn: { id: "training-plan-options-schedule" }
- assertVisible: { id: "apply-template-anchor-date" }
- tapOn: { id: "training-plan-anchor-start" }
- tapOn: { id: "training-plan-schedule-confirm" }
- assertVisible: { id: "plan-screen" }
