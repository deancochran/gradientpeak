appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/training-plans/shared_duplicate_schedule_plan_sync.yaml — verify plan and calendar surfaces"
properties:
  junitId: variation.mobile.journeys_training_plans_shared_duplicate_schedule_plan_sync.b
  junitClassname: variation.mobile.plans
  sourceIdentity: journeys/training-plans/shared_duplicate_schedule_plan_sync.yaml
tags: [variation, plans, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: ../../../../reusable/open_plan_tab.yaml
- assertVisible: { id: "plan-training-plan-card-${PLAN_TRAINING_PLAN_ID}" }
- tapOn: { id: "plan-training-plan-card-${PLAN_TRAINING_PLAN_ID}" }
- assertVisible: { id: "training-plan-schedule" }
- back
- runFlow: { file: ../../../../reusable/domain/details/open_calendar_day.yaml, env: { CALENDAR_DATE: "${PLAN_SELECTED_DATE}" } }
- assertVisible: { id: "calendar-day-row-${PLAN_SELECTED_DATE}" }
- tapOn: { id: "calendar-day-planned-activity-row-${PLAN_SCHEDULED_EVENT_ID}" }
- assertVisible: { id: "event-detail-activity-plan-card" }
