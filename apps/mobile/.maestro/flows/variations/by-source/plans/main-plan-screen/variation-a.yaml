appId: ${MAESTRO_APP_ID}
name: "Variation A — main/plan_screen.yaml — inspect training path and exact plan cards"
properties:
  junitId: variation.mobile.main_plan_screen.a
  junitClassname: variation.mobile.plans
  sourceIdentity: main/plan_screen.yaml
tags: [variation, plans, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: ../../../../reusable/open_plan_tab.yaml
- assertVisible: { id: "plan-screen" }
- assertVisible: { id: "training-path-section" }
- assertVisible: "Weekly Training Path"
- runFlow: { file: ../../../../reusable/domain/plans/open_activity_plan_card.yaml, env: { ACTIVITY_PLAN_ID: "${PLAN_ACTIVITY_PLAN_ID}" } }
- back
- assertVisible: { id: "plan-training-plan-card-${PLAN_TRAINING_PLAN_ID}" }
