appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/plans/goal_entry_open.yaml — open existing goal and its editor"
properties:
  junitId: variation.mobile.journeys_plans_goal_entry_open.b
  junitClassname: variation.mobile.plans
  sourceIdentity: journeys/plans/goal_entry_open.yaml
tags: [variation, plans, by-source]
---
- runFlow: ../../../../reusable/authenticated_home.yaml
- runFlow: { file: ../../../../reusable/domain/details/open_goal.yaml, env: { GOAL_ID: "${EDIT_GOAL_ID}" } }
- assertVisible: { id: "goal-detail-options-trigger" }
- tapOn: { id: "goal-detail-options-trigger" }
- tapOn: { id: "goal-detail-options-edit" }
- assertVisible: { id: "goal-editor-form" }
- assertVisible: { id: "goal-editor-title-input" }
- back
- assertVisible: { id: "goal-detail-options-trigger" }
