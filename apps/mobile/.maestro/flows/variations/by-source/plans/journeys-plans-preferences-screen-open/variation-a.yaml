appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/plans/preferences_screen_open.yaml — inspect schedule preference controls"
properties:
  junitId: variation.mobile.journeys_plans_preferences_screen_open.a
  junitClassname: variation.mobile.plans
  sourceIdentity: journeys/plans/preferences_screen_open.yaml
tags: [variation, plans, by-source]
---
- runFlow: ../../../../reusable/authenticated_home.yaml
- runFlow: ../../../../reusable/open_plan_tab.yaml
- tapOn: { id: "plan-signals-settings-button" }
- assertVisible: { id: "training-preferences-screen" }
- assertVisible: { id: "training-preferences-tab-schedule" }
- assertVisible: { id: "preferences-min-sessions" }
- assertVisible: { id: "preferences-max-sessions" }
- assertVisible: { id: "preferences-max-duration" }
- assertVisible: { id: "training-preferences-save-button" }
