appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/training-plans/create_screen_open.yaml — edit draft identity and inspect schedule"
properties:
  junitId: variation.mobile.journeys_training_plans_create_screen_open.a
  junitClassname: variation.mobile.plans
  sourceIdentity: journeys/training-plans/create_screen_open.yaml
tags: [variation, plans, by-source]
---
- runFlow:
    file: ../../../../reusable/open_own_profile.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- tapOn: { id: "my-training-plans" }
- tapOn: { id: "training-plans-list-create-trigger" }
- assertVisible: { id: "builder-strategy-composer" }
- tapOn: { id: "builder-edit-plan" }
- tapOn: { id: "builder-plan-name-input" }
- inputText: "Dedicated builder variation A"
- tapOn: { id: "training-plan-builder-sheet-save" }
- assertVisible: { id: "builder-configuration-grid" }
- tapOn: { id: "builder-configuration-schedulePreview" }
- assertVisible: { id: "training-plan-builder-sheet" }
- back
- assertVisible: { id: "builder-strategy-composer" }
