appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/training-plans/create_screen_open.yaml — inspect goal and workout pickers"
properties:
  junitId: variation.mobile.journeys_training_plans_create_screen_open.b
  junitClassname: variation.mobile.plans
  sourceIdentity: journeys/training-plans/create_screen_open.yaml
tags: [variation, plans, by-source]
---
- runFlow:
    file: ../../../../reusable/open_own_profile.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- tapOn: { id: "my-training-plans" }
- tapOn: { id: "training-plans-list-create-trigger" }
- tapOn: { id: "builder-configuration-goals" }
- assertVisible: { id: "builder-goal-editor-modal" }
- assertVisible: { id: "builder-create-plan-goal" }
- back
- tapOn: { id: "builder-add-activity" }
- assertVisible: { id: "training-plan-builder-activity-picker-search-input" }
- tapOn: { id: "training-plan-builder-activity-picker-filter-button" }
- assertVisible: { id: "training-plan-builder-activity-filter-sheet" }
- back
- assertVisible: { id: "training-plan-builder-activity-picker-search-input" }
