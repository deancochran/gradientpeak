appId: ${MAESTRO_APP_ID}
name: "Variation B — contracts/p0/plan_calendar_record_complete.yaml — selected agenda records and preserves plan relation"
properties:
  junitId: variation.mobile.contracts_p0_plan_calendar_record_complete.b
  junitClassname: variation.mobile.plans
  sourceIdentity: contracts/p0/plan_calendar_record_complete.yaml
tags: [variation, plans, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: { file: ../../../../reusable/domain/plans/open_scheduled_event.yaml, env: { CALENDAR_DATE: "${PLAN_SELECTED_DATE}", SCHEDULED_EVENT_ID: "${PLAN_SCHEDULED_EVENT_ID}" } }
- tapOn: { id: "event-detail-activity-plan-card" }
- tapOn: { id: "activity-plan-options-trigger" }
- tapOn: { id: "activity-plan-options-start" }
- tapOn: { id: "recording-start-button" }
- tapOn: { id: "recording-finish-button" }
- assertVisible: { id: "recording-review-summary" }
- tapOn: "Save Activity"
- extendedWaitUntil: { visible: { id: "home-screen" }, timeout: 30000 }
- tapOn: { id: "tab-button-profile" }
- scrollUntilVisible: { element: { id: "my-activities" }, direction: DOWN }
- tapOn: { id: "my-activities" }
- tapOn: { id: "activities-list-item-.*" }
- assertVisible: { id: "activity-detail-open-activity-plan" }
