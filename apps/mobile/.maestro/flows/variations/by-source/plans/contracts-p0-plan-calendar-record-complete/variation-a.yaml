appId: ${MAESTRO_APP_ID}
name: "Variation A — contracts/p0/plan_calendar_record_complete.yaml — planned event enters lifecycle and review"
properties:
  junitId: variation.mobile.contracts_p0_plan_calendar_record_complete.a
  junitClassname: variation.mobile.plans
  sourceIdentity: contracts/p0/plan_calendar_record_complete.yaml
tags: [variation, plans, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: { file: ../../../../reusable/domain/details/open_event.yaml, env: { EVENT_ID: "${PLANNED_EVENT_ID}" } }
- tapOn: { id: "event-detail-activity-plan-card" }
- assertVisible: { id: "activity-plan-content-preview" }
- tapOn: { id: "activity-plan-options-trigger" }
- tapOn: { id: "activity-plan-options-start" }
- assertVisible: { id: "recording-setup-remove-plan" }
- tapOn: { id: "recording-start-button" }
- assertVisible: { id: "activity-interval-insight-card" }
- tapOn: { id: "recording-pause-button" }
- tapOn: { id: "recording-resume-button" }
- tapOn: { id: "recording-finish-button" }
- assertVisible: { id: "recording-review-summary" }
- assertVisible: "${PLAN_ACTIVITY_PLAN_NAME}"
