appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/activity-plans/shared_duplicate_schedule_remove.yaml — open scheduled agenda item and remove schedule"
properties:
  junitId: variation.mobile.journeys_activity_plans_shared_duplicate_schedule_remove.b
  junitClassname: variation.mobile.plans
  sourceIdentity: journeys/activity-plans/shared_duplicate_schedule_remove.yaml
tags: [variation, plans, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: { file: ../../../../reusable/domain/plans/open_scheduled_event.yaml, env: { CALENDAR_DATE: "${PLAN_SELECTED_DATE}", SCHEDULED_EVENT_ID: "${PLAN_SCHEDULED_EVENT_ID}" } }
- tapOn: { id: "event-detail-activity-plan-card" }
- assertVisible: { id: "activity-plan-content-preview" }
- tapOn: { id: "activity-plan-options-trigger" }
- assertVisible: { id: "activity-plan-options-remove-schedule" }
- tapOn: { id: "activity-plan-options-remove-schedule" }
- assertVisible: "Remove Schedule"
- back
- assertVisible: { id: "activity-plan-options-trigger" }
