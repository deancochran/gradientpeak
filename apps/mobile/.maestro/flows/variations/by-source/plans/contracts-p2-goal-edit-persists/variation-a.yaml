appId: ${MAESTRO_APP_ID}
name: "Variation A — contracts/p2/goal_edit_persists.yaml — cancel an unsaved goal rename"
properties:
  junitId: variation.mobile.contracts_p2_goal_edit_persists.a
  junitClassname: variation.mobile.plans
  sourceIdentity: contracts/p2/goal_edit_persists.yaml
tags: [variation, plans, by-source]
---
- runFlow: ../../../../reusable/authenticated_home.yaml
- runFlow: { file: ../../../../reusable/domain/details/open_goal.yaml, env: { GOAL_ID: "${EDIT_GOAL_ID_A}" } }
- tapOn: { id: "goal-detail-options-trigger" }
- tapOn: { id: "goal-detail-options-edit" }
- tapOn: { id: "goal-editor-title-input" }
- eraseText
- inputText: "Unsaved goal persistence variation"
- hideKeyboard
- back
- assertVisible: { id: "goal-detail-options-trigger" }
- assertNotVisible: "Unsaved goal persistence variation"
