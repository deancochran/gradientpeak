appId: ${MAESTRO_APP_ID}
name: "Variation B — contracts/p2/goal_edit_persists.yaml — save exact title and reopen goal"
properties:
  junitId: variation.mobile.contracts_p2_goal_edit_persists.b
  junitClassname: variation.mobile.plans
  sourceIdentity: contracts/p2/goal_edit_persists.yaml
tags: [variation, plans, by-source]
---
- runFlow: ../../../../reusable/authenticated_home.yaml
- runFlow: { file: ../../../../reusable/domain/details/open_goal.yaml, env: { GOAL_ID: "${EDIT_GOAL_ID_B}" } }
- tapOn: { id: "goal-detail-options-trigger" }
- tapOn: { id: "goal-detail-options-edit" }
- tapOn: { id: "goal-editor-title-input" }
- eraseText
- inputText: "${EDIT_GOAL_TITLE_B}"
- hideKeyboard
- tapOn: "Save"
- assertVisible: "${EDIT_GOAL_TITLE_B}"
- runFlow: { file: ../../../../reusable/domain/details/open_goal.yaml, env: { GOAL_ID: "${EDIT_GOAL_ID_B}" } }
- assertVisible: "${EDIT_GOAL_TITLE_B}"
