appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/plans/list_screen_open.yaml — enter builder from library and return"
properties:
  junitId: variation.mobile.journeys_plans_list_screen_open.b
  junitClassname: variation.mobile.plans
  sourceIdentity: journeys/plans/list_screen_open.yaml
tags: [variation, plans, by-source]
---
- runFlow:
    file: ../../../../reusable/open_own_profile.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- tapOn: { id: "my-training-plans" }
- tapOn: { id: "training-plans-list-create-trigger" }
- assertVisible: { id: "builder-strategy-composer" }
- tapOn: { id: "builder-edit-plan" }
- assertVisible: { id: "builder-plan-name-input" }
- back
- assertVisible: { id: "builder-strategy-composer" }
- back
- assertVisible: { id: "training-plans-list-create-trigger" }
