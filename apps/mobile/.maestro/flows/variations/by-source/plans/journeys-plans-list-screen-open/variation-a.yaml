appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/plans/list_screen_open.yaml — inspect owned training-plan library"
properties:
  junitId: variation.mobile.journeys_plans_list_screen_open.a
  junitClassname: variation.mobile.plans
  sourceIdentity: journeys/plans/list_screen_open.yaml
tags: [variation, plans, by-source]
---
- runFlow:
    file: ../../../../reusable/open_own_profile.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- tapOn: { id: "my-training-plans" }
- assertVisible: { id: "training-plans-list-screen" }
- assertVisible: { id: "training-plans-list-create-trigger" }
- assertVisible: { id: "training-plans-list-item-${PLAN_TRAINING_PLAN_ID}" }
- tapOn: { id: "training-plans-list-item-${PLAN_TRAINING_PLAN_ID}" }
- assertVisible: "${PLAN_TRAINING_PLAN_NAME}"
- assertVisible: { id: "training-plan-schedule" }
