appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/plans/training_plan_schedule_from_discover.yaml — inspect anchored calendar day"
properties:
  junitId: variation.mobile.journeys_plans_training_plan_schedule_from_discover.b
  junitClassname: variation.mobile.plans
  sourceIdentity: journeys/plans/training_plan_schedule_from_discover.yaml
tags: [variation, plans, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: { file: ../../../../reusable/domain/details/open_calendar_day.yaml, env: { CALENDAR_DATE: "${PLAN_SELECTED_DATE}" } }
- assertVisible: { id: "calendar-day-row-${PLAN_SELECTED_DATE}" }
- assertVisible: { id: "calendar-day-planned-activity-row-${PLAN_SCHEDULED_EVENT_ID}" }
- tapOn: { id: "calendar-day-planned-activity-row-${PLAN_SCHEDULED_EVENT_ID}" }
- assertVisible: { id: "event-detail-activity-plan-card" }
- tapOn: { id: "event-detail-activity-plan-card" }
- assertVisible: { id: "activity-plan-content-preview" }
- back
- assertVisible: { id: "event-detail-options-trigger" }
