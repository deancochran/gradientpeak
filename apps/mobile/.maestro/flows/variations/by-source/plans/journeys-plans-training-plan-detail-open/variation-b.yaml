appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/plans/training_plan_detail_open.yaml — open owned plan card and return"
properties:
  junitId: variation.mobile.journeys_plans_training_plan_detail_open.b
  junitClassname: variation.mobile.plans
  sourceIdentity: journeys/plans/training_plan_detail_open.yaml
tags: [variation, plans, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: ../../../../reusable/open_plan_tab.yaml
- runFlow: { file: ../../../../reusable/domain/plans/open_training_plan_card.yaml, env: { TRAINING_PLAN_ID: "${PLAN_TRAINING_PLAN_ID}" } }
- assertVisible: "${PLAN_TRAINING_PLAN_NAME}"
- back
- assertVisible: { id: "plan-training-plan-card-${PLAN_TRAINING_PLAN_ID}" }
- tapOn: { id: "plan-training-plan-card-${PLAN_TRAINING_PLAN_ID}" }
- assertVisible: { id: "training-plan-options-trigger" }
