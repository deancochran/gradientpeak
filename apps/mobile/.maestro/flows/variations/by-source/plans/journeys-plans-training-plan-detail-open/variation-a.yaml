appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/plans/training_plan_detail_open.yaml — search and inspect exact training plan"
properties:
  junitId: variation.mobile.journeys_plans_training_plan_detail_open.a
  junitClassname: variation.mobile.plans
  sourceIdentity: journeys/plans/training_plan_detail_open.yaml
tags: [variation, plans, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: ../../../../reusable/open_discover_tab.yaml
- runFlow: { file: ../../../../reusable/domain/discover/choose_scope.yaml, env: { DISCOVER_SCOPE: trainingPlans } }
- runFlow: { file: ../../../../reusable/domain/discover/search_and_open_text_result.yaml, env: { DISCOVER_QUERY: "${PLAN_TRAINING_PLAN_NAME}", DETAIL_READY_ID: training-plan-schedule } }
- tapOn: { id: "training-plan-options-trigger" }
- assertVisible: { id: "training-plan-options-schedule" }
- assertVisible: { id: "training-plan-options-duplicate" }
