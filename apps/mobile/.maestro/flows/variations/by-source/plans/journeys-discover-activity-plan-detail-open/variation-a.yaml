appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/discover/activity_plan_detail_open.yaml — search exact plan and inspect structure"
properties:
  junitId: variation.mobile.journeys_discover_activity_plan_detail_open.a
  junitClassname: variation.mobile.plans
  sourceIdentity: journeys/discover/activity_plan_detail_open.yaml
tags: [variation, plans, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: ../../../../reusable/open_discover_tab.yaml
- runFlow: { file: ../../../../reusable/domain/discover/choose_scope.yaml, env: { DISCOVER_SCOPE: activityPlans } }
- runFlow: { file: ../../../../reusable/domain/discover/search_and_open_text_result.yaml, env: { DISCOVER_QUERY: "${PLAN_ACTIVITY_PLAN_NAME}", DETAIL_READY_ID: activity-plan-content-preview } }
- assertVisible: { id: "activity-plan-estimates" }
- tapOn: { id: "activity-plan-options-trigger" }
- assertVisible: { id: "activity-plan-options-start" }
- assertVisible: { id: "activity-plan-options-duplicate" }
