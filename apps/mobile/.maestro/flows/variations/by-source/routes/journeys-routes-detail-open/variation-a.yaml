appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/routes/detail_open.yaml — open exact owned route from library"
properties:
  junitId: variation.mobile.journeys_routes_detail_open.a
  junitClassname: variation.mobile.routes
  sourceIdentity: journeys/routes/detail_open.yaml
tags: [variation, routes, by-source]
---
- runFlow:
    file: ../../../../reusable/open_own_profile.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- tapOn: { id: "my-routes" }
- scrollUntilVisible: { element: { id: "routes-list-item-${STANDARD_ROUTE_ID}" }, direction: DOWN }
- tapOn: { id: "routes-list-item-${STANDARD_ROUTE_ID}" }
- assertVisible: "${STANDARD_ROUTE_NAME}"
- assertVisible: { id: "route-card-${STANDARD_ROUTE_ID}" }
- assertVisible: { id: "route-card-map-preview-${STANDARD_ROUTE_ID}" }
- assertVisible: { id: "route-card-like-button-${STANDARD_ROUTE_ID}" }
