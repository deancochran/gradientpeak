appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/routes/detail_open.yaml — reopen owned route and inspect elevation"
properties:
  junitId: variation.mobile.journeys_routes_detail_open.b
  junitClassname: variation.mobile.routes
  sourceIdentity: journeys/routes/detail_open.yaml
tags: [variation, routes, by-source, intentional-red]
---
- runFlow:
    file: ../../../../reusable/open_own_profile.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- tapOn: { id: "my-routes" }
- tapOn: { id: "routes-list-item-${STANDARD_ROUTE_ID}" }
- assertVisible: { id: "route-card-${STANDARD_ROUTE_ID}" }
- back
- assertVisible: { id: "routes-list-item-${STANDARD_ROUTE_ID}" }
- tapOn: { id: "routes-list-item-${STANDARD_ROUTE_ID}" }
- scrollUntilVisible: { element: { id: "route-detail-elevation" }, direction: DOWN }
- assertVisible: { id: "route-detail-metadata" }
