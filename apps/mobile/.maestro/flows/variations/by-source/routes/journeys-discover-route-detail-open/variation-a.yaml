appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/discover/route_detail_open.yaml — search exact route and inspect map metadata"
properties:
  junitId: variation.mobile.journeys_discover_route_detail_open.a
  junitClassname: variation.mobile.routes
  sourceIdentity: journeys/discover/route_detail_open.yaml
tags: [variation, routes, by-source, intentional-red]
---
- runFlow: ../../../../reusable/authenticated_home.yaml
- runFlow: ../../../../reusable/open_discover_tab.yaml
- tapOn: { id: "discover-scope-routes" }
- tapOn: { id: "discover-search-input" }
- inputText: "${STANDARD_ROUTE_NAME}"
- hideKeyboard
- tapOn: "${STANDARD_ROUTE_NAME}"
- assertVisible: { id: "route-card-${STANDARD_ROUTE_ID}" }
- assertVisible: { id: "route-card-map-preview-${STANDARD_ROUTE_ID}" }
- scrollUntilVisible: { element: { id: "route-detail-elevation" }, direction: DOWN }
- assertVisible: { id: "route-detail-metadata" }
