appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/discover/route_detail_open.yaml — like, return, and reopen search result"
properties:
  junitId: variation.mobile.journeys_discover_route_detail_open.b
  junitClassname: variation.mobile.routes
  sourceIdentity: journeys/discover/route_detail_open.yaml
tags: [variation, routes, by-source]
---
- runFlow: ../../../../reusable/authenticated_home.yaml
- runFlow: ../../../../reusable/open_discover_tab.yaml
- tapOn: { id: "discover-scope-routes" }
- tapOn: { id: "discover-search-input" }
- inputText: "${STANDARD_ROUTE_NAME}"
- hideKeyboard
- tapOn: "${STANDARD_ROUTE_NAME}"
- tapOn: { id: "route-card-like-button-${STANDARD_ROUTE_ID}" }
- assertVisible: { id: "route-card-like-button-${STANDARD_ROUTE_ID}" }
- back
- assertVisible: "${STANDARD_ROUTE_NAME}"
- tapOn: "${STANDARD_ROUTE_NAME}"
- assertVisible: { id: "route-card-map-preview-${STANDARD_ROUTE_ID}" }
