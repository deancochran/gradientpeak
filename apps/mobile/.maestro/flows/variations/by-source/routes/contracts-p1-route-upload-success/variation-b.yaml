appId: ${MAESTRO_APP_ID}
name: "Variation B — contracts/p1/route_upload_success.yaml — inspect uploaded route detail"
properties:
  junitId: variation.mobile.contracts_p1_route_upload_success.b
  junitClassname: variation.mobile.routes
  sourceIdentity: contracts/p1/route_upload_success.yaml
tags: [variation, routes, by-source, document-picker, intentional-red]
---
- runFlow:
    file: ../../../../reusable/authenticated_home.yaml
    env: { STANDARD_USER_EMAIL: "${ROUTE_UPLOAD_USER_EMAIL_B}", STANDARD_USER_PASS: "${ROUTE_UPLOAD_USER_PASS_B}" }
- openLink: "${MAESTRO_APP_SCHEME}://route-upload"
- tapOn: { id: "route-upload-file-input" }
- extendedWaitUntil: { visible: "${ROUTE_UPLOAD_FILE_DISPLAY_NAME_B}", timeout: 10000 }
- tapOn: "${ROUTE_UPLOAD_FILE_DISPLAY_NAME_B}"
- tapOn: { id: "route-upload-name-input" }
- inputText: "${ROUTE_UPLOAD_NAME_B}"
- hideKeyboard
- tapOn: { id: "route-upload-submit-button" }
- extendedWaitUntil: { visible: "${ROUTE_UPLOAD_NAME_B}", timeout: 30000 }
- assertVisible: { id: "route-detail-map" }
- scrollUntilVisible: { element: { id: "route-detail-elevation" }, direction: DOWN }
- assertVisible: { id: "route-detail-metadata" }
