appId: ${MAESTRO_APP_ID}
name: "Variation A — contracts/p1/route_upload_success.yaml — upload deterministic route file"
properties:
  junitId: variation.mobile.contracts_p1_route_upload_success.a
  junitClassname: variation.mobile.routes
  sourceIdentity: contracts/p1/route_upload_success.yaml
tags: [variation, routes, by-source, document-picker]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${ROUTE_UPLOAD_USER_EMAIL_A}", STANDARD_USER_PASS: "${ROUTE_UPLOAD_USER_PASS_A}" } }
- runFlow: ../../../../reusable/domain/uploads/open_route_upload.yaml
- runFlow: { file: ../../../../reusable/domain/uploads/select_route_fixture.yaml, env: { ROUTE_FILE_DISPLAY_NAME: "${ROUTE_UPLOAD_FILE_DISPLAY_NAME_A}" } }
- tapOn: { id: "route-upload-name-input" }
- eraseText
- inputText: "${ROUTE_UPLOAD_NAME_A}"
- hideKeyboard
- tapOn: { id: "route-upload-submit-button" }
- extendedWaitUntil: { visible: { id: "route-detail-screen" }, timeout: 30000 }
- assertVisible: "${ROUTE_UPLOAD_NAME_A}"
