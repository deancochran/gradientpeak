appId: ${MAESTRO_APP_ID}
name: "Variation A — contracts/p1/route_delete_persists.yaml — cancel route deletion"
properties:
  junitId: variation.mobile.contracts_p1_route_delete_persists.a
  junitClassname: variation.mobile.routes
  sourceIdentity: contracts/p1/route_delete_persists.yaml
tags: [variation, routes, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: { file: ../../../../reusable/domain/details/open_route.yaml, env: { ROUTE_ID: "${DELETE_ROUTE_ID_A}" } }
- runFlow: ../../../../reusable/domain/destructive/cancel_route_delete.yaml
- assertVisible: { id: "route-card-${DELETE_ROUTE_ID_A}" }
- assertVisible: "${DELETE_ROUTE_NAME_A}"
