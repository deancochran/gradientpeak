appId: ${MAESTRO_APP_ID}
name: "Variation B — contracts/p1/route_delete_persists.yaml — confirm deletion and reject detail"
properties:
  junitId: variation.mobile.contracts_p1_route_delete_persists.b
  junitClassname: variation.mobile.routes
  sourceIdentity: contracts/p1/route_delete_persists.yaml
tags: [variation, routes, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: { file: ../../../../reusable/domain/details/open_route.yaml, env: { ROUTE_ID: "${DELETE_ROUTE_ID_B}" } }
- runFlow: ../../../../reusable/domain/destructive/confirm_route_delete.yaml
- openLink: "${MAESTRO_APP_SCHEME}://route-detail?id=${DELETE_ROUTE_ID_B}"
- assertVisible: { id: "route-detail-not-found" }
