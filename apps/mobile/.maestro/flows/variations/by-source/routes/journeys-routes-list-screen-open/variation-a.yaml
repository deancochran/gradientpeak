appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/routes/list_screen_open.yaml — browse exact route card and return"
properties:
  junitId: variation.mobile.journeys_routes_list_screen_open.a
  junitClassname: variation.mobile.routes
  sourceIdentity: journeys/routes/list_screen_open.yaml
tags: [variation, routes, by-source]
---
- runFlow:
    file: ../../../../reusable/open_own_profile.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- tapOn: { id: "my-routes" }
- assertVisible: { id: "routes-list-screen" }
- assertVisible: { id: "routes-list-content" }
- assertVisible: { id: "routes-list-item-${STANDARD_ROUTE_ID}" }
- tapOn: { id: "routes-list-item-${STANDARD_ROUTE_ID}" }
- assertVisible: { id: "route-card-${STANDARD_ROUTE_ID}" }
- back
- assertVisible: { id: "routes-list-upload-trigger" }
