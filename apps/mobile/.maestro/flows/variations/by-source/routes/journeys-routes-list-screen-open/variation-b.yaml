appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/routes/list_screen_open.yaml — enter upload from library and return"
properties:
  junitId: variation.mobile.journeys_routes_list_screen_open.b
  junitClassname: variation.mobile.routes
  sourceIdentity: journeys/routes/list_screen_open.yaml
tags: [variation, routes, by-source]
---
- runFlow:
    file: ../../../../reusable/open_own_profile.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- tapOn: { id: "my-routes" }
- tapOn: { id: "routes-list-upload-trigger" }
- assertVisible: { id: "route-upload-screen" }
- assertVisible: { id: "route-upload-pick-file-button" }
- assertVisible: { id: "route-upload-name-input" }
- assertVisible: { id: "route-upload-submit-button" }
- back
- assertVisible: { id: "routes-list-item-${STANDARD_ROUTE_ID}" }
