appId: ${MAESTRO_APP_ID}
name: "Variation A — contracts/p1/route_edit_persists.yaml — cancel unsaved route rename"
properties:
  junitId: variation.mobile.contracts_p1_route_edit_persists.a
  junitClassname: variation.mobile.routes
  sourceIdentity: contracts/p1/route_edit_persists.yaml
tags: [variation, routes, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: { file: ../../../../reusable/domain/details/open_route.yaml, env: { ROUTE_ID: "${EDIT_ROUTE_ID_A}" } }
- runFlow: ../../../../reusable/domain/forms/open_route_name_editor.yaml
- inputText: "Unsaved route edit variation"
- hideKeyboard
- back
- assertVisible: "${EDIT_ROUTE_NAME_A}"
- assertNotVisible: "Unsaved route edit variation"
