appId: ${MAESTRO_APP_ID}
name: "Variation B — contracts/p1/route_edit_persists.yaml — save exact route rename and reopen"
properties:
  junitId: variation.mobile.contracts_p1_route_edit_persists.b
  junitClassname: variation.mobile.routes
  sourceIdentity: contracts/p1/route_edit_persists.yaml
tags: [variation, routes, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: { file: ../../../../reusable/domain/details/open_route.yaml, env: { ROUTE_ID: "${EDIT_ROUTE_ID_B}" } }
- runFlow: ../../../../reusable/domain/forms/open_route_name_editor.yaml
- inputText: "${ROUTE_EDITED_NAME_B}"
- hideKeyboard
- tapOn: { id: "route-edit-submit-button" }
- assertVisible: "${ROUTE_EDITED_NAME_B}"
- runFlow: { file: ../../../../reusable/domain/details/open_route.yaml, env: { ROUTE_ID: "${EDIT_ROUTE_ID_B}" } }
- assertVisible: "${ROUTE_EDITED_NAME_B}"
