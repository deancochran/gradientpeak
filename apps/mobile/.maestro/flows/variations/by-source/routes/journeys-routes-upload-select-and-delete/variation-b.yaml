appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/routes/upload_select_and_delete.yaml — cancel then confirm disposable route deletion"
properties:
  junitId: variation.mobile.journeys_routes_upload_select_and_delete.b
  junitClassname: variation.mobile.routes
  sourceIdentity: journeys/routes/upload_select_and_delete.yaml
tags: [variation, routes, by-source]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${ROUTE_DELETE_USER_EMAIL_B}", STANDARD_USER_PASS: "${ROUTE_DELETE_USER_PASS_B}" } }
- runFlow: { file: ../../../../reusable/domain/details/open_route.yaml, env: { ROUTE_ID: "${ROUTE_SELECT_DELETE_ID_B}" } }
- assertVisible: "${ROUTE_SELECT_DELETE_NAME_B}"
- runFlow: ../../../../reusable/domain/destructive/cancel_route_delete.yaml
- assertVisible: "${ROUTE_SELECT_DELETE_NAME_B}"
- assertVisible: { id: "route-card-map-preview-${ROUTE_SELECT_DELETE_ID_B}" }
- runFlow: ../../../../reusable/domain/destructive/confirm_route_delete.yaml
- extendedWaitUntil: { visible: { id: "routes-list-screen" }, timeout: 30000 }
- assertNotVisible: { id: "route-card-${ROUTE_SELECT_DELETE_ID_B}" }
