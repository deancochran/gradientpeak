appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/routes/upload_select_and_delete.yaml — upload deterministic GPX and inspect processed route"
properties:
  junitId: variation.mobile.journeys_routes_upload_select_and_delete.a
  junitClassname: variation.mobile.routes
  sourceIdentity: journeys/routes/upload_select_and_delete.yaml
tags: [variation, routes, by-source, document-picker]
---
- runFlow: { file: ../../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${ROUTE_SELECT_USER_EMAIL_A}", STANDARD_USER_PASS: "${ROUTE_SELECT_USER_PASS_A}" } }
- runFlow: ../../../../reusable/domain/uploads/open_route_upload.yaml
- runFlow: { file: ../../../../reusable/domain/uploads/select_route_fixture.yaml, env: { ROUTE_FILE_DISPLAY_NAME: "${ROUTE_SELECT_FILE_DISPLAY_NAME_A}" } }
- assertVisible: "${ROUTE_SELECT_FILE_DISPLAY_NAME_A}"
- tapOn: { id: "route-upload-name-input" }
- inputText: "${ROUTE_SELECT_UPLOAD_NAME_A}"
- hideKeyboard
- tapOn: { id: "route-upload-submit-button" }
- extendedWaitUntil: { visible: { id: "route-detail-screen" }, timeout: 60000 }
- assertVisible: "${ROUTE_SELECT_UPLOAD_NAME_A}"
- assertVisible: "Distance"
- assertVisible: "Climb"
