appId: ${MAESTRO_APP_ID}
name: "Variation B — journeys/routes/upload_entry_open.yaml — edit route name draft and cancel upload"
properties:
  junitId: variation.mobile.journeys_routes_upload_entry_open.b
  junitClassname: variation.mobile.routes
  sourceIdentity: journeys/routes/upload_entry_open.yaml
tags: [variation, routes, by-source]
---
- runFlow: ../../../../reusable/authenticated_home.yaml
- runFlow: ../../../../reusable/domain/uploads/open_route_upload.yaml
- tapOn: { id: "route-upload-name-input" }
- inputText: "Unsaved upload entry variation"
- hideKeyboard
- assertVisible: { id: "route-upload-pick-file-button" }
- assertVisible: { id: "route-upload-submit-button" }
- back
- assertVisible: { id: "routes-list-screen" }
- assertNotVisible: "Unsaved upload entry variation"
