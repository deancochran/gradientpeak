appId: ${MAESTRO_APP_ID}
name: "Variation A — journeys/routes/upload_entry_open.yaml — inspect upload form from route library"
properties:
  junitId: variation.mobile.journeys_routes_upload_entry_open.a
  junitClassname: variation.mobile.routes
  sourceIdentity: journeys/routes/upload_entry_open.yaml
tags: [variation, routes, by-source]
---
- runFlow:
    file: ../../../../reusable/open_own_profile.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- tapOn: { id: "my-routes" }
- tapOn: { id: "routes-list-upload-trigger" }
- assertVisible: { id: "route-upload-screen" }
- assertVisible: "GPX or TCX File *"
- assertVisible: "Route Name *"
- assertVisible: { id: "route-upload-file-input" }
- assertVisible: { id: "route-upload-name-input" }
- assertVisible: { id: "route-upload-submit-button" }
