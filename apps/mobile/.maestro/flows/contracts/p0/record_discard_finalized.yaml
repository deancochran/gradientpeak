appId: ${MAESTRO_APP_ID}
name: P0 finalized recording can be discarded
properties:
  junitId: p0.record.discard_finalized
  junitClassname: contract.mobile.p0
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- runFlow: ../../reusable/open_record_tab.yaml
- tapOn:
    id: "recording-start-button"
- extendedWaitUntil:
    visible:
      id: "recording-finish-button"
    timeout: 10000
- tapOn:
    id: "recording-finish-button"
- extendedWaitUntil:
    visible:
      id: "recording-review-summary"
    timeout: 15000
- tapOn: "Delete Activity"
- tapOn: "Delete"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000
- runFlow:
    file: ../../reusable/preserve_state_relaunch.yaml
    env:
      EXPECTED_BOUNDARY_ID: "home-screen"
- tapOn:
    id: "tab-button-record"
- extendedWaitUntil:
    visible:
      id: "record-screen-ready"
    timeout: 10000
- assertNotVisible:
    id: "recording-review-summary"
