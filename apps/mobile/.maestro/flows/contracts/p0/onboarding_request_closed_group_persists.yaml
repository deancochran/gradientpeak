appId: ${MAESTRO_APP_ID}
name: P0 onboarding closed-group request persists
properties:
  junitId: p0.onboarding.request_closed_group
  junitClassname: contract.mobile.p0
---
- runFlow: ../../reusable/ensure_signed_out.yaml
- tapOn:
    id: "email-input"
- inputText: "${ONBOARDING_CLOSED_GROUP_USER_EMAIL}"
- tapOn:
    id: "password-input"
- inputText: "${ONBOARDING_CLOSED_GROUP_USER_PASS}"
- hideKeyboard
- tapOn:
    id: "sign-in-button"
- extendedWaitUntil:
    visible:
      id: "onboarding-screen"
    timeout: 20000
- assertVisible:
    id: "groups-people-step"
- tapOn:
    id: "onboarding-group-${CLOSED_GROUP_ID}"
- tapOn:
    id: "onboarding-finish-button"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- openLink: "${MAESTRO_APP_SCHEME}://group-detail?groupId=${CLOSED_GROUP_ID}"
- assertVisible: "Requested"
