appId: ${MAESTRO_APP_ID}
name: P0 failed recording submission retries from local artifact
properties:
  junitId: p0.record.submission_retry
  junitClassname: contract.mobile.p0
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- runFlow: ../../reusable/open_record_tab.yaml
- tapOn:
    id: "recording-start-button"
- extendedWaitUntil:
    visible:
      id: "recording-finish-button"
    timeout: 10000
- tapOn:
    id: "recording-finish-button"
- extendedWaitUntil:
    visible:
      id: "recording-review-summary"
    timeout: 15000
- setAirplaneMode: enabled
- tapOn: "Save Activity"
- extendedWaitUntil:
    visible: "Retry upload"
    timeout: 30000
- assertVisible:
    id: "activity-submit-status"
- setAirplaneMode: disabled
- tapOn: "Retry upload"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
