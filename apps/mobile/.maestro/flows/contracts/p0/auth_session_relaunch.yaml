appId: ${MAESTRO_APP_ID}
name: P0 authenticated session survives relaunch
properties:
  junitId: p0.auth.session_relaunch
  junitClassname: contract.mobile.p0
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- assertVisible:
    id: "home-screen"
- runFlow:
    file: ../../reusable/preserve_state_relaunch.yaml
    env:
      EXPECTED_BOUNDARY_ID: "home-screen"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000
- assertNotVisible:
    id: "sign-in-screen"
