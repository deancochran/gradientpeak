appId: ${MAESTRO_APP_ID}
name: P0 protected entry restores after sign-in
properties:
  junitId: p0.auth.protected_entry_sign_in
  junitClassname: contract.mobile.p0
---
- runFlow: ../../reusable/ensure_signed_out.yaml
- openLink: "${MAESTRO_APP_SCHEME}://integrations"
- assertVisible:
    id: "sign-in-screen"
- tapOn:
    id: "email-input"
- inputText: "${STANDARD_USER_EMAIL}"
- tapOn:
    id: "password-input"
- inputText: "${STANDARD_USER_PASS}"
- hideKeyboard
- tapOn:
    id: "sign-in-button"
- extendedWaitUntil:
    visible:
      id: "integrations-screen"
    timeout: 20000
