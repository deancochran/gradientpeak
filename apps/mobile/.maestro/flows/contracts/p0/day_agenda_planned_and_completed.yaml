appId: ${MAESTRO_APP_ID}
name: P0 arbitrary selected day shows planned and completed agenda
properties:
  junitId: p0.planning.day_agenda
  junitClassname: contract.mobile.p0
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- openLink: "${MAESTRO_APP_SCHEME}://calendar-day?date=${AGENDA_DATE}"
- extendedWaitUntil:
    visible: "Day agenda"
    timeout: 15000
- assertVisible:
    id: "calendar-day-planned-summary"
- assertVisible:
    id: "calendar-day-planned-activity-row-${AGENDA_PLANNED_EVENT_ID}"
- assertVisible:
    id: "calendar-day-activity-row-${AGENDA_COMPLETED_ACTIVITY_ID}"
- assertNotVisible: "Planning ledger"
