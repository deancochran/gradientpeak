appId: ${MAESTRO_APP_ID}
name: P0 event route assignment persists after reopen
properties:
  junitId: p0.calendar.event_route_attach_reopen
  junitClassname: contract.mobile.p0
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- openLink: "${MAESTRO_APP_SCHEME}://event-detail?id=${ROUTE_ASSIGNMENT_EVENT_ID}"
- extendedWaitUntil:
    visible:
      id: "event-detail-options-trigger"
    timeout: 15000
- tapOn:
    id: "event-detail-options-trigger"
- tapOn:
    id: "event-detail-options-edit"
- extendedWaitUntil:
    visible:
      id: "event-detail-update-choose-route-card"
    timeout: 10000
- tapOn:
    id: "event-detail-update-choose-route-card"
- extendedWaitUntil:
    visible: "Choose Route"
    timeout: 10000
- tapOn: "Search routes"
- inputText: "${EVENT_ROUTE_NAME}"
- hideKeyboard
- tapOn:
    id: "resource-picker-result-${EVENT_ROUTE_ID}"
- assertVisible:
    id: "event-detail-update-route-row"
- tapOn:
    id: "event-detail-update-save-button"
- extendedWaitUntil:
    visible: "${EVENT_ROUTE_NAME}"
    timeout: 15000
- back
- openLink: "${MAESTRO_APP_SCHEME}://event-detail?id=${ROUTE_ASSIGNMENT_EVENT_ID}"
- extendedWaitUntil:
    visible: "${EVENT_ROUTE_NAME}"
    timeout: 15000
