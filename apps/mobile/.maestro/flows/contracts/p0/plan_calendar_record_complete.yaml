appId: ${MAESTRO_APP_ID}
name: P0 authored plan schedules to calendar and records to completion
properties:
  junitId: p0.plan.calendar_record_complete
  junitClassname: contract.mobile.p0
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- openLink: "${MAESTRO_APP_SCHEME}://event-detail?id=${PLANNED_EVENT_ID}"
- extendedWaitUntil:
    visible:
      id: "event-detail-activity-plan-card"
    timeout: 15000
- tapOn:
    id: "event-detail-activity-plan-card"
- extendedWaitUntil:
    visible:
      id: "activity-plan-options-trigger"
    timeout: 10000
- tapOn:
    id: "activity-plan-options-trigger"
- tapOn:
    id: "activity-plan-options-start"
- extendedWaitUntil:
    visible:
      id: "record-screen-ready"
    timeout: 10000
- assertVisible:
    id: "recording-setup-remove-plan"
- tapOn:
    id: "recording-start-button"
- extendedWaitUntil:
    visible:
      id: "activity-interval-insight-card"
    timeout: 10000
- tapOn:
    id: "recording-finish-button"
- extendedWaitUntil:
    visible:
      id: "recording-review-summary"
    timeout: 15000
- tapOn: "Save Activity"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- tapOn:
    id: "tab-button-profile"
- scrollUntilVisible:
    element:
      id: "my-activities"
    direction: DOWN
- tapOn:
    id: "my-activities"
- extendedWaitUntil:
    visible:
      id: "activities-list-item-.*"
    timeout: 15000
- tapOn:
    id: "activities-list-item-.*"
- assertVisible:
    id: "activity-detail-open-activity-plan"
