appId: ${MAESTRO_APP_ID}
name: P0 completed activity reopens with attached route
properties:
  junitId: p0.activity.route_persistence
  junitClassname: contract.mobile.p0
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- openLink: "${MAESTRO_APP_SCHEME}://activity-detail?id=${ROUTE_ACTIVITY_ID}"
- extendedWaitUntil:
    visible:
      id: "activity-detail-screen"
    timeout: 15000
- assertVisible:
    id: "activity-detail-linked-route-${RECORDING_ROUTE_ID}"
- runFlow:
    file: ../../reusable/preserve_state_relaunch.yaml
    env:
      EXPECTED_BOUNDARY_ID: "home-screen"
- openLink: "${MAESTRO_APP_SCHEME}://activity-detail?id=${ROUTE_ACTIVITY_ID}"
- assertVisible:
    id: "activity-detail-linked-route-${RECORDING_ROUTE_ID}"
