appId: ${MAESTRO_APP_ID}
name: P0 sign-out survives relaunch
properties:
  junitId: p0.auth.sign_out_relaunch
  junitClassname: contract.mobile.p0
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- tapOn:
    id: "tab-button-profile"
- extendedWaitUntil:
    visible:
      id: "profile-tab-screen"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "profile-tab-sign-out"
    direction: DOWN
- tapOn:
    id: "profile-tab-sign-out"
- extendedWaitUntil:
    visible:
      id: "sign-in-screen"
    timeout: 10000
- runFlow:
    file: ../../reusable/preserve_state_relaunch.yaml
    env:
      EXPECTED_BOUNDARY_ID: "sign-in-screen"
- assertVisible:
    id: "sign-in-screen"
- assertNotVisible:
    id: "tab-button-home"
