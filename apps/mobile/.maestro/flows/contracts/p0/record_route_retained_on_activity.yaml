appId: ${MAESTRO_APP_ID}
name: P0 attached route reaches recording review and completed activity
properties:
  junitId: p0.record.route_retained_on_activity
  junitClassname: contract.mobile.p0
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- runFlow: ../../reusable/open_record_tab.yaml
- tapOn:
    id: "recording-setup-action-route"
- extendedWaitUntil:
    visible:
      id: "discover-screen"
    timeout: 10000
- tapOn:
    id: "discover-search-input"
- inputText: "${RECORDING_ROUTE_NAME}"
- hideKeyboard
- tapOn: "${RECORDING_ROUTE_NAME}"
- extendedWaitUntil:
    visible:
      id: "route-preview-attach-button"
    timeout: 10000
- tapOn:
    id: "route-preview-attach-button"
- assertVisible:
    id: "recording-setup-remove-route"
- tapOn:
    id: "recording-start-button"
- extendedWaitUntil:
    visible:
      id: "route-progress-insight-card"
    timeout: 10000
- tapOn:
    id: "recording-finish-button"
- extendedWaitUntil:
    visible:
      id: "recording-review-route-${RECORDING_ROUTE_ID}"
    timeout: 15000
- tapOn: "Save Activity"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- tapOn:
    id: "tab-button-profile"
- scrollUntilVisible:
    element:
      id: "my-activities"
    direction: DOWN
- tapOn:
    id: "my-activities"
- extendedWaitUntil:
    visible:
      id: "activities-list-item-.*"
    timeout: 15000
- tapOn:
    id: "activities-list-item-.*"
- assertVisible:
    id: "activity-detail-linked-route-${RECORDING_ROUTE_ID}"
