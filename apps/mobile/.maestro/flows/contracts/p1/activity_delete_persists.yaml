appId: ${MAESTRO_APP_ID}
name: P1 activity deletion persists
properties:
  junitId: p1.activity.delete_persists
  junitClassname: contract.mobile.p1
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- openLink: "${MAESTRO_APP_SCHEME}://activity-detail?id=${DELETE_ACTIVITY_ID}"
- extendedWaitUntil:
    visible:
      id: "activity-detail-options-trigger"
    timeout: 15000
- tapOn:
    id: "activity-detail-options-trigger"
- tapOn:
    id: "activity-detail-options-delete"
- assertVisible:
    id: "activity-detail-delete-modal"
- tapOn:
    id: "activity-detail-delete-confirm"
- extendedWaitUntil:
    notVisible:
      id: "activity-detail-screen"
    timeout: 15000
- openLink: "${MAESTRO_APP_SCHEME}://activity-detail?id=${DELETE_ACTIVITY_ID}"
- extendedWaitUntil:
    visible: "Activity not found"
    timeout: 15000
