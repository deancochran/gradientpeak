appId: ${MAESTRO_APP_ID}
name: P1 route upload creates a reusable route
properties:
  junitId: p1.route.upload_success
  junitClassname: contract.mobile.p1
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- openLink: "${MAESTRO_APP_SCHEME}://route-upload"
- extendedWaitUntil:
    visible:
      id: "route-upload-screen"
    timeout: 10000
- tapOn:
    id: "route-upload-file-input"
- extendedWaitUntil:
    visible: "${ROUTE_FILE_DISPLAY_NAME}"
    timeout: 10000
- tapOn: "${ROUTE_FILE_DISPLAY_NAME}"
- tapOn:
    id: "route-upload-name-input"
- eraseText
- inputText: "${ROUTE_UPLOAD_NAME}"
- hideKeyboard
- tapOn:
    id: "route-upload-submit-button"
- extendedWaitUntil:
    visible:
      id: "route-detail-screen"
    timeout: 30000
- assertVisible: "${ROUTE_UPLOAD_NAME}"
