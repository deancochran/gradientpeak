appId: ${MAESTRO_APP_ID}
name: P1 local provider sync imports activity history
properties:
  junitId: p1.provider.local_sync
  junitClassname: contract.mobile.p1
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- openLink: "${MAESTRO_APP_SCHEME}://integrations"
- extendedWaitUntil:
    visible:
      id: "integration-sync-now-${LOCAL_PROVIDER_ID}"
    timeout: 15000
- tapOn:
    id: "integration-sync-now-${LOCAL_PROVIDER_ID}"
- extendedWaitUntil:
    visible:
      id: "integration-view-import-${LOCAL_PROVIDER_ID}"
    timeout: 30000
- tapOn:
    id: "integration-view-import-${LOCAL_PROVIDER_ID}"
- extendedWaitUntil:
    visible:
      id: "activities-list-item-${LOCAL_PROVIDER_IMPORTED_ACTIVITY_ID}"
    timeout: 15000
