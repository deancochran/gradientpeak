appId: ${MAESTRO_APP_ID}
name: P1 recurring event occurrence-only edit persists
properties:
  junitId: p1.calendar.recurrence_occurrence_only
  junitClassname: contract.mobile.p1
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- openLink: "${MAESTRO_APP_SCHEME}://event-detail?id=${RECURRING_SINGLE_EVENT_ID}"
- extendedWaitUntil:
    visible:
      id: "event-detail-options-trigger"
    timeout: 15000
- tapOn:
    id: "event-detail-options-trigger"
- tapOn:
    id: "event-detail-options-edit"
- tapOn:
    id: "event-detail-update-title-input"
- eraseText
- inputText: "Maestro occurrence only"
- hideKeyboard
- tapOn:
    id: "event-detail-update-save-button"
- assertVisible: "Recurring Event"
- tapOn:
    id: "event-detail-update-scope-single"
- extendedWaitUntil:
    visible: "Maestro occurrence only"
    timeout: 15000
- back
- openLink: "${MAESTRO_APP_SCHEME}://event-detail?id=${RECURRING_SINGLE_EVENT_ID}"
- assertVisible: "Maestro occurrence only"
