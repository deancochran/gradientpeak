appId: ${MAESTRO_APP_ID}
name: P1 recurring event entire-series deletion persists
properties:
  junitId: p1.calendar.recurrence_delete_series
  junitClassname: contract.mobile.p1
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- openLink: "${MAESTRO_APP_SCHEME}://event-detail?id=${RECURRING_SERIES_EVENT_ID}"
- extendedWaitUntil:
    visible:
      id: "event-detail-options-trigger"
    timeout: 15000
- tapOn:
    id: "event-detail-options-trigger"
- tapOn:
    id: "event-detail-options-delete"
- assertVisible:
    id: "event-detail-delete-scope-modal"
- tapOn:
    id: "event-detail-delete-scope-series"
- assertVisible:
    id: "event-detail-delete-confirm-modal"
- tapOn:
    id: "event-detail-delete-confirm"
- extendedWaitUntil:
    notVisible:
      id: "event-detail-options-trigger"
    timeout: 15000
- openLink: "${MAESTRO_APP_SCHEME}://event-detail?id=${RECURRING_SERIES_EVENT_ID}"
- assertVisible: "Event not found"
