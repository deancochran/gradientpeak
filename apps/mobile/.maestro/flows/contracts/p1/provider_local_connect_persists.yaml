appId: ${MAESTRO_APP_ID}
name: P1 local provider adapter connects and persists
properties:
  junitId: p1.provider.local_connect
  junitClassname: contract.mobile.p1
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- openLink: "${MAESTRO_APP_SCHEME}://integrations"
- extendedWaitUntil:
    visible:
      id: "integration-provider-${LOCAL_PROVIDER_ID}"
    timeout: 15000
- tapOn:
    id: "integration-connect-${LOCAL_PROVIDER_ID}"
- extendedWaitUntil:
    visible:
      id: "integration-sync-now-${LOCAL_PROVIDER_ID}"
    timeout: 20000
- runFlow:
    file: ../../reusable/preserve_state_relaunch.yaml
    env:
      EXPECTED_BOUNDARY_ID: "home-screen"
- openLink: "${MAESTRO_APP_SCHEME}://integrations"
- assertVisible:
    id: "integration-sync-now-${LOCAL_PROVIDER_ID}"
