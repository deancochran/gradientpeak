appId: ${MAESTRO_APP_ID}
name: P1 route edit persists after reopen
properties:
  junitId: p1.route.edit_persists
  junitClassname: contract.mobile.p1
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- openLink: "${MAESTRO_APP_SCHEME}://route-detail?id=${EDIT_ROUTE_ID}"
- extendedWaitUntil:
    visible:
      id: "route-detail-options-trigger"
    timeout: 15000
- tapOn:
    id: "route-detail-options-trigger"
- tapOn:
    id: "route-detail-options-edit"
- extendedWaitUntil:
    visible:
      id: "route-edit-name-input"
    timeout: 10000
- tapOn:
    id: "route-edit-name-input"
- eraseText
- inputText: "${ROUTE_EDITED_NAME}"
- hideKeyboard
- tapOn:
    id: "route-edit-submit-button"
- extendedWaitUntil:
    visible: "${ROUTE_EDITED_NAME}"
    timeout: 15000
- back
- openLink: "${MAESTRO_APP_SCHEME}://route-detail?id=${EDIT_ROUTE_ID}"
- assertVisible: "${ROUTE_EDITED_NAME}"
