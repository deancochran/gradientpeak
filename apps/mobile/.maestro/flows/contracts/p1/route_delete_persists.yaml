appId: ${MAESTRO_APP_ID}
name: P1 route deletion persists
properties:
  junitId: p1.route.delete_persists
  junitClassname: contract.mobile.p1
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- openLink: "${MAESTRO_APP_SCHEME}://route-detail?id=${DELETE_ROUTE_ID}"
- extendedWaitUntil:
    visible:
      id: "route-detail-options-trigger"
    timeout: 15000
- tapOn:
    id: "route-detail-options-trigger"
- tapOn:
    id: "route-detail-options-delete"
- assertVisible:
    id: "route-detail-delete-modal"
- tapOn:
    id: "route-detail-delete-confirm"
- extendedWaitUntil:
    notVisible:
      id: "route-detail-screen"
    timeout: 30000
- openLink: "${MAESTRO_APP_SCHEME}://route-detail?id=${DELETE_ROUTE_ID}"
- extendedWaitUntil:
    visible:
      id: "route-detail-not-found"
    timeout: 15000
