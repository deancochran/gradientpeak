appId: ${MAESTRO_APP_ID}
name: P1 local provider failed sync retries
properties:
  junitId: p1.provider.local_sync_retry
  junitClassname: contract.mobile.p1
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- openLink: "${MAESTRO_APP_SCHEME}://integrations"
- extendedWaitUntil:
    visible:
      id: "integration-sync-now-${LOCAL_PROVIDER_ID}"
    timeout: 15000
- tapOn:
    id: "integration-sync-now-${LOCAL_PROVIDER_ID}"
- extendedWaitUntil:
    visible:
      id: "integration-provider-sync-error-${LOCAL_PROVIDER_ID}"
    timeout: 20000
- tapOn:
    id: "integration-retry-sync-${LOCAL_PROVIDER_ID}"
- extendedWaitUntil:
    visible:
      id: "integration-view-import-${LOCAL_PROVIDER_ID}"
    timeout: 30000
