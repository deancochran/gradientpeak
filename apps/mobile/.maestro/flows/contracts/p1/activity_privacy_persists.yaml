appId: ${MAESTRO_APP_ID}
name: P1 activity privacy change persists
properties:
  junitId: p1.activity.privacy_persists
  junitClassname: contract.mobile.p1
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- openLink: "${MAESTRO_APP_SCHEME}://activity-detail?id=${PRIVACY_ACTIVITY_ID}"
- extendedWaitUntil:
    visible:
      id: "activity-detail-options-trigger"
    timeout: 15000
- tapOn:
    id: "activity-detail-options-trigger"
- tapOn:
    id: "activity-detail-options-visibility"
- assertVisible: "Change visibility"
- tapOn: "Public"
- back
- openLink: "${MAESTRO_APP_SCHEME}://activity-detail?id=${PRIVACY_ACTIVITY_ID}"
- extendedWaitUntil:
    visible:
      id: "activity-detail-summary"
    timeout: 15000
- tapOn:
    id: "activity-card-share-button-${PRIVACY_ACTIVITY_ID}"
- extendedWaitUntil:
    visible: "Share with"
    timeout: 10000
- assertNotVisible: "Not public"
