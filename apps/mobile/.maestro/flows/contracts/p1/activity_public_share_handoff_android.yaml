appId: ${MAESTRO_APP_ID}
name: P1 public activity hands off to Android share sheet
properties:
  junitId: p1.activity.share_handoff_android
  junitClassname: contract.mobile.p1
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- openLink: "${MAESTRO_APP_SCHEME}://activity-detail?id=${PUBLIC_ACTIVITY_ID}"
- extendedWaitUntil:
    visible:
      id: "activity-detail-summary"
    timeout: 15000
- tapOn:
    id: "activity-card-share-button-${PUBLIC_ACTIVITY_ID}"
- extendedWaitUntil:
    visible: "Share with"
    timeout: 10000
- assertNotVisible: "Not public"
