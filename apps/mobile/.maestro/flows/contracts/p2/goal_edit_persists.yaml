appId: ${MAESTRO_APP_ID}
name: P2 goal edit persists after reopen
properties:
  junitId: p2.goal.edit_persists
  junitClassname: contract.mobile.p2
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- openLink: "${MAESTRO_APP_SCHEME}://goal-detail?id=${EDIT_GOAL_ID}"
- extendedWaitUntil:
    visible:
      id: "goal-detail-options-trigger"
    timeout: 15000
- tapOn:
    id: "goal-detail-options-trigger"
- tapOn:
    id: "goal-detail-options-edit"
- extendedWaitUntil:
    visible:
      id: "goal-editor-title-input"
    timeout: 10000
- tapOn:
    id: "goal-editor-title-input"
- eraseText
- inputText: "${EDIT_GOAL_TITLE}"
- hideKeyboard
- tapOn: "Save"
- extendedWaitUntil:
    visible: "${EDIT_GOAL_TITLE}"
    timeout: 15000
- back
- openLink: "${MAESTRO_APP_SCHEME}://goal-detail?id=${EDIT_GOAL_ID}"
- assertVisible: "${EDIT_GOAL_TITLE}"
