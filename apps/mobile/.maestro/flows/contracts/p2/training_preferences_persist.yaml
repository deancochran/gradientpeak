appId: ${MAESTRO_APP_ID}
name: P2 training preferences persist after relaunch
properties:
  junitId: p2.preferences.persist
  junitClassname: contract.mobile.p2
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- openLink: "${MAESTRO_APP_SCHEME}://training-preferences"
- extendedWaitUntil:
    visible:
      id: "training-preferences-save-button"
    timeout: 15000
- tapOn:
    id: "training-preferences-tab-availability"
- tapOn:
    id: "preferences-hard-rest-day-monday"
- assertVisible: "Remove Monday hard rest day"
- tapOn:
    id: "training-preferences-save-button"
- extendedWaitUntil:
    notVisible:
      id: "training-preferences-save-button"
    timeout: 15000
- runFlow:
    file: ../../reusable/preserve_state_relaunch.yaml
    env:
      EXPECTED_BOUNDARY_ID: "home-screen"
- openLink: "${MAESTRO_APP_SCHEME}://training-preferences"
- tapOn:
    id: "training-preferences-tab-availability"
- assertVisible: "Remove Monday hard rest day"
