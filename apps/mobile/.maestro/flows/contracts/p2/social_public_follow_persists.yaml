appId: ${MAESTRO_APP_ID}
name: P2 public-profile follow persists
properties:
  junitId: p2.social.public_follow_persists
  junitClassname: contract.mobile.p2
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- openLink: "${MAESTRO_APP_SCHEME}://user/${PUBLIC_TARGET_USER_ID}"
- extendedWaitUntil:
    visible:
      id: "user-detail-follow-button"
    timeout: 15000
- tapOn:
    id: "user-detail-follow-button"
- extendedWaitUntil:
    visible:
      id: "user-detail-unfollow-button"
    timeout: 15000
- runFlow:
    file: ../../reusable/preserve_state_relaunch.yaml
    env:
      EXPECTED_BOUNDARY_ID: "home-screen"
- openLink: "${MAESTRO_APP_SCHEME}://user/${PUBLIC_TARGET_USER_ID}"
- assertVisible:
    id: "user-detail-unfollow-button"
