appId: ${MAESTRO_APP_ID}
name: P2 follow-request notification reject resolves
properties:
  junitId: p2.notification.follow_reject
  junitClassname: contract.mobile.p2
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- runFlow: ../../reusable/open_notifications_inbox.yaml
- extendedWaitUntil:
    visible:
      id: "notification-reject-${FOLLOW_REJECT_NOTIFICATION_ID}"
    timeout: 15000
- tapOn:
    id: "notification-reject-${FOLLOW_REJECT_NOTIFICATION_ID}"
- extendedWaitUntil:
    notVisible:
      id: "notification-reject-${FOLLOW_REJECT_NOTIFICATION_ID}"
    timeout: 15000
- runFlow:
    file: ../../reusable/preserve_state_relaunch.yaml
    env:
      EXPECTED_BOUNDARY_ID: "home-screen"
- runFlow: ../../reusable/open_notifications_inbox.yaml
- assertNotVisible:
    id: "notification-accept-${FOLLOW_REJECT_NOTIFICATION_ID}"
- assertNotVisible:
    id: "notification-reject-${FOLLOW_REJECT_NOTIFICATION_ID}"
