appId: ${MAESTRO_APP_ID}
name: P3 conversation remains in inbox and reopens
properties:
  junitId: p3.messaging.inbox_thread_persists
  junitClassname: contract.mobile.p3
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- runFlow: ../../reusable/open_messages_inbox.yaml
- extendedWaitUntil:
    visible:
      id: "messages-conversation-${MESSAGE_CONVERSATION_ID}"
    timeout: 15000
- tapOn:
    id: "messages-conversation-${MESSAGE_CONVERSATION_ID}"
- assertVisible: "${MESSAGE_TEXT}"
- back
- runFlow:
    file: ../../reusable/preserve_state_relaunch.yaml
    env:
      EXPECTED_BOUNDARY_ID: "home-screen"
- runFlow: ../../reusable/open_messages_inbox.yaml
- assertVisible:
    id: "messages-conversation-${MESSAGE_CONVERSATION_ID}"
