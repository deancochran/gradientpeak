appId: ${MAESTRO_APP_ID}
name: P3 sent message survives relaunch
properties:
  junitId: p3.messaging.send_relaunch
  junitClassname: contract.mobile.p3
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- openLink: "${MAESTRO_APP_SCHEME}://messages/${MESSAGE_CONVERSATION_ID}"
- extendedWaitUntil:
    visible:
      id: "message-thread-screen"
    timeout: 15000
- tapOn:
    id: "message-input"
- inputText: "${MESSAGE_TEXT}"
- hideKeyboard
- tapOn:
    id: "message-send-button"
- extendedWaitUntil:
    visible: "${MESSAGE_TEXT}"
    timeout: 15000
- runFlow:
    file: ../../reusable/preserve_state_relaunch.yaml
    env:
      EXPECTED_BOUNDARY_ID: "home-screen"
- openLink: "${MAESTRO_APP_SCHEME}://messages/${MESSAGE_CONVERSATION_ID}"
- assertVisible: "${MESSAGE_TEXT}"
