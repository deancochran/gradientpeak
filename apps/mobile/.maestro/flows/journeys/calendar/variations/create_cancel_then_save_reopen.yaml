appId: ${MAESTRO_APP_ID}
name: Custom event form cancels a draft then saves and reopens the event
tags: [variation, calendar, create-cancel-save]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- runFlow: ../../../reusable/open_calendar_tab.yaml
- tapOn:
    id: "create-event-entry"
- tapOn:
    id: "create-type-custom"
- tapOn:
    id: "manual-create-title-input"
- inputText: "Unsaved Maestro event"
- hideKeyboard
- tapOn: "Cancel"
- assertNotVisible: "Unsaved Maestro event"
- tapOn:
    id: "create-event-entry"
- tapOn:
    id: "create-type-custom"
- tapOn:
    id: "manual-create-title-input"
- inputText: "${EVENT_TITLE}"
- hideKeyboard
- tapOn:
    id: "manual-create-submit"
- tapOn: "${EVENT_TITLE}"
- assertVisible:
    id: "event-detail-options-trigger"
- back
- tapOn: "${EVENT_TITLE}"
- assertVisible: "${EVENT_TITLE}"
