appId: ${MAESTRO_APP_ID}
name: "calendar sources journeys/calendar/*, main/calendar_custom_event, contracts/p0/day_agenda_planned_and_completed, contracts/p1/recurrence_* — selected agenda, event detail, edit scope and inaccessible state"
tags: [variation, calendar, baseline-source-pair-a, intentional-red]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- runFlow: ../../../reusable/open_calendar_tab.yaml
- swipe: { direction: LEFT }
- swipe: { direction: RIGHT }
- openLink: "${MAESTRO_APP_SCHEME}://calendar-day?date=${AGENDA_DATE}"
- assertVisible: { id: "calendar-day-planned-summary" }
- scrollUntilVisible: { element: { id: "calendar-day-planned-activity-row-${AGENDA_PLANNED_EVENT_ID}" }, direction: DOWN }
- tapOn: { id: "calendar-day-planned-activity-row-${AGENDA_PLANNED_EVENT_ID}" }
- assertVisible: { id: "activity-plan-structure" }
- back
- tapOn: { id: "calendar-day-activity-row-${AGENDA_COMPLETED_ACTIVITY_ID}" }
- assertVisible: { id: "activity-detail-summary" }
- back
- assertVisible: { id: "calendar-day-planned-activity-row-${AGENDA_PLANNED_EVENT_ID}" }
- openLink: "${MAESTRO_APP_SCHEME}://event-detail?id=${RECURRING_SINGLE_EVENT_ID}"
- tapOn: { id: "event-detail-options-trigger" }
- tapOn: { id: "event-detail-options-edit" }
- assertVisible: { id: "event-detail-update-repeat-row" }
- tapOn: { id: "event-detail-update-save-button" }
- assertVisible: "This event only"
- assertVisible: "This and future events"
- assertVisible: "Entire series"
- tapOn: { id: "event-detail-update-scope-single" }
- assertVisible: { id: "event-detail-screen" }
- openLink: "${MAESTRO_APP_SCHEME}://event-detail?id=${RECURRING_SINGLE_EVENT_ID}"
- assertVisible: { id: "event-detail-options-trigger" }
- openLink: "${MAESTRO_APP_SCHEME}://event-detail?id=${INACCESSIBLE_EVENT_ID}"
- assertVisible: "This event may be unavailable."
- assertNotVisible: { id: "event-detail-options-trigger" }
- openLink: "${MAESTRO_APP_SCHEME}://event-detail?id=${RECURRING_SERIES_EVENT_ID}"
- tapOn: { id: "event-detail-options-trigger" }
- tapOn: { id: "event-detail-options-delete" }
- assertVisible: { id: "event-detail-delete-scope-modal" }
- tapOn: { id: "event-detail-delete-scope-series" }
- assertVisible: { id: "event-detail-delete-confirm-modal" }
- back
- assertVisible: { id: "event-detail-screen" }
