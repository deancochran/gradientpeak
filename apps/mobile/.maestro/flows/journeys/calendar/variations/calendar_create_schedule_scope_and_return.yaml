appId: ${MAESTRO_APP_ID}
name: "calendar sources journeys/calendar/*, main/calendar_custom_event, contracts/p0/day_agenda_planned_and_completed, contracts/p1/recurrence_* — create cancel/save, future scope, planned recording and selected-day return"
tags: [variation, calendar, baseline-source-pair-b, intentional-red]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- runFlow: ../../../reusable/open_calendar_tab.yaml
- tapOn: { id: "create-event-entry" }
- tapOn: { id: "create-type-custom" }
- tapOn: { id: "manual-create-title-input" }
- inputText: "Unsaved calendar source variation"
- hideKeyboard
- tapOn: "Cancel"
- assertNotVisible: "Unsaved calendar source variation"
- tapOn: { id: "create-event-entry" }
- tapOn: { id: "create-type-custom" }
- tapOn: { id: "manual-create-title-input" }
- inputText: "${EVENT_TITLE}"
- hideKeyboard
- tapOn: { id: "manual-create-submit" }
- tapOn: "${EVENT_TITLE}"
- assertVisible: { id: "event-detail-options-trigger" }
- back
- tapOn: "${EVENT_TITLE}"
- assertVisible: "${EVENT_TITLE}"
- openLink: "${MAESTRO_APP_SCHEME}://event-detail?id=${RECURRING_FUTURE_EVENT_ID}"
- tapOn: { id: "event-detail-options-trigger" }
- tapOn: { id: "event-detail-options-edit" }
- tapOn: { id: "event-detail-update-title-input" }
- eraseText
- inputText: "${RECURRING_FUTURE_TITLE}"
- hideKeyboard
- tapOn: { id: "event-detail-update-save-button" }
- tapOn: { id: "event-detail-update-scope-future" }
- assertVisible: "${RECURRING_FUTURE_TITLE}"
- openLink: "${MAESTRO_APP_SCHEME}://event-detail?id=${RECURRING_SINGLE_EVENT_ID}"
- tapOn: { id: "event-detail-options-trigger" }
- tapOn: { id: "event-detail-options-edit" }
- tapOn: { id: "event-detail-update-title-input" }
- eraseText
- inputText: "Maestro occurrence variation B"
- hideKeyboard
- tapOn: { id: "event-detail-update-save-button" }
- tapOn: { id: "event-detail-update-scope-single" }
- openLink: "${MAESTRO_APP_SCHEME}://event-detail?id=${RECURRING_SINGLE_EVENT_ID}"
- assertVisible: "Maestro occurrence variation B"
- openLink: "${MAESTRO_APP_SCHEME}://event-detail?id=${PLANNED_EVENT_ID}"
- tapOn: { id: "event-detail-activity-plan-card" }
- assertVisible: { id: "activity-plan-structure" }
- tapOn: { id: "activity-plan-options-trigger" }
- tapOn: { id: "activity-plan-options-start" }
- assertVisible: { id: "recording-start-button" }
- back
- openLink: "${MAESTRO_APP_SCHEME}://calendar-day?date=${AGENDA_DATE}"
- assertVisible: { id: "calendar-day-activity-row-${AGENDA_COMPLETED_ACTIVITY_ID}" }
- openLink: "${MAESTRO_APP_SCHEME}://event-detail?id=${INACCESSIBLE_EVENT_ID}"
- assertNotVisible: "Attach Activity Plan"
- openLink: "${MAESTRO_APP_SCHEME}://event-detail?id=${RECURRING_SERIES_EVENT_ID}"
- tapOn: { id: "event-detail-options-trigger" }
- tapOn: { id: "event-detail-options-delete" }
- tapOn: { id: "event-detail-delete-scope-series" }
- tapOn: { id: "event-detail-delete-confirm" }
- openLink: "${MAESTRO_APP_SCHEME}://event-detail?id=${RECURRING_SERIES_EVENT_ID}"
- assertVisible: "Event not found"
