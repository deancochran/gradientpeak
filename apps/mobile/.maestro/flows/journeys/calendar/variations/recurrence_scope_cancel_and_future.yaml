appId: ${MAESTRO_APP_ID}
name: Recurrence scope sheet cancels before a future-only edit persists
tags: [variation, calendar, recurrence]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- openLink: "${MAESTRO_APP_SCHEME}://event-detail?id=${RECURRING_FUTURE_EVENT_ID}"
- tapOn:
    id: "event-detail-options-trigger"
- tapOn:
    id: "event-detail-options-edit"
- tapOn:
    id: "event-detail-update-title-input"
- eraseText
- inputText: "${RECURRING_FUTURE_TITLE}"
- hideKeyboard
- tapOn:
    id: "event-detail-update-save-button"
- assertVisible: "This and future events"
- back
- assertNotVisible: "${RECURRING_FUTURE_TITLE}"
- tapOn:
    id: "event-detail-update-save-button"
- tapOn:
    id: "event-detail-update-scope-future"
- assertVisible: "${RECURRING_FUTURE_TITLE}"
- back
- openLink: "${MAESTRO_APP_SCHEME}://event-detail?id=${RECURRING_FUTURE_EVENT_ID}"
- assertVisible: "${RECURRING_FUTURE_TITLE}"
