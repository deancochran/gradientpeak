appId: com.deancochran.gradientpeak.dev
env:
  STANDARD_ROUTE_ID: "8d0b4a27-d087-4eb2-8d9b-c0f3cb8fb001"
---
- runFlow:
    file: ./list_screen_open.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
      STANDARD_ROUTE_ID: "${STANDARD_ROUTE_ID}"
- tapOn:
    id: "routes-list-upload-trigger"
- extendedWaitUntil:
    visible:
      id: "route-upload-screen"
    timeout: 10000
- assertVisible: "GPX or TCX File *"
- assertVisible: "Route Name *"
- assertVisible:
    text: "Upload Route"
