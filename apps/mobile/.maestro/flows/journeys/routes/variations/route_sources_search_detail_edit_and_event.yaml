appId: ${MAESTRO_APP_ID}
name: "route sources discover/route_detail_open, journeys/routes/*, contracts/p0/event_route_attach_reopen, contracts/p1/route_delete_persists,route_edit_persists,route_upload_success — search, map/elevation, edit cancel/save and event attach"
tags: [variation, routes, baseline-source-pair-a, intentional-red]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- runFlow: ../../../reusable/open_discover_tab.yaml
- tapOn: { id: "discover-scope-routes" }
- tapOn: { id: "discover-search-input" }
- inputText: "${STANDARD_ROUTE_NAME}"
- hideKeyboard
- tapOn: "${STANDARD_ROUTE_NAME}"
- assertVisible: { id: "route-detail-summary" }
- assertVisible: { id: "route-detail-map" }
- scrollUntilVisible: { element: { id: "route-detail-elevation" }, direction: DOWN }
- assertVisible: { id: "route-detail-metadata" }
- openLink: "${MAESTRO_APP_SCHEME}://route-detail?id=${EDIT_ROUTE_ID}"
- tapOn: { id: "route-detail-options-trigger" }
- tapOn: { id: "route-detail-options-edit" }
- tapOn: { id: "route-edit-name-input" }
- eraseText
- inputText: "Unsaved route source variation"
- hideKeyboard
- back
- assertVisible: "${EDIT_ROUTE_NAME}"
- tapOn: { id: "route-detail-options-trigger" }
- tapOn: { id: "route-detail-options-edit" }
- tapOn: { id: "route-edit-name-input" }
- eraseText
- inputText: "${ROUTE_EDITED_NAME}"
- hideKeyboard
- tapOn: { id: "route-edit-submit-button" }
- assertVisible: "${ROUTE_EDITED_NAME}"
- openLink: "${MAESTRO_APP_SCHEME}://event-detail?id=${ROUTE_ASSIGNMENT_EVENT_ID}"
- tapOn: { id: "event-detail-options-trigger" }
- tapOn: { id: "event-detail-options-edit" }
- tapOn: { id: "event-detail-update-choose-route-card" }
- tapOn: "Search routes"
- inputText: "${EVENT_ROUTE_NAME}"
- hideKeyboard
- tapOn: { id: "resource-picker-result-${EVENT_ROUTE_ID}" }
- tapOn: { id: "event-detail-update-save-button" }
- tapOn: "${EVENT_ROUTE_NAME}"
- assertVisible: { id: "route-detail-screen" }
- back
- openLink: "${MAESTRO_APP_SCHEME}://route-upload"
- assertVisible: { id: "route-upload-pick-file-button" }
- assertVisible: { id: "route-upload-submit-button" }
- back
- openLink: "${MAESTRO_APP_SCHEME}://route-detail?id=${DELETE_ROUTE_ID}"
- tapOn: { id: "route-detail-options-trigger" }
- tapOn: { id: "route-detail-options-delete" }
- assertVisible: { id: "route-detail-delete-modal" }
- back
- assertVisible: "${DELETE_ROUTE_NAME}"
