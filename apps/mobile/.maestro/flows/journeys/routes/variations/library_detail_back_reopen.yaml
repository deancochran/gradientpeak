appId: ${MAESTRO_APP_ID}
name: Route library opens canonical detail and reopens the same card
tags: [variation, routes, browse-detail]
---
- runFlow:
    file: ../../../reusable/open_own_profile.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- tapOn:
    id: "my-routes"
- extendedWaitUntil:
    visible:
      id: "routes-list-item-${STANDARD_ROUTE_ID}"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "routes-list-item-${STANDARD_ROUTE_ID}"
    direction: DOWN
- tapOn:
    id: "routes-list-item-${STANDARD_ROUTE_ID}"
- assertVisible:
    id: "route-detail-screen"
- assertVisible: "${STANDARD_ROUTE_NAME}"
- assertVisible:
    id: "route-detail-summary"
- back
- assertVisible:
    id: "routes-list-item-${STANDARD_ROUTE_ID}"
- tapOn:
    id: "routes-list-item-${STANDARD_ROUTE_ID}"
- assertVisible: "${STANDARD_ROUTE_NAME}"
