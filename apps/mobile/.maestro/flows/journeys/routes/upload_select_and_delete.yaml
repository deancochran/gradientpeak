appId: ${MAESTRO_APP_ID}
name: Route upload selects a deterministic GPX and opens processed detail
properties:
  junitId: journey.mobile.routes.upload_select_and_delete
  junitClassname: journey.mobile.routes
---
- runFlow:
    file: ../../reusable/open_own_profile.yaml
    env:
      STANDARD_USER_EMAIL: "${ROUTE_SELECT_USER_EMAIL_A}"
      STANDARD_USER_PASS: "${ROUTE_SELECT_USER_PASS_A}"
- tapOn:
    id: "my-routes"
- extendedWaitUntil:
    visible:
      id: "routes-list-screen"
    timeout: 10000
- assertVisible:
    id: "routes-list-content"
- tapOn:
    id: "routes-list-upload-trigger"
- extendedWaitUntil:
    visible:
      id: "route-upload-screen"
    timeout: 10000
- assertVisible:
    id: "route-upload-file-input"
- assertVisible:
    id: "route-upload-name-input"
- assertVisible:
    id: "route-upload-submit-button"
- tapOn:
    id: "route-upload-file-input"
- extendedWaitUntil:
    visible: "${ROUTE_SELECT_FILE_DISPLAY_NAME_A}"
    timeout: 10000
- tapOn: "${ROUTE_SELECT_FILE_DISPLAY_NAME_A}"
- assertVisible: "${ROUTE_SELECT_FILE_DISPLAY_NAME_A}"
- assertVisible:
    id: "route-upload-file-input-clear"
- tapOn:
    id: "route-upload-name-input"
- inputText: "${ROUTE_SELECT_UPLOAD_NAME_A}"
- hideKeyboard
- tapOn:
    id: "route-upload-submit-button"
- extendedWaitUntil:
    visible:
      id: "route-detail-screen"
    timeout: 60000
- assertVisible: "${ROUTE_SELECT_UPLOAD_NAME_A}"
- assertVisible: "Distance"
- assertVisible: "Climb"
