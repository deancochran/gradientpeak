appId: ${MAESTRO_APP_ID}
name: "message sources journeys/messaging/direct_message_from_profile,inbox_expect_conversation,inbox_open, profile/direct_message_from_profile_v2, contracts/p3/message_inbox_thread_persists,message_new_conversation_from_inbox,message_send_survives_relaunch — compose cancel, thread reopen and send"
tags: [variation, messaging, baseline-source-pair-a]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- runFlow: ../../../reusable/open_messages_inbox.yaml
- assertVisible: { id: "messages-screen" }
- tapOn: { id: "messages-new-trigger" }
- tapOn: "Search recipients"
- inputText: "${MESSAGE_TARGET_USERNAME}"
- hideKeyboard
- back
- assertVisible: { id: "messages-screen" }
- tapOn: { id: "messages-new-trigger" }
- tapOn: "Search recipients"
- inputText: "${MESSAGE_TARGET_USERNAME}"
- hideKeyboard
- tapOn: { id: "messages-new-user-${MESSAGE_TARGET_USER_ID}" }
- tapOn: { id: "messages-new-next-trigger" }
- assertVisible: { id: "message-thread-screen" }
- tapOn: { id: "message-input" }
- inputText: "${MESSAGE_TEXT}"
- tapOn: { id: "message-send-button" }
- assertVisible: "${MESSAGE_TEXT}"
- back
- assertVisible: { id: "messages-conversation-${MESSAGE_CONVERSATION_ID}" }
- tapOn: { id: "messages-conversation-${MESSAGE_CONVERSATION_ID}" }
- assertVisible: "${MESSAGE_TEXT}"
