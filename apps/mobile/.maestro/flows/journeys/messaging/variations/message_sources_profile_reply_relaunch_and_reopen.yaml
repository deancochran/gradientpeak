appId: ${MAESTRO_APP_ID}
name: "message sources journeys/messaging/direct_message_from_profile,inbox_expect_conversation,inbox_open, profile/direct_message_from_profile_v2, contracts/p3/message_inbox_thread_persists,message_new_conversation_from_inbox,message_send_survives_relaunch — profile handoff, reply, relaunch and read persistence"
tags: [variation, messaging, baseline-source-pair-b]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- openLink: "${MAESTRO_APP_SCHEME}://user/${MESSAGE_TARGET_USER_ID}"
- tapOn: { id: "user-detail-message-button" }
- assertVisible: { id: "message-thread-screen" }
- tapOn: { id: "message-input" }
- inputText: "Profile-to-thread source reply"
- tapOn: { id: "message-send-button" }
- assertVisible: "Profile-to-thread source reply"
- back
- runFlow: ../../../reusable/open_messages_inbox.yaml
- tapOn: { id: "messages-conversation-${MESSAGE_CONVERSATION_ID}" }
- assertVisible: "${MESSAGE_EXISTING_TEXT}"
- back
- tapOn: { id: "messages-conversation-${MESSAGE_CONVERSATION_ID}" }
- tapOn: { id: "message-input" }
- inputText: "${MESSAGE_TEXT}"
- tapOn: { id: "message-send-button" }
- runFlow: { file: ../../../reusable/preserve_state_relaunch.yaml, env: { EXPECTED_BOUNDARY_ID: "home-screen" } }
- openLink: "${MAESTRO_APP_SCHEME}://messages/${MESSAGE_CONVERSATION_ID}"
- assertVisible: "${MESSAGE_TEXT}"
- back
- runFlow: ../../../reusable/open_messages_inbox.yaml
- assertVisible: { id: "messages-conversation-${MESSAGE_CONVERSATION_ID}" }
