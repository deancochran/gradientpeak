appId: ${MAESTRO_APP_ID}
name: Inbox thread reopens before sending a persisted reply
tags: [variation, messaging, thread]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- runFlow: ../../../reusable/open_messages_inbox.yaml
- tapOn:
    id: "messages-conversation-${MESSAGE_CONVERSATION_ID}"
- assertVisible: "${MESSAGE_EXISTING_TEXT}"
- back
- assertVisible:
    id: "messages-conversation-${MESSAGE_CONVERSATION_ID}"
- tapOn:
    id: "messages-conversation-${MESSAGE_CONVERSATION_ID}"
- tapOn:
    id: "message-input"
- inputText: "${MESSAGE_TEXT}"
- tapOn:
    id: "message-send-button"
- assertVisible: "${MESSAGE_TEXT}"
