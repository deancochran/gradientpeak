appId: ${MAESTRO_APP_ID}
name: "record sources journeys/record/*, main/record_activity_selection,main/record_quick_start, smoke/record_lifecycle, contracts/p0/plan_calendar_record_complete,record_discard_finalized,record_review_and_submit,record_route_retained_on_activity,record_submission_retry — plan/route setup, no-metrics, pause and review"
tags: [variation, recording, baseline-source-pair-a, intentional-red]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- runFlow: ../../../reusable/open_record_tab.yaml
- tapOn: { id: "recording-activity-control-button" }
- tapOn: { id: "record-activity-option-bike" }
- tapOn: { id: "record-activity-save-button" }
- assertVisible: "Bike"
- tapOn: { id: "recording-setup-action-plan" }
- tapOn: { id: "discover-search-input" }
- inputText: "${REQUIRED_METRICS_PLAN_NAME}"
- hideKeyboard
- tapOn: "${REQUIRED_METRICS_PLAN_NAME}"
- assertVisible: { id: "recording-setup-remove-plan" }
- tapOn: { id: "recording-start-button" }
- assertVisible: "Profile Setup Required"
- tapOn: "Continue Anyway"
- assertVisible: { id: "recording-pause-button" }
- tapOn: { id: "recording-pause-button" }
- assertVisible: { id: "recording-resume-button" }
- tapOn: { id: "recording-resume-button" }
- assertNotVisible: { id: "recording-resume-button" }
- tapOn: { id: "recording-finish-button" }
- assertVisible: { id: "recording-review-summary" }
- assertVisible: { id: "recording-review-metrics" }
- assertVisible: "${REQUIRED_METRICS_PLAN_NAME}"
- tapOn: "Save Activity"
- tapOn: { id: "tab-button-profile" }
- scrollUntilVisible: { element: { id: "my-activities" }, direction: DOWN }
- tapOn: { id: "my-activities" }
- assertVisible: { id: "activities-list-item-.*" }
