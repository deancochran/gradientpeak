appId: ${MAESTRO_APP_ID}
name: Recording plan picker backs out safely then retains selected plan on reopen
tags: [variation, recording, plan-selection]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- runFlow: ../../../reusable/open_record_tab.yaml
- tapOn:
    id: "recording-setup-action-plan"
- assertVisible:
    id: "discover-screen"
- back
- assertVisible:
    id: "record-screen-ready"
- tapOn:
    id: "recording-setup-action-plan"
- tapOn:
    id: "discover-search-input"
- inputText: "${PLANNED_ACTIVITY_NAME}"
- hideKeyboard
- tapOn: "${PLANNED_ACTIVITY_NAME}"
- assertVisible:
    id: "recording-setup-remove-plan"
- back
- runFlow: ../../../reusable/open_record_tab.yaml
- assertVisible: "${PLANNED_ACTIVITY_NAME}"
