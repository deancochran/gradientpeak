appId: ${MAESTRO_APP_ID}
name: Recording review keeps artifact after delete cancel then discards on confirmation
tags: [variation, recording, review-discard]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- runFlow: ../../../reusable/open_record_tab.yaml
- tapOn:
    id: "recording-start-button"
- tapOn:
    id: "recording-finish-button"
- assertVisible:
    id: "recording-review-summary"
- tapOn: "Delete Activity"
- assertVisible: "Delete"
- back
- assertVisible:
    id: "recording-review-summary"
- tapOn: "Delete Activity"
- tapOn: "Delete"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000
- runFlow: ../../../reusable/open_record_tab.yaml
- assertNotVisible:
    id: "recording-review-summary"
