appId: ${MAESTRO_APP_ID}
name: "record sources journeys/record/*, main/record_activity_selection,main/record_quick_start, smoke/record_lifecycle, contracts/p0/plan_calendar_record_complete,record_discard_finalized,record_review_and_submit,record_route_retained_on_activity,record_submission_retry — route reselection, retry, discard and history relation"
tags: [variation, recording, baseline-source-pair-b, intentional-red]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- runFlow: ../../../reusable/open_record_tab.yaml
- tapOn: { id: "recording-setup-action-route" }
- tapOn: { id: "discover-search-input" }
- inputText: "${RECORDING_ROUTE_NAME}"
- hideKeyboard
- tapOn: "${RECORDING_ROUTE_NAME}"
- assertVisible: { id: "route-preview-attach-button" }
- tapOn: { id: "route-preview-attach-button" }
- tapOn: { id: "recording-setup-remove-route" }
- assertVisible: { id: "recording-setup-action-route" }
- tapOn: { id: "recording-setup-action-route" }
- tapOn: "${RECORDING_ROUTE_NAME}"
- tapOn: { id: "route-preview-attach-button" }
- tapOn: { id: "recording-start-button" }
- tapOn: { id: "recording-pause-button" }
- tapOn: { id: "recording-resume-button" }
- tapOn: { id: "recording-finish-button" }
- assertVisible: "${RECORDING_ROUTE_NAME}"
- tapOn: "Save Activity"
- assertVisible: { id: "activity-submit-status" }
- tapOn: "Retry upload"
- extendedWaitUntil: { notVisible: { id: "activity-submit-status" }, timeout: 15000 }
- tapOn: { id: "tab-button-profile" }
- scrollUntilVisible: { element: { id: "my-activities" }, direction: DOWN }
- tapOn: { id: "my-activities" }
- tapOn: { id: "activities-list-item-.*" }
- assertVisible: { id: "activity-detail-linked-route-${RECORDING_ROUTE_ID}" }
- runFlow: ../../../reusable/open_record_tab.yaml
- tapOn: { id: "recording-start-button" }
- tapOn: { id: "recording-finish-button" }
- tapOn: "Delete Activity"
- back
- assertVisible: { id: "recording-review-summary" }
- tapOn: "Delete Activity"
- tapOn: "Delete"
- runFlow: { file: ../../../reusable/preserve_state_relaunch.yaml, env: { EXPECTED_BOUNDARY_ID: "home-screen" } }
- tapOn: { id: "tab-button-record" }
- assertNotVisible: { id: "recording-review-summary" }
