appId: ${MAESTRO_APP_ID}
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- runFlow:
    file: ../../reusable/open_record_tab.yaml
- extendedWaitUntil:
    visible:
      id: "record-screen-ready"
    timeout: 10000
- tapOn:
    id: "recording-start-button"
- extendedWaitUntil:
    visible:
      id: "recording-pause-button"
    timeout: 10000
- tapOn:
    id: "recording-pause-button"
- extendedWaitUntil:
    visible:
      id: "recording-resume-button"
    timeout: 10000
- tapOn:
    id: "recording-resume-button"
- extendedWaitUntil:
    visible:
      id: "recording-pause-button"
    timeout: 10000
- assertNotVisible:
    id: "recording-resume-button"
- tapOn:
    id: "recording-pause-button"
- extendedWaitUntil:
    visible:
      id: "recording-resume-button"
    timeout: 10000
- tapOn:
    id: "recording-resume-button"
- extendedWaitUntil:
    visible:
      id: "recording-pause-button"
    timeout: 10000
- tapOn:
    id: "recording-pause-button"
- extendedWaitUntil:
    visible:
      id: "recording-finish-button"
    timeout: 10000
- tapOn:
    id: "recording-finish-button"
- extendedWaitUntil:
    visible: "Save Activity"
    timeout: 15000
- assertNotVisible:
    id: "activity-name-input"
