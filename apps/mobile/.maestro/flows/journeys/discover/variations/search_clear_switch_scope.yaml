appId: ${MAESTRO_APP_ID}
name: Discovery clears profile search before opening a route result
tags: [variation, discover, search-scopes]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- runFlow: ../../../reusable/open_discover_tab.yaml
- tapOn:
    id: "discover-scope-users"
- tapOn:
    id: "discover-search-input"
- inputText: "no-such-profile"
- hideKeyboard
- assertVisible: "No profiles"
- tapOn:
    id: "discover-search-clear"
- tapOn:
    id: "discover-scope-routes"
- tapOn:
    id: "discover-search-input"
- inputText: "${SHARED_ROUTE_NAME}"
- hideKeyboard
- tapOn: "${SHARED_ROUTE_NAME}"
- assertVisible:
    id: "route-detail-summary"
