appId: ${MAESTRO_APP_ID}
name: Profile search opens detail, returns to results, then starts a message
tags: [variation, discover, profile-message]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- runFlow: ../../../reusable/open_discover_tab.yaml
- tapOn:
    id: "discover-scope-users"
- tapOn:
    id: "discover-search-input"
- inputText: "${TARGET_USERNAME}"
- hideKeyboard
- tapOn:
    id: "discover-user-${TARGET_USER_ID}"
- assertVisible:
    id: "user-detail-summary"
- back
- assertVisible:
    id: "discover-user-${TARGET_USER_ID}"
- tapOn:
    id: "discover-user-${TARGET_USER_ID}"
- tapOn:
    id: "user-detail-message-button"
- assertVisible:
    id: "message-thread-screen"
