appId: com.deancochran.gradientpeak.dev
env:
  ONBOARDING_USER_EMAIL: "onboarding@example.com"
  ONBOARDING_USER_PASS: "password123"
---
- runFlow:
    file: ../../reusable/bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: "onboarding-screen"
    timeout: 15000
- assertVisible:
    id: "onboarding-provider-selection"
- assertVisible: "Continue"
- tapOn:
    id: "onboarding-continue-provider-button"
- extendedWaitUntil:
    visible:
      id: "onboarding-review"
    timeout: 15000
