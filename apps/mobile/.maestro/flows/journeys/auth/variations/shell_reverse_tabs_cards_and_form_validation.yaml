appId: ${MAESTRO_APP_ID}
name: "shell sources main/tabs_smoke, performance/tab_navigation_budgets, smoke/mobile_card_preview,smoke/ui_preview_contract — reverse native navigation, card detail matrix and preview form validation"
tags: [variation, shell, preview, performance, baseline-source-pair-b]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- tapOn: { id: "tab-button-calendar" }
- assertVisible: { id: "calendar-screen" }
- tapOn: { id: "tab-button-plan" }
- assertVisible: { id: "training-path-section" }
- tapOn: { id: "tab-button-record" }
- assertVisible: { id: "record-screen-ready" }
- tapOn: { id: "tab-button-home" }
- assertVisible: { id: "home-screen" }
- openLink: "${MAESTRO_APP_SCHEME}://storybook?surface=mobile-cards"
- assertVisible: { id: "mobile-card-matrix" }
- scrollUntilVisible: { element: { id: "mobile-card-profile" }, direction: DOWN }
- assertVisible: { id: "mobile-card-group" }
- assertVisible: { id: "mobile-card-group-event" }
- assertVisible: { id: "mobile-card-calendar" }
- scrollUntilVisible: { element: { id: "mobile-card-route" }, direction: UP }
- assertVisible: { id: "mobile-card-training-plan" }
- assertVisible: { id: "mobile-card-activity-plan" }
- openLink: "${MAESTRO_APP_SCHEME}://storybook"
- assertVisible: { id: "ui-preview-scenario-account-controls" }
- assertVisible: { id: "profile-card" }
- scrollUntilVisible: { element: { id: "ui-preview-scenario-form-fields" }, direction: DOWN }
- tapOn: { id: "ui-preview-form-username" }
- eraseText
- tapOn: { id: "ui-preview-form-is-public" }
- tapOn: { id: "ui-preview-form-submit" }
- assertVisible: { id: "ui-preview-form-username-error" }
- assertVisible: "E2E_RUNTIME_ERRORS=0"
