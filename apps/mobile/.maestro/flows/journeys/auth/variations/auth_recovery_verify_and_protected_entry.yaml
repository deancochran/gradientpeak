appId: ${MAESTRO_APP_ID}
name: "auth sources main/auth_navigation, main/forgot_password, main/sign_up_to_verify, main/verify_resend, smoke/auth_navigation, resilience/sign_in_invalid_spam_guard, contracts/p0/auth_* — recovery, verification, protected return"
tags: [variation, auth, baseline-source-pair-a]
---
- runFlow: ../../../reusable/ensure_signed_out.yaml
- tapOn: { id: "email-input" }
- inputText: "invalid-address"
- tapOn: { id: "password-input" }
- inputText: "short"
- hideKeyboard
- tapOn: { id: "sign-in-button" }
- assertVisible: { id: "sign-in-screen" }
- tapOn: { id: "forgot-password-button" }
- assertVisible: { id: "forgot-password-screen" }
- tapOn: "Email address"
- inputText: "${RESET_EMAIL}"
- hideKeyboard
- tapOn: { id: "send-reset-button" }
- assertVisible: "Check your email"
- tapOn: { id: "back-to-signin-button" }
- openLink: "${MAESTRO_APP_SCHEME}://integrations"
- assertVisible: { id: "sign-in-screen" }
- tapOn: { id: "email-input" }
- inputText: "${STANDARD_USER_EMAIL}"
- tapOn: { id: "password-input" }
- inputText: "${STANDARD_USER_PASS}"
- hideKeyboard
- tapOn: { id: "sign-in-button" }
- assertVisible: { id: "integrations-screen" }
