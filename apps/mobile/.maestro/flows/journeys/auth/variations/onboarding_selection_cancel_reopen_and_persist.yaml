appId: ${MAESTRO_APP_ID}
name: "onboarding sources journeys/auth/onboarding_skip_path, main/onboarding_happy_path, contracts/p0/onboarding_follow_person_persists, onboarding_join_open_group_persists, onboarding_request_closed_group_persists — cancel selections, reopen profiles, persist final choices"
tags: [variation, onboarding, baseline-source-pair-b, intentional-red]
---
- runFlow: ../../../reusable/ensure_signed_out.yaml
- tapOn: { id: "email-input" }
- inputText: "${ONBOARDING_OPEN_GROUP_USER_EMAIL}"
- tapOn: { id: "password-input" }
- inputText: "${ONBOARDING_OPEN_GROUP_USER_PASS}"
- hideKeyboard
- tapOn: { id: "sign-in-button" }
- assertVisible: { id: "onboarding-provider-selection" }
- assertVisible: { id: "groups-people-step" }
- tapOn: { id: "onboarding-people-search" }
- inputText: "${PRIVATE_TARGET_USERNAME}"
- hideKeyboard
- tapOn: { id: "onboarding-profile-open-${PRIVATE_TARGET_USER_ID}" }
- assertVisible: { id: "user-detail-summary" }
- back
- tapOn: { id: "onboarding-profile-${PRIVATE_TARGET_USER_ID}" }
- assertVisible: { id: "onboarding-profile-selected-${PRIVATE_TARGET_USER_ID}" }
- tapOn: { id: "onboarding-profile-${PRIVATE_TARGET_USER_ID}" }
- assertNotVisible: { id: "onboarding-profile-selected-${PRIVATE_TARGET_USER_ID}" }
- tapOn: { id: "onboarding-group-${CLOSED_GROUP_ID}" }
- assertVisible: { id: "onboarding-group-requested-${CLOSED_GROUP_ID}" }
- tapOn: { id: "onboarding-group-${CLOSED_GROUP_ID}" }
- assertNotVisible: { id: "onboarding-group-requested-${CLOSED_GROUP_ID}" }
- tapOn: { id: "onboarding-group-${OPEN_GROUP_ID}" }
- tapOn: { id: "onboarding-finish-button" }
- openLink: "${MAESTRO_APP_SCHEME}://group-detail?groupId=${OPEN_GROUP_ID}"
- assertVisible: "Member"
- back
- openLink: "${MAESTRO_APP_SCHEME}://user/${PRIVATE_TARGET_USER_ID}"
- assertVisible: { id: "user-detail-follow-button" }
