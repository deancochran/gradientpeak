appId: ${MAESTRO_APP_ID}
name: "shell sources main/tabs_smoke, performance/tab_navigation_budgets, smoke/mobile_card_preview,smoke/ui_preview_contract — native tab traversal, canonical card scroll and UI controls"
tags: [variation, shell, preview, performance, baseline-source-pair-a]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- assertVisible: { id: "tab-button-record" }
- assertVisible: { id: "tab-button-plan" }
- assertVisible: { id: "tab-button-calendar" }
- tapOn: { id: "tab-button-plan" }
- assertVisible: { id: "plan-screen" }
- tapOn: { id: "tab-button-calendar" }
- assertVisible: { id: "calendar-screen" }
- tapOn: { id: "tab-button-groups" }
- assertVisible: { id: "groups-screen" }
- tapOn: { id: "tab-button-home" }
- assertVisible: { id: "home-screen" }
- openLink: "${MAESTRO_APP_SCHEME}://storybook?surface=mobile-cards"
- assertVisible: { id: "mobile-card-matrix" }
- assertVisible: { id: "mobile-card-activity" }
- scrollUntilVisible: { element: { id: "mobile-card-activity-plan" }, direction: DOWN }
- scrollUntilVisible: { element: { id: "mobile-card-training-plan" }, direction: DOWN }
- scrollUntilVisible: { element: { id: "mobile-card-route" }, direction: DOWN }
- scrollUntilVisible: { element: { id: "mobile-card-group-event" }, direction: DOWN }
- scrollUntilVisible: { element: { id: "mobile-card-calendar" }, direction: DOWN }
- openLink: "${MAESTRO_APP_SCHEME}://storybook"
- assertVisible: { id: "ui-preview-surface" }
- scrollUntilVisible: { element: { id: "ui-preview-scenario-plan-tabs" }, direction: DOWN }
- tapOn: { id: "settings-tabs-trigger-sessions" }
- assertVisible: { id: "settings-tabs-content-sessions" }
- scrollUntilVisible: { element: { id: "ui-preview-scenario-selection-controls" }, direction: DOWN }
- tapOn: { id: "accept-terms-checkbox" }
- tapOn: { id: "email-notifications-switch" }
- assertVisible: "E2E_RUNTIME_ERRORS=0"
