appId: ${MAESTRO_APP_ID}
name: "auth source main/sign_up_to_verify — sign-up field validation, verification resend and return to sign-in"
tags: [variation, auth, signup, baseline-source-second]
---
- runFlow: ../../../reusable/ensure_signed_out.yaml
- tapOn: { id: "sign-up-link-button" }
- tapOn: { id: "email-input" }
- inputText: "not-an-email"
- tapOn: { id: "password-input" }
- inputText: "short"
- swipe: { direction: UP }
- tapOn: { id: "repeat-password-input" }
- inputText: "different"
- hideKeyboard
- tapOn: { id: "sign-up-button" }
- assertVisible: { id: "sign-up-screen" }
- tapOn: { id: "email-input" }
- eraseText
- inputText: "${SIGNUP_EMAIL_VARIATION}"
- tapOn: { id: "password-input" }
- eraseText
- inputText: "${SIGNUP_PASSWORD}"
- tapOn: { id: "repeat-password-input" }
- eraseText
- inputText: "${SIGNUP_PASSWORD}"
- hideKeyboard
- tapOn: { id: "sign-up-button" }
- assertVisible: { id: "verify-screen" }
- tapOn: { id: "resend-code-button" }
- assertVisible: "Verification code sent"
- tapOn: { id: "back-to-signin-link-button" }
- assertVisible: { id: "sign-in-screen" }
