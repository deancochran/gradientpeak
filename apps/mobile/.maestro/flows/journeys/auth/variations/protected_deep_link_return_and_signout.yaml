appId: ${MAESTRO_APP_ID}
name: Protected deep link returns after login and sign-out blocks reopening
tags: [variation, auth, protected-return]
---
- runFlow: ../../../reusable/ensure_signed_out.yaml
- openLink: "${MAESTRO_APP_SCHEME}://training-preferences"
- assertVisible:
    id: "sign-in-screen"
- tapOn:
    id: "email-input"
- inputText: "${STANDARD_USER_EMAIL}"
- tapOn:
    id: "password-input"
- inputText: "${STANDARD_USER_PASS}"
- hideKeyboard
- tapOn:
    id: "sign-in-button"
- assertVisible:
    id: "training-preferences-screen"
- runFlow:
    file: ../../../reusable/preserve_state_relaunch.yaml
    env:
      EXPECTED_BOUNDARY_ID: "home-screen"
- assertNotVisible:
    id: "sign-in-screen"
- openLink: "${MAESTRO_APP_SCHEME}://training-preferences"
- assertVisible:
    id: "training-preferences-screen"
- back
- runFlow: ../../../reusable/open_own_profile.yaml
- tapOn:
    id: "sign-out"
- tapOn: "Sign Out"
- openLink: "${MAESTRO_APP_SCHEME}://training-preferences"
- assertVisible:
    id: "sign-in-screen"
- runFlow:
    file: ../../../reusable/preserve_state_relaunch.yaml
    env:
      EXPECTED_BOUNDARY_ID: "sign-in-screen"
- assertVisible:
    id: "sign-in-screen"
