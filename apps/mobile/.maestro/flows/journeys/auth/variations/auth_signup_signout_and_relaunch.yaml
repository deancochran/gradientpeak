appId: ${MAESTRO_APP_ID}
name: "auth sources main/auth_navigation, main/forgot_password, main/sign_up_to_verify, main/verify_resend, smoke/auth_navigation, resilience/warm_relaunch_authenticated, contracts/p0/auth_* — sign-up validation, resend, sign-out relaunch"
tags: [variation, auth, baseline-source-pair-b]
---
- runFlow: ../../../reusable/ensure_signed_out.yaml
- tapOn: { id: "sign-up-link-button" }
- assertVisible: { id: "sign-up-screen" }
- swipe: { direction: UP }
- tapOn: { id: "sign-in-link-button" }
- tapOn: { id: "forgot-password-button" }
- back
- assertVisible: { id: "sign-in-screen" }
- runFlow: ../../../reusable/ensure_signed_out.yaml
- tapOn: { id: "sign-up-link-button" }
- tapOn: { id: "email-input" }
- inputText: "${SIGNUP_EMAIL}"
- tapOn: { id: "password-input" }
- inputText: "${SIGNUP_PASSWORD}"
- swipe: { direction: UP }
- tapOn: { id: "repeat-password-input" }
- inputText: "${SIGNUP_PASSWORD}"
- hideKeyboard
- tapOn: { id: "sign-up-button" }
- assertVisible: { id: "verify-screen" }
- tapOn: { id: "resend-code-button" }
- assertVisible: "Verification code sent"
- runFlow: ../../../reusable/ensure_signed_out.yaml
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- assertVisible: { id: "home-screen" }
- runFlow: { file: ../../../reusable/preserve_state_relaunch.yaml, env: { EXPECTED_BOUNDARY_ID: "home-screen" } }
- assertNotVisible: { id: "sign-in-screen" }
- tapOn: { id: "tab-button-profile" }
- scrollUntilVisible: { element: { id: "profile-tab-sign-out" }, direction: DOWN }
- tapOn: { id: "profile-tab-sign-out" }
- tapOn: "Sign Out"
- runFlow: { file: ../../../reusable/preserve_state_relaunch.yaml, env: { EXPECTED_BOUNDARY_ID: "sign-in-screen" } }
- assertVisible: { id: "sign-in-screen" }
- assertNotVisible: { id: "tab-button-home" }
