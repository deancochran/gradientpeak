appId: ${MAESTRO_APP_ID}
name: Plan schedule appears on the selected day and reopens from agenda
tags: [variation, plans, schedule-agenda, intentional-red]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- openLink: "${MAESTRO_APP_SCHEME}://training-plan-detail?id=${PLAN_TRAINING_PLAN_ID}"
- tapOn:
    id: "training-plan-options-trigger"
- tapOn:
    id: "training-plan-options-schedule"
- extendedWaitUntil:
    visible:
      id: "apply-template-anchor-date"
    timeout: 10000
- tapOn:
    id: "apply-template-anchor-date"
- eraseText
- inputText: "${PLAN_SELECTED_DATE}"
- hideKeyboard
- tapOn:
    id: "training-plan-schedule-confirm"
- openLink: "${MAESTRO_APP_SCHEME}://calendar-day?date=${PLAN_SELECTED_DATE}"
- assertVisible:
    id: "calendar-day-planned-summary"
- tapOn:
    id: "calendar-day-planned-activity-row-${PLAN_SCHEDULED_EVENT_ID}"
- assertVisible: "${PLAN_ACTIVITY_PLAN_NAME}"
- back
- tapOn:
    id: "calendar-day-planned-activity-row-${PLAN_SCHEDULED_EVENT_ID}"
- assertVisible:
    id: "activity-plan-structure"
