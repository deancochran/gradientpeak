appId: ${MAESTRO_APP_ID}
name: Plan library opens two canonical plan details and returns to the list
tags: [variation, plans, browse-detail]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- runFlow: ../../../reusable/open_plan_tab.yaml
- scrollUntilVisible:
    element:
      id: "plan-activity-plan-card-${PLAN_ACTIVITY_PLAN_ID}"
    direction: DOWN
- tapOn:
    id: "plan-activity-plan-card-${PLAN_ACTIVITY_PLAN_ID}"
- extendedWaitUntil:
    visible:
      id: "activity-plan-options-trigger"
    timeout: 10000
- assertVisible: "${PLAN_ACTIVITY_PLAN_NAME}"
- assertVisible:
    id: "activity-plan-structure"
- back
- scrollUntilVisible:
    element:
      id: "plan-training-plan-card-${PLAN_TRAINING_PLAN_ID}"
    direction: DOWN
- tapOn:
    id: "plan-training-plan-card-${PLAN_TRAINING_PLAN_ID}"
- extendedWaitUntil:
    visible:
      id: "training-plan-options-trigger"
    timeout: 10000
- assertVisible: "${PLAN_TRAINING_PLAN_NAME}"
- assertVisible:
    id: "training-plan-schedule"
- back
- assertVisible:
    id: "plan-screen"
