appId: ${MAESTRO_APP_ID}
name: "plan sources journeys/activity-plans/shared_*, discover/activity_plan_detail_open, journeys/plans/*, journeys/training-plans/*, main/plan_screen,main/plan_projection_settings, smoke/plan_available, contracts/p0/plan_calendar_record_complete, contracts/p2/goal_edit_persists,training_preferences_persist — discover, duplicate, schedule, agenda and recording relation"
tags: [variation, plans, baseline-source-pair-b, intentional-red]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- runFlow: ../../../reusable/open_discover_tab.yaml
- tapOn: { id: "discover-scope-activityPlans" }
- tapOn: { id: "discover-search-input" }
- inputText: "${SHARED_ACTIVITY_PLAN_NAME}"
- hideKeyboard
- tapOn: "${SHARED_ACTIVITY_PLAN_NAME}"
- assertVisible: { id: "activity-plan-structure" }
- tapOn: { id: "activity-plan-options-trigger" }
- assertVisible: { id: "activity-plan-options-duplicate" }
- tapOn: { id: "activity-plan-options-duplicate" }
- assertVisible: { id: "activity-plan-options-schedule" }
- tapOn: { id: "activity-plan-options-schedule" }
- tapOn: { id: "schedule-submit-button" }
- tapOn: { id: "activity-plan-options-trigger" }
- assertVisible: { id: "activity-plan-options-remove-schedule" }
- runFlow: ../../../reusable/open_discover_tab.yaml
- tapOn: { id: "discover-scope-trainingPlans" }
- tapOn: { id: "discover-search-input" }
- inputText: "${SHARED_TRAINING_PLAN_NAME}"
- hideKeyboard
- tapOn: "${SHARED_TRAINING_PLAN_NAME}"
- assertVisible: { id: "training-plan-schedule" }
- tapOn: { id: "training-plan-options-trigger" }
- tapOn: { id: "training-plan-options-duplicate" }
- tapOn: { id: "training-plan-options-schedule" }
- tapOn: { id: "training-plan-anchor-start" }
- tapOn: { id: "apply-template-anchor-date" }
- eraseText
- inputText: "${PLAN_ANCHOR_DATE}"
- hideKeyboard
- tapOn: { id: "training-plan-schedule-confirm" }
- openLink: "${MAESTRO_APP_SCHEME}://calendar-day?date=${PLAN_ANCHOR_DATE}"
- assertVisible: { id: "calendar-day-row-${PLAN_ANCHOR_DATE}" }
- tapOn: { id: "calendar-day-planned-activity-row-${PLAN_SCHEDULED_EVENT_ID}" }
- assertVisible: { id: "event-detail-activity-plan-card" }
- tapOn: { id: "event-detail-activity-plan-card" }
- tapOn: { id: "activity-plan-options-trigger" }
- tapOn: { id: "activity-plan-options-start" }
- assertVisible: { id: "recording-setup-remove-plan" }
- tapOn: { id: "recording-start-button" }
- tapOn: { id: "recording-finish-button" }
- assertVisible: { id: "recording-review-summary" }
- assertVisible: "${PLAN_ACTIVITY_PLAN_NAME}"
- back
- runFlow: ../../../reusable/open_plan_tab.yaml
- tapOn: { id: "plan-add-goal-button" }
- assertVisible: "Goal"
- back
- openLink: "${MAESTRO_APP_SCHEME}://goal-detail?id=${EDIT_GOAL_ID}"
- tapOn: { id: "goal-detail-options-trigger" }
- tapOn: { id: "goal-detail-options-edit" }
- tapOn: { id: "goal-editor-title-input" }
- eraseText
- inputText: "${EDIT_GOAL_TITLE}"
- tapOn: "Save"
- openLink: "${MAESTRO_APP_SCHEME}://goal-detail?id=${EDIT_GOAL_ID}"
- assertVisible: "${EDIT_GOAL_TITLE}"
- openLink: "${MAESTRO_APP_SCHEME}://training-preferences"
- tapOn: { id: "training-preferences-tab-availability" }
- tapOn: { id: "preferences-hard-rest-day-monday" }
- tapOn: { id: "training-preferences-save-button" }
- runFlow: { file: ../../../reusable/preserve_state_relaunch.yaml, env: { EXPECTED_BOUNDARY_ID: "home-screen" } }
- openLink: "${MAESTRO_APP_SCHEME}://training-preferences"
- tapOn: { id: "training-preferences-tab-availability" }
- assertVisible: "Remove Monday hard rest day"
- runFlow: ../../../reusable/open_own_profile.yaml
- tapOn: { id: "my-training-plans" }
- assertVisible: { id: "training-plans-list-create-trigger" }
- tapOn: { id: "training-plans-list-create-trigger" }
- tapOn: { id: "builder-edit-plan" }
- tapOn: { id: "builder-configuration-goals" }
- assertVisible: { id: "builder-goal-editor-modal" }
- tapOn: { id: "training-plan-builder-sheet-close" }
- tapOn: { id: "builder-configuration-schedulePreview" }
- assertVisible: { id: "training-plan-builder-sheet" }
