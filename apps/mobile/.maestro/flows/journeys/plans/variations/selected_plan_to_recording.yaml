appId: ${MAESTRO_APP_ID}
name: Selected planned activity opens recording with plan structure retained
tags: [variation, plans, plan-recording]
---
- runFlow: { file: ../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: { file: ../../../reusable/domain/details/open_event.yaml, env: { EVENT_ID: "${PLAN_SCHEDULED_EVENT_ID}" } }
- assertVisible: { id: "event-detail-activity-plan-card" }
- tapOn:
    id: "event-detail-activity-plan-card"
- tapOn:
    id: "activity-plan-options-trigger"
- tapOn:
    id: "activity-plan-options-start"
- extendedWaitUntil:
    visible:
      id: "record-screen-ready"
    timeout: 10000
- assertVisible: "${PLAN_ACTIVITY_PLAN_NAME}"
- assertVisible:
    id: "recording-setup-remove-plan"
- tapOn:
    id: "recording-start-button"
- extendedWaitUntil:
    visible:
      id: "activity-interval-insight-card"
    timeout: 10000
- tapOn:
    id: "recording-finish-button"
- assertVisible:
    id: "recording-review-summary"
- assertVisible: "${PLAN_ACTIVITY_PLAN_NAME}"
