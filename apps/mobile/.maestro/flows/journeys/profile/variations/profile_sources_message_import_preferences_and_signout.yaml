appId: ${MAESTRO_APP_ID}
name: "profile sources journeys/profile/account_settings_open,account_settings_update,direct_message_from_profile_v2,edit_screen_open,integrations_import_entry_open,integrations_screen_open,profile_to_activities_routes,sign_out,training_preferences_screen_open — message, import, provider, preferences and sign-out persistence"
tags: [variation, profile, settings, baseline-source-pair-b]
---
- runFlow:
    file: ../../../reusable/open_own_profile.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- tapOn: { id: "user-detail-message-button" }
- tapOn: { id: "message-input" }
- inputText: "Profile source message"
- tapOn: { id: "message-send-button" }
- assertVisible: "Profile source message"
- back
- tapOn: { id: "tab-button-profile" }
- scrollUntilVisible: { element: { id: "profile-tab-activities" }, direction: DOWN }
- tapOn: { id: "profile-tab-activities" }
- tapOn: { id: "activities-list-import-trigger" }
- assertVisible: { id: "activity-import-file-input" }
- assertVisible: { id: "activity-import-notes-input" }
- assertNotVisible: { id: "activity-import-name-input" }
- back
- back
- tapOn: { id: "profile-tab-integrations" }
- assertVisible: { id: "integration-provider-strava" }
- back
- openLink: "${MAESTRO_APP_SCHEME}://training-preferences"
- assertVisible: { id: "training-preferences-tab-schedule" }
- tapOn: { id: "training-preferences-tab-availability" }
- assertVisible: { id: "training-preferences-save-button" }
- back
- tapOn: { id: "tab-button-profile" }
- assertVisible: { id: "profile-tab-settings" }
- tapOn: { id: "profile-tab-update-email" }
- tapOn: { id: "profile-tab-email-input" }
- inputText: "not-an-email"
- tapOn: { id: "profile-tab-email-submit-button" }
- assertVisible: { id: "profile-tab-email-input" }
- back
- tapOn: { id: "profile-tab-change-password" }
- tapOn: { id: "profile-tab-new-password-input" }
- inputText: "short"
- tapOn: { id: "profile-tab-password-submit-button" }
- assertVisible: { id: "profile-tab-new-password-input" }
- back
- tapOn: { id: "profile-tab-sign-out" }
- assertVisible: "Are you sure you want to sign out?"
- back
- assertVisible: { id: "profile-tab-settings" }
- tapOn: { id: "profile-tab-sign-out" }
- tapOn: "Sign Out"
- runFlow: { file: ../../../reusable/preserve_state_relaunch.yaml, env: { EXPECTED_BOUNDARY_ID: "sign-in-screen" } }
- assertVisible: { id: "sign-in-screen" }
