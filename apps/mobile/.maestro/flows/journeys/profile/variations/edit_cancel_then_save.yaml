appId: ${MAESTRO_APP_ID}
name: Profile edit cancels a draft then saves and reopens persisted fields
tags: [variation, profile, edit]
---
- runFlow:
    file: ../../../reusable/open_own_profile.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- tapOn:
    id: "user-detail-options-trigger"
- tapOn:
    id: "user-detail-options-edit"
- tapOn:
    id: "profile-edit-bio-input"
- inputText: "Unsaved profile variation"
- back
- assertNotVisible: "Unsaved profile variation"
- tapOn:
    id: "user-detail-options-trigger"
- tapOn:
    id: "user-detail-options-edit"
- tapOn:
    id: "profile-edit-bio-input"
- eraseText
- inputText: "${PROFILE_VARIATION_BIO}"
- tapOn:
    id: "profile-edit-save-button"
- assertVisible: "${PROFILE_VARIATION_BIO}"
