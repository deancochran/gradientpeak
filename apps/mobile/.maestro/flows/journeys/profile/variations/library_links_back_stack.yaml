appId: ${MAESTRO_APP_ID}
name: Profile library links return through activities, routes, and plans
tags: [variation, profile, library-navigation]
---
- runFlow:
    file: ../../../reusable/open_own_profile.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- scrollUntilVisible:
    element:
      id: "my-activities"
    direction: DOWN
- tapOn:
    id: "my-activities"
- assertVisible:
    id: "activities-list-screen"
- back
- tapOn:
    id: "my-routes"
- assertVisible:
    id: "routes-list-screen"
- back
- tapOn:
    id: "my-training-plans"
- assertVisible:
    id: "training-plans-list-screen"
