appId: ${MAESTRO_APP_ID}
name: "profile sources journeys/profile/account_settings_open,account_settings_update,direct_message_from_profile_v2,edit_screen_open,integrations_import_entry_open,integrations_screen_open,profile_to_activities_routes,sign_out,training_preferences_screen_open — edit cancel/save, account forms and libraries"
tags: [variation, profile, settings, baseline-source-pair-a]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- tapOn: { id: "tab-button-profile" }
- tapOn: { id: "profile-tab-summary-edit" }
- assertVisible: { id: "profile-edit-avatar-button" }
- tapOn: { id: "profile-edit-full-name" }
- eraseText
- inputText: "Unsaved profile source name"
- back
- assertNotVisible: "Unsaved profile source name"
- tapOn: { id: "profile-tab-summary-edit" }
- tapOn: { id: "profile-edit-full-name" }
- eraseText
- inputText: "Maestro Profile Source"
- tapOn: { id: "profile-edit-save-button" }
- assertVisible: "Maestro Profile Source"
- scrollUntilVisible: { element: { id: "profile-tab-update-email" }, direction: DOWN }
- tapOn: { id: "profile-tab-update-email" }
- assertVisible: { id: "profile-tab-email-input" }
- assertVisible: { id: "profile-tab-email-submit-button" }
- back
- tapOn: { id: "profile-tab-change-password" }
- assertVisible: { id: "profile-tab-current-password-input" }
- assertVisible: { id: "profile-tab-new-password-input" }
- assertVisible: { id: "profile-tab-confirm-password-input" }
- back
- tapOn: { id: "profile-tab-activities" }
- assertVisible: { id: "activities-list-screen" }
- back
- tapOn: { id: "profile-tab-routes" }
- assertVisible: { id: "routes-list-screen" }
- back
- tapOn: { id: "profile-tab-training-plans" }
- assertVisible: { id: "training-plans-list-screen" }
