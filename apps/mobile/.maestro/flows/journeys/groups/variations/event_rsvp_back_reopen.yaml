appId: ${MAESTRO_APP_ID}
name: Group event RSVP survives list-detail back and reopen navigation
tags: [variation, groups, event-rsvp]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- runFlow: ../../../reusable/open_groups_tab.yaml
- scrollUntilVisible:
    element: "${GROUP_EVENT_TITLE}"
    direction: DOWN
- tapOn: "${GROUP_EVENT_TITLE}"
- tapOn: "Going"
- assertVisible: "Going"
- back
- tapOn: "${GROUP_EVENT_TITLE}"
- assertVisible: "Going"
- tapOn: "Not going"
- assertVisible: "Not going"
