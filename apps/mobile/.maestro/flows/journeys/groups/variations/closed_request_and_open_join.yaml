appId: ${MAESTRO_APP_ID}
name: Closed-group request and open-group join show distinct persisted states
tags: [variation, groups, access]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- runFlow: { file: ../../../reusable/domain/details/open_group.yaml, env: { GROUP_ID: "${CLOSED_GROUP_ID}" } }
- tapOn: "Request access"
- assertVisible: "Request pending"
- back
- runFlow: { file: ../../../reusable/domain/details/open_group.yaml, env: { GROUP_ID: "${OPEN_GROUP_ID}" } }
- tapOn: "Join group"
- assertVisible: "Member"
- back
- runFlow: { file: ../../../reusable/domain/details/open_group.yaml, env: { GROUP_ID: "${CLOSED_GROUP_ID}" } }
- assertVisible: "Request pending"
