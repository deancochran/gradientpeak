appId: ${MAESTRO_APP_ID}
name: "group sources journeys/groups/group_event_visibility_and_series_overrides,private_group_event_detail_blocked — event detail, series RSVP, occurrence override and private access block"
tags: [variation, groups, baseline-source-pair-a]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- runFlow: ../../../reusable/open_groups_tab.yaml
- scrollUntilVisible: { element: "${GROUP_EVENT_TITLE}", direction: DOWN }
- tapOn: "${GROUP_EVENT_TITLE}"
- assertVisible: "Series RSVP"
- assertVisible: "Future dates"
- tapOn: "Going to series"
- assertVisible: "Going to series"
- tapOn: "Not going"
- assertVisible: "Not going"
- back
- tapOn: "${GROUP_EVENT_TITLE}"
- assertVisible: "Not going"
- openLink: "${MAESTRO_APP_SCHEME}://group-event-detail?groupEventId=${PRIVATE_GROUP_EVENT_ID}"
- assertVisible: "This group event may be unavailable."
- assertNotVisible: "Edit event"
- assertNotVisible: "RSVP"
