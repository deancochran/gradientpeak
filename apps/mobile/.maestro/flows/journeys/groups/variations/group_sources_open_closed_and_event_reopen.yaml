appId: ${MAESTRO_APP_ID}
name: "group sources journeys/groups/group_event_visibility_and_series_overrides,private_group_event_detail_blocked — open join, closed request cancellation and event RSVP reopen"
tags: [variation, groups, baseline-source-pair-b]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- openLink: "${MAESTRO_APP_SCHEME}://group-detail?groupId=${CLOSED_GROUP_ID}"
- tapOn: "Request access"
- assertVisible: "Request pending"
- tapOn: "Cancel request"
- assertVisible: "Request access"
- tapOn: "Request access"
- back
- openLink: "${MAESTRO_APP_SCHEME}://group-detail?groupId=${OPEN_GROUP_ID}"
- tapOn: "Join group"
- assertVisible: "Member"
- runFlow: ../../../reusable/open_groups_tab.yaml
- scrollUntilVisible: { element: "${GROUP_EVENT_TITLE}", direction: DOWN }
- tapOn: "${GROUP_EVENT_TITLE}"
- tapOn: "Going"
- assertVisible: "Going"
- back
- tapOn: "${GROUP_EVENT_TITLE}"
- assertVisible: "Going"
- openLink: "${MAESTRO_APP_SCHEME}://group-event-detail?groupEventId=${PRIVATE_GROUP_EVENT_ID}"
- assertNotVisible: "RSVP"
