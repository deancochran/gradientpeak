appId: com.deancochran.gradientpeak.dev
env:
  STANDARD_USER_EMAIL: "test@example.com"
  STANDARD_USER_PASS: "password123"
---
- runFlow:
    file: ../../reusable/open_own_profile.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- tapOn:
    id: "my-training-plans"
- extendedWaitUntil:
    visible:
      id: "training-plans-list-screen"
    timeout: 10000
- tapOn:
    id: "training-plans-list-create-trigger"
- extendedWaitUntil:
    visible:
      id: "builder-strategy-composer"
    timeout: 10000
- tapOn:
    id: "builder-edit-plan"
- assertVisible:
    id: "builder-plan-name-input"
- tapOn:
    id: "builder-plan-name-input"
- inputText: "Maestro Draft Plan"
- tapOn:
    id: "training-plan-builder-sheet-save"
- assertVisible:
    id: "builder-strategy-composer"
- tapOn:
    id: "builder-configuration-schedulePreview"
- assertVisible:
    id: "training-plan-builder-sheet"
- tapOn:
    id: "training-plan-builder-sheet-close"
- assertVisible:
    id: "builder-strategy-composer"
- tapOn:
    id: "builder-configuration-goals"
- assertVisible:
    id: "builder-goal-editor-modal"
- tapOn:
    id: "training-plan-builder-sheet-close"
- assertVisible:
    id: "builder-strategy-composer"
- tapOn:
    id: "builder-add-workout"
- assertVisible:
    id: "training-plan-builder-activity-picker-search-input"
- tapOn:
    id: "training-plan-builder-activity-picker-filter-button"
- assertVisible:
    id: "training-plan-builder-activity-filter-sheet"
- tapOn:
    id: "training-plan-builder-sheet-back"
- assertVisible:
    id: "training-plan-builder-activity-picker-search-input"
- tapOn:
    id: "training-plan-builder-sheet-close"
- assertVisible:
    id: "builder-strategy-composer"
- assertVisible:
    id: "training-plan-save-button"
