appId: ${MAESTRO_APP_ID}
name: Historical FIT import selects, processes, and opens deterministic activity content
properties:
  junitId: journey.mobile.integrations.historical_fit_import
  junitClassname: journey.mobile.integrations
---
- runFlow:
    file: ../../reusable/open_own_profile.yaml
    env:
      STANDARD_USER_EMAIL: "${FIT_IMPORT_USER_EMAIL_A}"
      STANDARD_USER_PASS: "${FIT_IMPORT_USER_PASS_A}"
- tapOn:
    id: "my-activities"
- extendedWaitUntil:
    visible:
      id: "activities-list-screen"
    timeout: 10000
- tapOn:
    id: "activities-list-import-trigger"
- extendedWaitUntil:
    visible:
      id: "activity-import-screen"
    timeout: 10000
- assertVisible:
    id: "activity-import-file-input"
- assertNotVisible:
    id: "activity-import-name-input"
- assertVisible:
    id: "activity-import-notes-input"
- assertVisible:
    id: "activity-import-submit-button"
- tapOn:
    id: "activity-import-file-input"
- extendedWaitUntil:
    visible: "${FIT_IMPORT_FILE_DISPLAY_NAME_A}"
    timeout: 10000
- tapOn: "${FIT_IMPORT_FILE_DISPLAY_NAME_A}"
- assertVisible: "${FIT_IMPORT_FILE_DISPLAY_NAME_A}"
- assertVisible:
    id: "activity-import-file-input-clear"
- tapOn:
    id: "activity-import-submit-button"
- extendedWaitUntil:
    visible:
      id: "activity-import-summary"
    timeout: 60000
- assertVisible: "Historical activity imported"
- assertVisible: "${FIT_IMPORT_FILE_DISPLAY_NAME_A}"
- tapOn:
    id: "activity-import-view-activity-button"
- extendedWaitUntil:
    visible:
      id: "activity-detail-screen"
    timeout: 30000
- assertVisible:
    id: "activity-detail-summary"
- assertVisible: "${FIT_IMPORT_ACTIVITY_TITLE_A}"
- tapOn:
    id: "activity-detail-tab-breakdown"
- assertVisible:
    id: "activity-derived-efforts"
