appId: ${MAESTRO_APP_ID}
name: "integration sources journeys/integrations/historical_fit_import, profile/integrations_import_entry_open,profile/integrations_screen_open, contracts/p1/provider_local_connect_persists,provider_local_sync_imports,provider_local_sync_retry — FIT form, connect, sync and imported activity"
tags: [variation, integrations, baseline-source-pair-a]
---
- runFlow:
    file: ../../../reusable/open_own_profile.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- tapOn: { id: "my-activities" }
- tapOn: { id: "activities-list-import-trigger" }
- assertVisible: { id: "activity-import-file-input" }
- assertNotVisible: { id: "activity-import-name-input" }
- assertVisible: { id: "activity-import-notes-input" }
- assertVisible: { id: "activity-import-submit-button" }
- back
- back
- tapOn: { id: "manage-integrations-button" }
- assertVisible: { id: "integration-provider-strava" }
- tapOn: { id: "integration-connect-${LOCAL_PROVIDER_ID}" }
- assertVisible: { id: "integration-sync-now-${LOCAL_PROVIDER_ID}" }
- back
- openLink: "${MAESTRO_APP_SCHEME}://integrations"
- assertVisible: { id: "integration-disconnect-${LOCAL_PROVIDER_ID}" }
- tapOn: { id: "integration-sync-now-${LOCAL_PROVIDER_ID}" }
- tapOn: { id: "integration-view-import-${LOCAL_PROVIDER_ID}" }
- tapOn: { id: "activities-list-item-${LOCAL_PROVIDER_IMPORTED_ACTIVITY_ID}" }
- assertVisible: { id: "activity-detail-summary" }
