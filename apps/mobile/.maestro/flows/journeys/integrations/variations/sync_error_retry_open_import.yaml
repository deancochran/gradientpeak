appId: ${MAESTRO_APP_ID}
name: Provider sync error retries and opens the imported activity card
tags: [variation, integrations, retry-import]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- openLink: "${MAESTRO_APP_SCHEME}://integrations"
- tapOn:
    id: "integration-sync-now-${LOCAL_PROVIDER_ID}"
- assertVisible:
    id: "integration-provider-sync-error-${LOCAL_PROVIDER_ID}"
- tapOn:
    id: "integration-retry-sync-${LOCAL_PROVIDER_ID}"
- tapOn:
    id: "integration-view-import-${LOCAL_PROVIDER_ID}"
- tapOn:
    id: "activities-list-item-${LOCAL_PROVIDER_IMPORTED_ACTIVITY_ID}"
- assertVisible:
    id: "activity-detail-summary"
