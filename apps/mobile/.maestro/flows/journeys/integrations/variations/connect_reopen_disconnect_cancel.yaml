appId: ${MAESTRO_APP_ID}
name: Provider connect persists and disconnect confirmation can be cancelled
tags: [variation, integrations, connect]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- openLink: "${MAESTRO_APP_SCHEME}://integrations"
- tapOn:
    id: "integration-connect-${LOCAL_PROVIDER_ID}"
- assertVisible:
    id: "integration-sync-now-${LOCAL_PROVIDER_ID}"
- back
- openLink: "${MAESTRO_APP_SCHEME}://integrations"
- assertVisible:
    id: "integration-disconnect-${LOCAL_PROVIDER_ID}"
- tapOn:
    id: "integration-disconnect-${LOCAL_PROVIDER_ID}"
- assertVisible: "Disconnect"
- back
- assertVisible:
    id: "integration-sync-now-${LOCAL_PROVIDER_ID}"
