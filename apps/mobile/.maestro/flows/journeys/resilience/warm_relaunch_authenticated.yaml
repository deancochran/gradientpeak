appId: ${MAESTRO_APP_ID}
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- assertVisible: "Plan"
- runFlow:
    file: ../../reusable/preserve_state_relaunch.yaml
    env:
      EXPECTED_BOUNDARY_ID: "home-screen"
- extendedWaitUntil:
    visible: "Plan"
    timeout: 8000
- assertVisible:
    id: "messages-header-button"
- assertVisible:
    id: "notifications-header-button"
