appId: ${MAESTRO_APP_ID}
name: Activity history filter opens and reopens the matching canonical card
tags: [variation, activities, filter-detail]
---
- runFlow:
    file: ../../../reusable/open_own_profile.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- tapOn:
    id: "my-activities"
- tapOn:
    id: "activities-list-filter-button"
- assertVisible:
    id: "activities-list-filter-sheet"
- tapOn:
    id: "activities-list-filter-category-${FILTER_ACTIVITY_CATEGORY}"
- tapOn:
    id: "activities-list-filter-sort-${FILTER_ACTIVITY_SORT}"
- tapOn: "Apply filters"
- scrollUntilVisible:
    element:
      id: "activities-list-item-${FILTER_ACTIVITY_ID}"
    direction: DOWN
- tapOn:
    id: "activities-list-item-${FILTER_ACTIVITY_ID}"
- assertVisible:
    id: "activity-detail-summary"
- assertVisible: "${FILTER_ACTIVITY_TITLE}"
- back
- assertVisible:
    id: "activities-list-filter-button-dot"
- tapOn:
    id: "activities-list-item-${FILTER_ACTIVITY_ID}"
- assertVisible: "${FILTER_ACTIVITY_TITLE}"
