appId: ${MAESTRO_APP_ID}
name: "activity sources journeys/activities/detail_open,list_screen_open, social/activity_detail_like_and_comment, contracts/p0/completed_activity_route_persistence, contracts/p1/activity_delete_persists,activity_privacy_persists,activity_public_share_handoff_android — filter, metrics, map, social and visibility"
tags: [variation, activities, baseline-source-pair-a]
---
- runFlow:
    file: ../../../reusable/open_own_profile.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- tapOn: { id: "my-activities" }
- assertVisible: { id: "activities-list-screen" }
- tapOn: { id: "activities-list-filter-button" }
- tapOn: { id: "activities-list-filter-category-${FILTER_ACTIVITY_CATEGORY}" }
- tapOn: { id: "activities-list-filter-sort-${FILTER_ACTIVITY_SORT}" }
- tapOn: "Apply filters"
- scrollUntilVisible: { element: { id: "activities-list-item-${FILTER_ACTIVITY_ID}" }, direction: DOWN }
- tapOn: { id: "activities-list-item-${FILTER_ACTIVITY_ID}" }
- assertVisible: "${FILTER_ACTIVITY_TITLE}"
- assertVisible: { id: "activity-detail-summary" }
- scrollUntilVisible: { element: { id: "activity-detail-metrics" }, direction: DOWN }
- assertVisible: { id: "activity-detail-map" }
- tapOn: { id: "activity-detail-like-button" }
- assertVisible: { id: "activity-detail-liked" }
- tapOn: { id: "activity-detail-comment-input" }
- inputText: "Maestro activity detail variation"
- tapOn: { id: "activity-detail-comment-submit" }
- assertVisible: "Maestro activity detail variation"
- openLink: "${MAESTRO_APP_SCHEME}://activity-detail?id=${PRIVACY_ACTIVITY_ID}"
- tapOn: { id: "activity-detail-options-trigger" }
- tapOn: { id: "activity-detail-options-visibility" }
- tapOn: "Public"
- back
- openLink: "${MAESTRO_APP_SCHEME}://activity-detail?id=${PRIVACY_ACTIVITY_ID}"
- tapOn: { id: "activity-detail-options-trigger" }
- tapOn: { id: "activity-detail-options-visibility" }
- assertVisible: "Public"
- openLink: "${MAESTRO_APP_SCHEME}://activity-detail?id=${ROUTE_ACTIVITY_ID}"
- assertVisible: { id: "activity-detail-linked-route-${RECORDING_ROUTE_ID}" }
