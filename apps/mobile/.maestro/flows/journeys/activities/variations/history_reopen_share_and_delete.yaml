appId: ${MAESTRO_APP_ID}
name: "activity sources journeys/activities/detail_open,list_screen_open, social/activity_detail_like_and_comment, contracts/p0/completed_activity_route_persistence, contracts/p1/activity_delete_persists,activity_privacy_persists,activity_public_share_handoff_android — reopen, share handoff, route relation and delete confirmation"
tags: [variation, activities, baseline-source-pair-b, android-share]
---
- runFlow:
    file: ../../../reusable/open_own_profile.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- tapOn: { id: "my-activities" }
- scrollUntilVisible: { element: { id: "activities-list-item-${PUBLIC_ACTIVITY_ID}" }, direction: DOWN }
- tapOn: { id: "activities-list-item-${PUBLIC_ACTIVITY_ID}" }
- assertVisible: { id: "activity-detail-summary" }
- back
- tapOn: { id: "activities-list-item-${PUBLIC_ACTIVITY_ID}" }
- tapOn: { id: "activity-card-share-button-${PUBLIC_ACTIVITY_ID}" }
- assertNotVisible: "Not public"
- back
- openLink: "${MAESTRO_APP_SCHEME}://activity-detail?id=${ROUTE_ACTIVITY_ID}"
- tapOn: { id: "activity-detail-linked-route-${RECORDING_ROUTE_ID}" }
- assertVisible: { id: "route-detail-summary" }
- back
- assertVisible: { id: "activity-detail-linked-route-${RECORDING_ROUTE_ID}" }
- openLink: "${MAESTRO_APP_SCHEME}://activity-detail?id=${DELETE_ACTIVITY_ID}"
- tapOn: { id: "activity-detail-options-trigger" }
- tapOn: { id: "activity-detail-options-delete" }
- assertVisible: { id: "activity-detail-delete-modal" }
- back
- assertVisible: { id: "activity-detail-summary" }
- tapOn: { id: "activity-detail-options-trigger" }
- tapOn: { id: "activity-detail-options-delete" }
- tapOn: { id: "activity-detail-delete-confirm" }
- extendedWaitUntil: { notVisible: { id: "activity-detail-screen" }, timeout: 15000 }
- openLink: "${MAESTRO_APP_SCHEME}://activity-detail?id=${DELETE_ACTIVITY_ID}"
- assertVisible: "Activity not found"
