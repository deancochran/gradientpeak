appId: ${MAESTRO_APP_ID}
name: Activity deletion cancel preserves detail before confirmation removes it
tags: [variation, activities, delete-confirmation]
---
- runFlow: { file: ../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: { file: ../../../reusable/domain/details/open_activity.yaml, env: { ACTIVITY_ID: "${DELETE_ACTIVITY_ID}" } }
- runFlow: ../../../reusable/domain/destructive/cancel_activity_delete.yaml
- assertVisible:
    id: "activity-detail-summary"
- runFlow: ../../../reusable/domain/destructive/confirm_activity_delete.yaml
- openLink: "${MAESTRO_APP_SCHEME}://activity-detail?id=${DELETE_ACTIVITY_ID}"
- assertVisible: "Activity not found"
