appId: ${MAESTRO_APP_ID}
name: "activity source contracts/p1/activity_public_share_handoff_android — public profile activity opens canonical detail and hands off to Android share target"
tags: [variation, activities, share, android, baseline-source-second]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- openLink: "${MAESTRO_APP_SCHEME}://user/${PUBLIC_TARGET_USER_ID}"
- scrollUntilVisible: { element: { id: "user-detail-activity-${PUBLIC_ACTIVITY_ID}" }, direction: DOWN }
- tapOn: { id: "user-detail-activity-${PUBLIC_ACTIVITY_ID}" }
- assertVisible: { id: "activity-detail-summary" }
- tapOn: { id: "activity-card-share-button-${PUBLIC_ACTIVITY_ID}" }
- assertNotVisible: "Not public"
- assertVisible: "Share with"
