appId: ${MAESTRO_APP_ID}
name: Activity visibility sheet cancels then persists a chosen state
tags: [variation, activities, visibility]
---
- runFlow: { file: ../../../reusable/authenticated_home.yaml, env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" } }
- runFlow: { file: ../../../reusable/domain/details/open_activity.yaml, env: { ACTIVITY_ID: "${PRIVACY_ACTIVITY_ID}" } }
- tapOn:
    id: "activity-detail-options-trigger"
- tapOn:
    id: "activity-detail-options-visibility"
- assertVisible: "Change visibility"
- back
- assertVisible:
    id: "activity-detail-summary"
- tapOn:
    id: "activity-detail-options-trigger"
- tapOn:
    id: "activity-detail-options-visibility"
- tapOn: "Public"
- back
- runFlow: { file: ../../../reusable/domain/details/open_activity.yaml, env: { ACTIVITY_ID: "${PRIVACY_ACTIVITY_ID}" } }
- tapOn:
    id: "activity-detail-options-trigger"
- tapOn:
    id: "activity-detail-options-visibility"
- assertVisible: "Public"
