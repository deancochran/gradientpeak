appId: com.deancochran.gradientpeak.dev
env:
  TARGET_USERNAME: "coachcasey"
  TARGET_USER_ID: "2f3c344a-a44d-4541-8833-3b52bcefb130"
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- runFlow:
    file: ../../reusable/open_discover_tab.yaml
- tapOn:
    id: "discover-scope-users"
- tapOn:
    id: "discover-search-input"
- inputText: "${TARGET_USERNAME}"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "discover-user-${TARGET_USER_ID}"
    timeout: 10000
- tapOn:
    id: "discover-user-${TARGET_USER_ID}"
- extendedWaitUntil:
    visible:
      id: "user-detail-screen"
    timeout: 10000
- runFlow:
    when:
      visible:
        id: "user-detail-requested-button"
    commands:
      - tapOn:
          id: "user-detail-requested-button"
- runFlow:
    when:
      visible:
        id: "user-detail-unfollow-button"
    commands:
      - tapOn:
          id: "user-detail-unfollow-button"
- assertVisible:
    id: "user-detail-follow-button"
- tapOn:
    id: "user-detail-follow-button"
- extendedWaitUntil:
    visible:
      id: "user-detail-requested-button"
    timeout: 10000
- tapOn:
    id: "user-detail-requested-button"
- assertVisible:
    id: "user-detail-follow-button"
