appId: ${MAESTRO_APP_ID}
name: "social sources discover/profile_detail_open, main/discover_user_profile, main/profile_screen, journeys/social/follow_target_from_profile,activity_detail_like_and_comment, contracts/p2/social_private_follow_request_persists,social_public_follow_persists — private request cancellation, public persistence and profile reopen"
tags: [variation, social, discover, baseline-source-pair-b]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- runFlow: ../../../reusable/open_discover_tab.yaml
- tapOn: { id: "discover-scope-users" }
- tapOn: { id: "discover-search-input" }
- inputText: "${PRIVATE_TARGET_USERNAME}"
- hideKeyboard
- tapOn: { id: "discover-user-${PRIVATE_TARGET_USER_ID}" }
- tapOn: { id: "user-detail-follow-button" }
- assertVisible: { id: "user-detail-requested-button" }
- tapOn: { id: "user-detail-requested-button" }
- assertVisible: { id: "user-detail-follow-button" }
- back
- tapOn: { id: "discover-user-${PRIVATE_TARGET_USER_ID}" }
- tapOn: { id: "user-detail-follow-button" }
- assertVisible: { id: "user-detail-requested-button" }
- openLink: "${MAESTRO_APP_SCHEME}://user/${PUBLIC_TARGET_USER_ID}"
- tapOn: { id: "user-detail-follow-button" }
- assertVisible: { id: "user-detail-unfollow-button" }
- back
- openLink: "${MAESTRO_APP_SCHEME}://user/${PUBLIC_TARGET_USER_ID}"
- assertVisible: { id: "user-detail-unfollow-button" }
- tapOn: { id: "user-detail-activity-${PUBLIC_TARGET_ACTIVITY_ID}" }
- tapOn: { id: "activity-detail-like-button" }
- back
- assertVisible: { id: "user-detail-summary" }
