appId: ${MAESTRO_APP_ID}
name: Private profile request cancels and can be requested again after reopen
tags: [variation, social, private-profile]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- openLink: "${MAESTRO_APP_SCHEME}://user/${PRIVATE_TARGET_USER_ID}"
- tapOn:
    id: "user-detail-follow-button"
- assertVisible:
    id: "user-detail-requested-button"
- tapOn:
    id: "user-detail-requested-button"
- assertVisible:
    id: "user-detail-follow-button"
- back
- openLink: "${MAESTRO_APP_SCHEME}://user/${PRIVATE_TARGET_USER_ID}"
- tapOn:
    id: "user-detail-follow-button"
- assertVisible:
    id: "user-detail-requested-button"
