appId: ${MAESTRO_APP_ID}
name: Public follow persists while opening an activity and returning to profile
tags: [variation, social, public-profile]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- openLink: "${MAESTRO_APP_SCHEME}://user/${PUBLIC_TARGET_USER_ID}"
- tapOn:
    id: "user-detail-follow-button"
- assertVisible:
    id: "user-detail-unfollow-button"
- scrollUntilVisible:
    element:
      id: "user-detail-activity-${PUBLIC_TARGET_ACTIVITY_ID}"
    direction: DOWN
- tapOn:
    id: "user-detail-activity-${PUBLIC_TARGET_ACTIVITY_ID}"
- assertVisible:
    id: "activity-detail-summary"
- back
- assertVisible:
    id: "user-detail-unfollow-button"
