# @arg STANDARD_USER_EMAIL email required
# @arg STANDARD_USER_PASS secret required
appId: com.deancochran.gradientpeak.dev
---
- runFlow:
    file: ../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- runFlow:
    file: ../../reusable/open_notifications_inbox.yaml
- assertVisible:
    id: "notifications-screen"
- assertVisible:
    id: "notifications-list"
