appId: ${MAESTRO_APP_ID}
name: "notification sources journeys/notifications/inbox_expect_text,inbox_open,read_all, contracts/p2/notification_follow_accept_resolves,notification_follow_reject_resolves — unread destination, return, accept and read persistence"
tags: [variation, notifications, baseline-source-pair-a]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- runFlow: ../../../reusable/open_notifications_inbox.yaml
- assertVisible: { id: "notifications-list" }
- tapOn: { id: "notifications-unread-filter" }
- assertVisible: { id: "notification-unread-${DESTINATION_NOTIFICATION_ID}" }
- tapOn: { id: "notification-open-${DESTINATION_NOTIFICATION_ID}" }
- assertVisible: { id: "message-thread-screen" }
- assertVisible: "${DESTINATION_NOTIFICATION_TEXT}"
- back
- assertNotVisible: { id: "notification-unread-${DESTINATION_NOTIFICATION_ID}" }
- tapOn: { id: "notification-accept-${FOLLOW_REQUEST_NOTIFICATION_ID}" }
- assertNotVisible: { id: "notification-reject-${FOLLOW_REQUEST_NOTIFICATION_ID}" }
- back
- runFlow: ../../../reusable/open_notifications_inbox.yaml
- assertNotVisible: { id: "notification-accept-${FOLLOW_REQUEST_NOTIFICATION_ID}" }
- tapOn: { id: "notifications-read-all-trigger" }
- assertVisible: { id: "notifications-screen" }
