appId: ${MAESTRO_APP_ID}
name: "notification sources journeys/notifications/inbox_expect_text,inbox_open,read_all, contracts/p2/notification_follow_accept_resolves,notification_follow_reject_resolves — reject, read-all, relaunch and destination reopen"
tags: [variation, notifications, baseline-source-pair-b]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env: { STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}", STANDARD_USER_PASS: "${STANDARD_USER_PASS}" }
- runFlow: ../../../reusable/open_notifications_inbox.yaml
- tapOn: { id: "notification-reject-${FOLLOW_REJECT_NOTIFICATION_ID}" }
- assertNotVisible: { id: "notification-accept-${FOLLOW_REJECT_NOTIFICATION_ID}" }
- tapOn: { id: "notifications-read-all-trigger" }
- assertNotVisible: { id: "notification-unread-${DESTINATION_NOTIFICATION_ID}" }
- runFlow: { file: ../../../reusable/preserve_state_relaunch.yaml, env: { EXPECTED_BOUNDARY_ID: "home-screen" } }
- runFlow: ../../../reusable/open_notifications_inbox.yaml
- assertNotVisible: { id: "notification-reject-${FOLLOW_REJECT_NOTIFICATION_ID}" }
- assertNotVisible: { id: "notification-unread-${DESTINATION_NOTIFICATION_ID}" }
- tapOn: { id: "notification-open-${DESTINATION_NOTIFICATION_ID}" }
- assertVisible: "${DESTINATION_NOTIFICATION_TEXT}"
- back
- assertVisible: { id: "notifications-screen" }
