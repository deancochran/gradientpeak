appId: ${MAESTRO_APP_ID}
name: Notification inbox accepts and rejects separate follow requests
tags: [variation, notifications, follow-requests]
---
- runFlow:
    file: ../../../reusable/authenticated_home.yaml
    env:
      STANDARD_USER_EMAIL: "${STANDARD_USER_EMAIL}"
      STANDARD_USER_PASS: "${STANDARD_USER_PASS}"
- runFlow: ../../../reusable/open_notifications_inbox.yaml
- tapOn:
    id: "notification-accept-${FOLLOW_REQUEST_NOTIFICATION_ID}"
- assertNotVisible:
    id: "notification-reject-${FOLLOW_REQUEST_NOTIFICATION_ID}"
- tapOn:
    id: "notification-reject-${FOLLOW_REJECT_NOTIFICATION_ID}"
- assertNotVisible:
    id: "notification-accept-${FOLLOW_REJECT_NOTIFICATION_ID}"
- back
- runFlow: ../../../reusable/open_notifications_inbox.yaml
- assertNotVisible:
    id: "notification-accept-${FOLLOW_REQUEST_NOTIFICATION_ID}"
- assertNotVisible:
    id: "notification-reject-${FOLLOW_REJECT_NOTIFICATION_ID}"
